global: false
definition:
  type: rvn-eks-addons
  name: EKS Add-ons
  description: Selectable add-ons for an existing EKS cluster - Karpenter autoscaling, the AWS Load Balancer Controller, the External Secrets Operator, EBS CSI storage, workload logs and metrics shipped to any combination of destinations (an in-cluster log store on S3 and Amazon Managed Prometheus by default; CloudWatch, Grafana Cloud, Datadog, New Relic or a custom OTLP endpoint on request), Ravion EKS Management via the in-cluster Beacon agent, and shared application/network load balancers, each toggled and configured independently.
release:
  version: 0.8.4
  description: >-
    Beacon chart 0.4.1, and beacon_image_tag is a plain pin. Every release so far ignored the tag
    after its first apply (the original "floor, not a pin" design), which froze whatever tag was
    first applied into the state for good: a cluster once given a since-retired tag was rolled back
    to it on every upgrade and wedged when that image could not start. Now the pin is asserted for
    exactly as long as it is configured and removing it hands
    the version back to the control plane on the next apply. The 0.4.1 chart preserves the running
    image whole (registry included, so a stale image.repository in beacon_helm_values no longer
    re-renders a tag that registry never held) and only when the release's rollout has settled;
    a wedged release takes the chart's floor, so a plain re-apply repairs it. If your instance has
    beacon_image_tag or an image.repository override in its advanced variables from before 0.8.0,
    remove both when upgrading.
    Previously (0.8.3): Beacon chart 0.4.0 - an add-ons apply no longer moves the agent version;
    the chart re-emits the running image on every helm upgrade, and gains httpProxy.credentials
    for rendering Grafana Cloud and in-cluster Prometheus through the agent.
    Previously (0.8.2): the pre-0.8.0 logs_enabled / metrics_enabled / cloudwatch_observability_enabled
    Terraform variables are gone; the provider lists are the only switch. An instance still on 0.7.x
    should upgrade to 0.8.1 first, which is what reads them.
module:
  inputs:
    - id: cluster
      immutable: true
      label: EKS cluster
      mapped_inputs:
        - id: section_aws
          label: AWS account & region
          type: section
        - default: << ref.input.aws_account_id >>
          id: aws_account_id
          immutable: true
          label: AWS account
          type: string
          values: $values:ravion/aws_accounts
        - default: << ref.input.aws_region >>
          id: aws_region
          immutable: true
          label: Region
          type: string
          values: $values:aws/regions
        - collapsible: true
          default: << ref.input.execution_environment_id >>
          description: Execution environment for Pipeline Terraform runners. Defaults to the cluster module's execution environment. When Karpenter is enabled on a private cluster, it must run inside the cluster VPC with the cluster's Ravion Runner security group attached so Helm can reach the Kubernetes API endpoint.
          id: execution_environment_id
          label: Terraform execution environment
          type: string
          values: $values:ravion/execution_environments
        - id: section_cluster
          label: EKS cluster
          type: section
        - default: <<ref.stack.output.cluster_name>>
          id: cluster_name
          immutable: true
          label: Cluster name
          required: true
          type: string
        - collapsible: true
          default: <<ref.stack.output.ravion_runner_role_arn>>
          description: IAM role assumed for Kubernetes API authentication when installing Helm charts. Defaults to the cluster's Ravion Runner role.
          id: ravion_runner_role_arn
          label: Ravion Runner role ARN
          type: string
        - collapsible: true
          default: <<ref.stack.output.cluster_security_group_id>>
          description: EKS-managed cluster security group attached to Karpenter-launched nodes.
          id: cluster_security_group_id
          label: Cluster security group ID
          type: string
        - add_button_label: Add subnet ID
          collapsible: true
          default: <<ref.stack.output.node_subnet_ids>>
          description: Subnets the default Karpenter NodePool launches nodes into. Also used by internal shared load balancers.
          id: node_subnet_ids
          label: Node subnet IDs
          type: string_array
        - add_button_label: Add subnet ID
          collapsible: true
          default: <<ref.stack.output.public_subnet_ids>>
          description: Public subnets for internet-facing shared load balancers.
          id: public_subnet_ids
          label: Public subnet IDs
          type: string_array
      required: true
      type: $ref:rvn-eks
    - description: Ravion's in-cluster agent, Beacon. It dials Ravion outbound over a single WebSocket - nothing ever reaches into the cluster - and reports workload, rollout, and node state back, which is what makes a private-endpoint cluster observable from Ravion at all. Optionally it also runs Ravion's deploys from inside the cluster. Requires Kubernetes API connectivity from the Terraform runner for the install itself.
      id: section_beacon
      label: Ravion EKS Management
      type: section
    - default: false
      description: Register this cluster with the Ravion control plane and install the Beacon agent. Ravion issues the agent's credential during the deployment - there is nothing to paste - and it is written into a Kubernetes secret and mirrored into AWS Secrets Manager in your own account. The agent is read-only unless Beacon-run deployments below are enabled. Advanced settings - the agent WebSocket endpoint, Helm chart version, install namespace, and the namespaces the agent may observe - are available through Advanced Terraform variables.
      id: beacon_enabled
      label: Ravion EKS Management
      type: boolean
    - default: false
      description: Let Beacon run Ravion's deploys from inside the cluster instead of Ravion reaching in from outside. In the namespaces below the agent can create, update, and delete workload objects; it can never create RBAC objects, namespaces, or anything cluster-scoped. Leaving this off still gives a fully working agent - deploys continue to run from outside the cluster.
      id: beacon_deploy_enabled
      label: Beacon-run deployments
      show_when:
        beacon_enabled: true
      type: boolean
    - add_button_label: Add namespace
      collapsible: true
      description: Namespaces Beacon may deploy into. Falls back to the observed namespaces (beacon_namespace_scope) when empty. If both are empty the install fails rather than granting cluster-wide write - there is deliberately no deploy-everywhere posture.
      id: beacon_deploy_namespaces
      label: Deploy namespaces
      placeholder: default
      show_when:
        beacon_deploy_enabled: true
      type: string_array
    - description: Just-in-time node autoscaling. Provisions Karpenter end to end - controller and node IAM roles, Pod Identity association, instance profile, interruption queue, EventBridge rules, the controller Helm charts, and a default NodePool. Requires Kubernetes API connectivity from the Terraform runner.
      id: section_karpenter
      label: Karpenter
      type: section
    - default: true
      id: karpenter_enabled
      label: Karpenter
      type: boolean
    - collapsible: true
      description: Version of the Karpenter Helm chart (and karpenter-crd chart) to install.
      id: karpenter_chart_version
      label: Chart version
      placeholder: 1.14.0
      show_when:
        karpenter_enabled: true
      type: string
    - collapsible: true
      description: Namespace where the Karpenter controller is installed.
      id: karpenter_controller_namespace
      label: Controller namespace
      placeholder: kube-system
      show_when:
        karpenter_enabled: true
      type: string
    - collapsible: true
      description: Service account name used by the Karpenter controller.
      id: karpenter_controller_service_account
      label: Controller service account
      placeholder: karpenter
      show_when:
        karpenter_enabled: true
      type: string
    - default: true
      description: Create a general-purpose default NodePool and EC2NodeClass so Karpenter can provision nodes out of the box. Disable to manage NodePools yourself.
      id: karpenter_default_node_pool_enabled
      label: Default NodePool
      show_when:
        karpenter_enabled: true
      type: boolean
    - description: EBS-backed persistent volumes via the aws-ebs-csi-driver EKS add-on and its Pod Identity role.
      id: section_ebs_csi
      label: EBS CSI driver
      type: section
    - default: false
      id: ebs_csi_driver_enabled
      label: EBS CSI driver
      type: boolean
    - collapsible: true
      description: Pinned add-on version. Leave blank to let AWS resolve the most recent compatible version.
      id: ebs_csi_addon_version
      label: Add-on version
      placeholder: Latest compatible
      show_when:
        ebs_csi_driver_enabled: true
      type: string
    - description: >-
        Container output, collected on every node and delivered to the destinations you
        choose. On by default into a log store that runs inside your cluster and keeps
        every line in an S3 bucket in your own AWS account - Ravion reads that through
        the same agent connection Ravion EKS Management uses, so there is no endpoint to
        secure and no log data leaves your account except in answer to a query. Add
        CloudWatch Logs or a vendor beside it, or instead of it. Requires Kubernetes API
        connectivity from the Terraform runner.
      id: section_logs
      label: Logs
      type: section
    - default: true
      description: >-
        Collect container logs. On by default into the in-cluster store, whose only cost
        is storage and requests on the S3 bucket plus the pods that run the collector -
        there is no per-gigabyte ingestion charge. Turn this off to run no collector and
        create no store; the Logs tab then says logs are off for this cluster. Advanced
        settings - install namespace, chart versions, resources, and local disk - are
        available through Advanced Terraform variables.
      id: logs_enabled
      label: Logs
      type: boolean
    - add_button_label: Add destination
      default:
        - loki
      description: >-
        Where the logs go. Pick as many as you like. Ravion's Logs tab reads from the
        first destination in the first group that can answer, and falls back to the next
        when it cannot - the in-cluster store, then CloudWatch Logs. Everything in the
        second group receives a copy and gets an "Open in ..." link in the tab; the
        collectors read each file once whatever the number of destinations, but every
        vendor bills for what it receives.
      id: logs_providers
      label: Providers
      show_when:
        logs_enabled: true
      type: string_array
      values:
        - group_label: Renders in Ravion's Logs tab (read first)
          label: In-cluster log store (Loki, S3-backed)
          value: loki
        - group_label: Renders in Ravion's Logs tab (fallback)
          label: Amazon CloudWatch Logs
          value: cloudwatch
        - group_label: Ships to your vendor
          label: Grafana Cloud Logs
          value: grafana_cloud
        - group_label: Ships to your vendor
          label: Datadog
          value: datadog
        - group_label: Ships to your vendor
          label: New Relic
          value: new_relic
        - group_label: Ships to your vendor
          label: Amazon OpenSearch Service
          value: opensearch
        - group_label: Ships to your vendor
          label: Splunk (HEC)
          value: splunk
        - group_label: Ships to your vendor
          label: Custom OTLP endpoint
          value: otlp
    - default: 30
      description: How long logs stay searchable in the in-cluster store. Older logs are deleted from the bucket automatically.
      id: log_retention_days
      label: Retention (days)
      show_when:
        logs_enabled: true
        logs_providers: loki
      type: number
    - collapsible: true
      description: Store logs in an existing S3 bucket instead of creating one. Leave blank to create a bucket for this cluster. When you bring your own, its lifecycle and encryption settings stay yours to manage.
      id: loki_s3_bucket
      label: Existing log bucket
      show_when:
        logs_enabled: true
        logs_providers: loki
      type: string
    - default: 30
      description: Retention on the CloudWatch log group /ravion/eks/<cluster>, which carries one stream per pod. CloudWatch Logs bills per gigabyte ingested and then for storage.
      id: cloudwatch_logs_retention_days
      label: CloudWatch retention (days)
      show_when:
        logs_enabled: true
        logs_providers: cloudwatch
      type: number
    - description: Grafana Cloud's Loki push URL, from the stack's Logs data source details - for example https://logs-prod-006.grafana.net/loki/api/v1/push.
      id: grafana_cloud_logs_url
      label: Grafana Cloud Loki push URL
      placeholder: https://logs-prod-006.grafana.net/loki/api/v1/push
      show_when:
        logs_enabled: true
        logs_providers: grafana_cloud
      type: string
    - description: The numeric user id shown beside that push URL in Grafana Cloud.
      id: grafana_cloud_logs_user
      label: Grafana Cloud Loki user
      show_when:
        logs_enabled: true
        logs_providers: grafana_cloud
      type: string
    - description: Secrets Manager ARN holding a Grafana Cloud access token with logs:write (and metrics:write, if Grafana Cloud is also a metrics destination). Read in-cluster by External Secrets; never stored by Ravion.
      id: grafana_cloud_token_secret_arn
      label: Grafana Cloud token secret
      placeholder: arn:aws:secretsmanager:us-east-2:111122223333:secret:grafana-cloud-token
      show_when:
        logs_enabled: true
        logs_providers: grafana_cloud
      type: string
    - collapsible: true
      description: Your Grafana Cloud stack URL, used only to build the "Open in Grafana Cloud" link on the Logs and Metrics tabs. Leave blank for no link.
      id: grafana_cloud_stack_url
      label: Grafana Cloud stack URL
      placeholder: https://myorg.grafana.net
      show_when:
        logs_enabled: true
        logs_providers: grafana_cloud
      type: string
    - default: datadoghq.com
      description: Datadog site the collectors ship to. Datadog bills per gigabyte of logs ingested and per host for metrics.
      id: datadog_site
      label: Datadog site
      show_when:
        logs_enabled: true
        logs_providers: datadog
      type: string
      values:
        - label: US1 (datadoghq.com)
          value: datadoghq.com
        - label: US3 (us3.datadoghq.com)
          value: us3.datadoghq.com
        - label: US5 (us5.datadoghq.com)
          value: us5.datadoghq.com
        - label: EU1 (datadoghq.eu)
          value: datadoghq.eu
        - label: AP1 (ap1.datadoghq.com)
          value: ap1.datadoghq.com
        - label: US1-FED (ddog-gov.com)
          value: ddog-gov.com
    - description: Secrets Manager ARN holding the Datadog API key. Read in-cluster by External Secrets, which this module installs; the key never passes through Ravion, Helm values, or release history.
      id: datadog_api_key_secret_arn
      label: Datadog API key secret
      placeholder: arn:aws:secretsmanager:us-east-2:111122223333:secret:datadog-api-key
      show_when:
        logs_enabled: true
        logs_providers: datadog
      type: string
    - default: us
      description: New Relic data region, which decides the OTLP endpoint the collector ships to. New Relic bills per gigabyte ingested.
      id: new_relic_region
      label: New Relic region
      show_when:
        logs_enabled: true
        logs_providers: new_relic
      type: string
      values:
        - label: United States
          value: us
        - label: Europe
          value: eu
    - description: Secrets Manager ARN holding the New Relic license key. Read in-cluster by External Secrets.
      id: new_relic_license_key_secret_arn
      label: New Relic license key secret
      placeholder: arn:aws:secretsmanager:us-east-2:111122223333:secret:new-relic-license-key
      show_when:
        logs_enabled: true
        logs_providers: new_relic
      type: string
    - description: Endpoint of the Amazon OpenSearch Service domain, https://... . The collector signs its requests with the cluster's own IAM role - after the first deployment, map the role from the logs_opensearch_role_arn output into the domain's access policy or its fine-grained role mapping, which is the half of the grant that lives on the domain.
      id: opensearch_endpoint
      label: OpenSearch domain endpoint
      placeholder: https://search-logs-abc123.us-east-2.es.amazonaws.com
      show_when:
        logs_enabled: true
        logs_providers: opensearch
      type: string
    - default: ravion-logs
      description: Index the logs are written to. OpenSearch bills for the instances and storage behind the domain, not per gigabyte ingested.
      id: opensearch_index_prefix
      label: OpenSearch index
      show_when:
        logs_enabled: true
        logs_providers: opensearch
      type: string
    - description: Splunk HTTP Event Collector URL, including the /services/collector path.
      id: splunk_hec_url
      label: Splunk HEC URL
      placeholder: https://http-inputs-acme.splunkcloud.com:443/services/collector
      show_when:
        logs_enabled: true
        logs_providers: splunk
      type: string
    - description: Secrets Manager ARN holding the HEC token. Read in-cluster by External Secrets; never stored by Ravion.
      id: splunk_hec_token_secret_arn
      label: Splunk HEC token secret
      placeholder: arn:aws:secretsmanager:us-east-2:111122223333:secret:splunk-hec-token
      show_when:
        logs_enabled: true
        logs_providers: splunk
      type: string
    - collapsible: true
      description: Splunk index the events are written to. Leave blank to use the token's default index.
      id: splunk_index
      label: Splunk index
      show_when:
        logs_enabled: true
        logs_providers: splunk
      type: string
    - description: OTLP/HTTP endpoint logs are sent to - Honeycomb, Dynatrace, Elastic, or anything else that speaks OTLP.
      id: otlp_logs_endpoint
      label: OTLP logs endpoint
      placeholder: https://api.honeycomb.io
      show_when:
        logs_enabled: true
        logs_providers: otlp
      type: string
    - collapsible: true
      description: Secrets Manager ARN holding the value of an Authorization header sent with every OTLP request. Leave blank for an endpoint that needs no header.
      id: otlp_headers_secret_arn
      label: OTLP authorization secret
      show_when:
        logs_enabled: true
        logs_providers: otlp
      type: string
    - add_button_label: Add namespace
      collapsible: true
      default:
        - kube-system
        - kube-node-lease
        - amazon-cloudwatch
        - ravion-beacon
      description: Namespaces no log collector reads from. Applies to every destination. Ravion's own namespace is excluded by default so the collectors do not tail themselves.
      id: logs_namespace_exclude
      label: Namespaces to skip
      show_when:
        logs_enabled: true
      type: string_array
    - description: Grafana access to this cluster's metrics and logs. Ravion's own Metrics and Logs tabs need none of this - these toggles are for teams who already work in Grafana.
      id: section_grafana
      label: Grafana
      type: section
    - default: false
      description: Install Grafana inside the cluster, already wired to this cluster's metrics and logs. This is the only way to see the in-cluster logs in Grafana - Amazon Managed Grafana runs outside your cluster and cannot reach the log store. Needs Metrics or Logs to be on, since those are what it shows. No public address is created; reach it with a port-forward.
      id: grafana_enabled
      label: In-cluster Grafana
      type: boolean
    - default: false
      description: Create a read-only IAM role that Amazon Managed Grafana can assume to query this cluster's metrics. Metrics only - Amazon Managed Grafana cannot reach the in-cluster log store.
      id: grafana_role_enabled
      label: Amazon Managed Grafana access
      show_when:
        metrics_enabled: true
      type: boolean
    - description: >-
        Per-container CPU, memory, network, restart, and scaling metrics, collected by
        one agent and delivered to the destinations you choose. On by default into an
        Amazon Managed Prometheus workspace in your own account, which is what the
        service Metrics tabs read. The collector keeps a curated metric set chosen to
        keep the bill predictable. Requires Kubernetes API connectivity from the
        Terraform runner.
      id: section_metrics
      label: Metrics
      type: section
    - default: true
      description: >-
        Collect workload metrics. On by default into Amazon Managed Prometheus, billed
        per metric sample ingested - roughly $25-50 a month for a 20-service cluster.
        Turn this off to run no collector at all; the Metrics tabs then say metrics are
        off for this cluster. Advanced settings - scrape interval, extra metric names to
        keep, chart versions, collector resources, and the install namespace - are
        available through Advanced Terraform variables.
      id: metrics_enabled
      label: Metrics
      type: boolean
    - add_button_label: Add destination
      default:
        - amp
      description: >-
        Where the metrics go. Pick as many as you like. Ravion's Metrics tabs read from
        the first destination in the first group that can answer and fall back to the
        next - Amazon Managed Prometheus, then CloudWatch Container Insights. Everything
        in the second group receives a copy and gets an "Open in ..." link; the cluster
        is scraped once whatever the number of destinations, but every vendor bills for
        what it receives.
      id: metrics_providers
      label: Providers
      show_when:
        metrics_enabled: true
      type: string_array
      values:
        - group_label: Renders in Ravion's Metrics tab (read first)
          label: Amazon Managed Prometheus
          value: amp
        - group_label: Renders in Ravion's Metrics tab (fallback)
          label: Prometheus in your cluster
          value: prometheus
        - group_label: Renders in Ravion's Metrics tab (fallback)
          label: Amazon CloudWatch (Container Insights)
          value: cloudwatch
        - group_label: Ships to your vendor
          label: Grafana Cloud Metrics
          value: grafana_cloud
        - group_label: Ships to your vendor
          label: Datadog
          value: datadog
        - group_label: Ships to your vendor
          label: New Relic
          value: new_relic
        - group_label: Ships to your vendor
          label: Custom OTLP endpoint
          value: otlp
    - collapsible: true
      description: Write into an existing Amazon Managed Prometheus workspace instead of creating one. Leave blank to create a workspace for this cluster.
      id: amp_workspace_id
      label: Existing workspace ID
      placeholder: ws-12345678-abcd-1234-abcd-123456789012
      show_when:
        metrics_enabled: true
        metrics_providers: amp
      type: string
    - collapsible: true
      description: Region the workspace lives in. Leave blank to use the cluster's region. Set this when the cluster runs in a region where Amazon Managed Prometheus is not offered - metrics are written across regions, at the cost of inter-region data transfer.
      id: amp_region
      label: Workspace region
      show_when:
        metrics_enabled: true
        metrics_providers: amp
      type: string
      values: $values:aws/regions
    - default: 15
      description: How long the in-cluster Prometheus keeps metrics. Storage is the volume below, in your own account, with no per-sample charge.
      id: prometheus_retention_days
      label: Prometheus retention (days)
      show_when:
        metrics_enabled: true
        metrics_providers: prometheus
      type: number
    - default: 50Gi
      description: Size of the persistent volume Prometheus stores metrics on. Needs a working storage class, which on a Ravion cluster means the EBS CSI driver add-on above.
      id: prometheus_storage_size
      label: Prometheus volume size
      show_when:
        metrics_enabled: true
        metrics_providers: prometheus
      type: string
    - collapsible: true
      description: Write into a Prometheus you already run instead of installing one. Give its in-cluster URL; the module then installs nothing and only remote-writes to it.
      id: prometheus_endpoint
      label: Existing Prometheus URL
      placeholder: http://prometheus.monitoring.svc.cluster.local:9090
      show_when:
        metrics_enabled: true
        metrics_providers: prometheus
      type: string
    - default: true
      description: Container Insights with enhanced pod and container metrics. CloudWatch bills per metric and per log ingested; enhanced collection is the more expensive of the two modes.
      id: cloudwatch_enhanced_observability
      label: Enhanced observability
      show_when:
        metrics_enabled: true
        metrics_providers: cloudwatch
      type: boolean
    - default: false
      description: >-
        Off unless you ask for it. When on, the add-on's webhook injects the AWS
        OpenTelemetry agent into the workloads of the namespaces below and restarts their
        pods to do it. This is the setting that used to be on silently whenever Container
        Insights was enabled.
      id: cloudwatch_application_signals_enabled
      label: Application Signals auto-instrumentation
      show_when:
        metrics_enabled: true
        metrics_providers: cloudwatch
      type: boolean
    - add_button_label: Add namespace
      description: Namespaces to instrument. Leave empty to instrument the whole cluster - every workload in it, restarted on the next rollout.
      id: cloudwatch_application_signals_namespaces
      label: Namespaces to instrument
      show_when:
        cloudwatch_application_signals_enabled: true
        metrics_enabled: true
        metrics_providers: cloudwatch
      type: string_array
    - collapsible: true
      description: Pinned amazon-cloudwatch-observability add-on version. Leave blank to let AWS resolve the most recent compatible version. Also applies when CloudWatch is chosen as a logs destination.
      id: cloudwatch_observability_addon_version
      label: CloudWatch add-on version
      placeholder: Latest compatible
      show_when:
        metrics_enabled: true
        metrics_providers: cloudwatch
      type: string
    - description: Grafana Cloud's Prometheus remote-write URL, from the stack's Prometheus data source details.
      id: grafana_cloud_metrics_url
      label: Grafana Cloud remote-write URL
      placeholder: https://prometheus-prod-01.grafana.net/api/prom/push
      show_when:
        metrics_enabled: true
        metrics_providers: grafana_cloud
      type: string
    - description: The numeric instance id shown beside that remote-write URL in Grafana Cloud.
      id: grafana_cloud_metrics_user
      label: Grafana Cloud instance id
      show_when:
        metrics_enabled: true
        metrics_providers: grafana_cloud
      type: string
    - description: Secrets Manager ARN holding a Grafana Cloud access token with metrics:write. Read in-cluster by External Secrets; never stored by Ravion. Shown only when Grafana Cloud is not already a logs destination, which asks for the same token.
      id: metrics_grafana_cloud_token_secret_arn
      label: Grafana Cloud token secret
      placeholder: arn:aws:secretsmanager:us-east-2:111122223333:secret:grafana-cloud-token
      show_when:
        logs_providers:
          not: grafana_cloud
        metrics_enabled: true
        metrics_providers: grafana_cloud
      type: string
    - default: datadoghq.com
      description: Datadog site the collector ships metrics to. Shown only when Datadog is not already a logs destination, which asks for the same site.
      id: metrics_datadog_site
      label: Datadog site
      show_when:
        logs_providers:
          not: datadog
        metrics_enabled: true
        metrics_providers: datadog
      type: string
      values:
        - label: US1 (datadoghq.com)
          value: datadoghq.com
        - label: US3 (us3.datadoghq.com)
          value: us3.datadoghq.com
        - label: US5 (us5.datadoghq.com)
          value: us5.datadoghq.com
        - label: EU1 (datadoghq.eu)
          value: datadoghq.eu
        - label: AP1 (ap1.datadoghq.com)
          value: ap1.datadoghq.com
        - label: US1-FED (ddog-gov.com)
          value: ddog-gov.com
    - description: Secrets Manager ARN holding the Datadog API key. Read in-cluster by External Secrets. Shown only when Datadog is not already a logs destination, which asks for the same key.
      id: metrics_datadog_api_key_secret_arn
      label: Datadog API key secret
      placeholder: arn:aws:secretsmanager:us-east-2:111122223333:secret:datadog-api-key
      show_when:
        logs_providers:
          not: datadog
        metrics_enabled: true
        metrics_providers: datadog
      type: string
    - default: us
      description: New Relic data region. Shown only when New Relic is not already a logs destination.
      id: metrics_new_relic_region
      label: New Relic region
      show_when:
        logs_providers:
          not: new_relic
        metrics_enabled: true
        metrics_providers: new_relic
      type: string
      values:
        - label: United States
          value: us
        - label: Europe
          value: eu
    - description: Secrets Manager ARN holding the New Relic license key. Read in-cluster by External Secrets. Shown only when New Relic is not already a logs destination.
      id: metrics_new_relic_license_key_secret_arn
      label: New Relic license key secret
      placeholder: arn:aws:secretsmanager:us-east-2:111122223333:secret:new-relic-license-key
      show_when:
        logs_providers:
          not: new_relic
        metrics_enabled: true
        metrics_providers: new_relic
      type: string
    - description: OTLP/HTTP endpoint metrics are sent to.
      id: otlp_metrics_endpoint
      label: OTLP metrics endpoint
      placeholder: https://api.honeycomb.io
      show_when:
        metrics_enabled: true
        metrics_providers: otlp
      type: string
    - collapsible: true
      description: Secrets Manager ARN holding the value of an Authorization header sent with every OTLP request. Shown only when a custom OTLP endpoint is not already a logs destination.
      id: metrics_otlp_headers_secret_arn
      label: OTLP authorization secret
      show_when:
        logs_providers:
          not: otlp
        metrics_enabled: true
        metrics_providers: otlp
      type: string
    - description: Reference-only secrets for workloads. The External Secrets Operator reads the Secrets Manager secrets and SSM parameters that services reference by ARN and materializes them into Kubernetes secrets, so secret values never pass through Ravion, Helm values, or release history. Requires Kubernetes API connectivity from the Terraform runner.
      id: section_external_secrets
      label: External secrets
      type: section
    - default: true
      id: eso_enabled
      label: External Secrets Operator
      type: boolean
    - add_button_label: Add ARN
      collapsible: true
      description: Secrets Manager secret and SSM parameter ARNs (wildcards allowed) the operator may read. Leave empty to allow reading every secret and parameter in this account and region. Add entries to scope the operator down, or to reach other regions and accounts.
      id: eso_secret_arns
      label: Readable secret ARNs
      placeholder: arn:aws:secretsmanager:us-east-2:111122223333:secret:prod/*
      show_when:
        eso_enabled: true
      type: string_array
    - collapsible: true
      description: Version of the external-secrets Helm chart to install.
      id: eso_chart_version
      label: Chart version
      placeholder: 2.8.0
      show_when:
        eso_enabled: true
      type: string
    - collapsible: true
      description: Namespace the operator is installed into. Created if it does not exist.
      id: eso_namespace
      label: Operator namespace
      placeholder: external-secrets
      show_when:
        eso_enabled: true
      type: string
    - description: Application Load Balancers that web workloads attach to via the load balancer controller's TargetGroupBinding. Use these for HTTP/HTTPS traffic - websites, APIs, and webhook endpoints.
      id: section_alb
      label: Application load balancers
      type: section
    - default: false
      description: Create an internet-facing Application Load Balancer for traffic from the public internet.
      id: public_alb_enabled
      label: Public ALB
      type: boolean
    - default: true
      description: Enable HTTPS listener on the public ALB.
      id: public_alb_https_enabled
      label: HTTPS
      show_when:
        public_alb_enabled: true
      type: boolean
    - $template: ../../../partials/templates/alb-certificate-input.yml
      with:
        additional_certificate_arns_description: Additional ACM certificate ARNs attached to the public ALB HTTPS listener for SNI.
        additional_certificate_arns_input_id: public_alb_additional_certificate_arns
        certificate_arns_description: ACM certificate ARNs resolved from the selected module. The first ARN is the default certificate.
        certificate_arns_input_id: public_alb_certificate_arns
        certificate_description: Primary ACM certificate module for public ALB HTTPS.
        certificate_input_id: public_alb_certificate
        show_when:
          public_alb_enabled: true
          public_alb_https_enabled: true
    - collapsible: true
      description: SSL policy for public ALB HTTPS.
      id: public_alb_ssl_policy
      label: SSL policy
      placeholder: ELBSecurityPolicy-TLS13-1-2-2021-06
      show_when:
        public_alb_enabled: true
        public_alb_https_enabled: true
      type: string
    - collapsible: true
      description: Idle timeout for the public ALB.
      id: public_alb_idle_timeout
      label: Idle timeout (seconds)
      max: 4000
      min: 1
      placeholder: "60"
      show_when:
        public_alb_enabled: true
      type: number
    - collapsible: true
      description: WAFv2 Web ACL ARN for the public ALB.
      id: public_alb_web_acl_arn
      label: WAF web ACL ARN
      placeholder: arn:aws:wafv2:...
      show_when:
        public_alb_enabled: true
      type: string
    - collapsible: true
      default: false
      description: Enable public ALB access logging.
      id: public_alb_access_logs_enabled
      label: Access logs
      show_when:
        public_alb_enabled: true
      type: boolean
    - collapsible: true
      description: Existing S3 bucket ARN for public ALB access logs.
      id: public_alb_access_logs_bucket_arn
      label: Access logs bucket ARN
      placeholder: arn:aws:s3:::my-bucket
      show_when:
        public_alb_enabled: true
        public_alb_access_logs_enabled: true
      type: string
    - default: false
      description: Create an internal Application Load Balancer reachable only inside the VPC, for internal APIs, admin tools, and service-to-service traffic.
      id: private_alb_enabled
      label: Private ALB
      type: boolean
    - default: false
      description: Enable HTTPS listener on the private ALB.
      id: private_alb_https_enabled
      label: HTTPS
      show_when:
        private_alb_enabled: true
      type: boolean
    - $template: ../../../partials/templates/alb-certificate-input.yml
      with:
        additional_certificate_arns_description: Additional ACM certificate ARNs attached to the private ALB HTTPS listener for SNI.
        additional_certificate_arns_input_id: private_alb_additional_certificate_arns
        certificate_arns_description: ACM certificate ARNs resolved from the selected module. The first ARN is the default certificate.
        certificate_arns_input_id: private_alb_certificate_arns
        certificate_description: Primary ACM certificate module for private ALB HTTPS.
        certificate_input_id: private_alb_certificate
        show_when:
          private_alb_enabled: true
          private_alb_https_enabled: true
    - collapsible: true
      description: SSL policy for private ALB HTTPS.
      id: private_alb_ssl_policy
      label: SSL policy
      placeholder: ELBSecurityPolicy-TLS13-1-2-2021-06
      show_when:
        private_alb_enabled: true
        private_alb_https_enabled: true
      type: string
    - add_button_label: Add CIDR block
      collapsible: true
      description: Allowed IPv4 CIDRs for private ALB access. Terraform defaults to RFC1918 private ranges.
      id: private_alb_ingress_cidr_blocks
      label: Ingress CIDRs
      placeholder: 10.0.0.0/8
      show_when:
        private_alb_enabled: true
      type: string_array
    - add_button_label: Add IPv6 CIDR block
      collapsible: true
      description: Allowed IPv6 CIDRs for private ALB access. Defaults to no IPv6 ingress.
      id: private_alb_ingress_ipv6_cidr_blocks
      label: Ingress IPv6 CIDRs
      placeholder: fd00::/8
      show_when:
        private_alb_enabled: true
      type: string_array
    - add_button_label: Add security group
      collapsible: true
      description: Security groups whose members can access the private ALB. Useful for sources without static CIDRs, such as CloudFront VPC origins.
      id: private_alb_ingress_security_group_ids
      label: Ingress security groups
      placeholder: sg-...
      show_when:
        private_alb_enabled: true
      type: string_array
    - collapsible: true
      description: Idle timeout for the private ALB.
      id: private_alb_idle_timeout
      label: Idle timeout (seconds)
      max: 4000
      min: 1
      placeholder: "60"
      show_when:
        private_alb_enabled: true
      type: number
    - collapsible: true
      default: false
      description: Enable private ALB access logging.
      id: private_alb_access_logs_enabled
      label: Access logs
      show_when:
        private_alb_enabled: true
      type: boolean
    - collapsible: true
      description: Existing S3 bucket ARN for private ALB access logs.
      id: private_alb_access_logs_bucket_arn
      label: Access logs bucket ARN
      placeholder: arn:aws:s3:::my-bucket
      show_when:
        private_alb_enabled: true
        private_alb_access_logs_enabled: true
      type: string
    - description: Use Network Load Balancers for TCP/UDP workloads, static IP requirements, very high-throughput connections, or protocols that do not need HTTP routing. For normal web apps and HTTP APIs, prefer the Application Load Balancers section above.
      id: section_nlb
