definition:
  type: rvn-eks-addons
  name: EKS Add-ons
  description: Selectable add-ons for an existing EKS cluster - Karpenter autoscaling, the AWS Load Balancer Controller, the External Secrets Operator, EBS CSI storage, CloudWatch Container Insights, and shared application/network load balancers, each toggled and configured independently.
release:
  version: 0.1.0
  description: Initial EKS add-ons definition with selectable Karpenter, AWS Load Balancer Controller, External Secrets Operator, EBS CSI driver, and CloudWatch Container Insights add-ons, plus optional shared ALBs/NLBs that web workloads attach to via TargetGroupBinding.
module:
  inputs:
    - id: cluster
      immutable: true
      label: EKS cluster
      mapped_inputs:
        - id: section_aws
          label: AWS account & region
          type: section
        - default: << ref.input.aws_account_id >>
          id: aws_account_id
          immutable: true
          label: AWS account
          type: string
          values: $values:ravion/aws_accounts
        - default: << ref.input.aws_region >>
          id: aws_region
          immutable: true
          label: Region
          type: string
          values: $values:aws/regions
        - collapsible: true
          default: << ref.input.execution_environment_id >>
          description: Execution environment for Pipeline Terraform runners. Defaults to the cluster module's execution environment. When Karpenter is enabled on a private cluster, it must run inside the cluster VPC with the cluster's Ravion Runner security group attached so Helm can reach the Kubernetes API endpoint.
          id: execution_environment_id
          label: Terraform execution environment
          type: string
          values: $values:ravion/execution_environments
        - id: section_cluster
          label: EKS cluster
          type: section
        - default: <<ref.stack.output.cluster_name>>
          id: cluster_name
          immutable: true
          label: Cluster name
          required: true
          type: string
        - collapsible: true
          default: <<ref.stack.output.ravion_runner_role_arn>>
          description: IAM role assumed for Kubernetes API authentication when installing Helm charts. Defaults to the cluster's Ravion Runner role.
          id: ravion_runner_role_arn
          label: Ravion Runner role ARN
          type: string
        - collapsible: true
          default: <<ref.stack.output.cluster_security_group_id>>
          description: EKS-managed cluster security group attached to Karpenter-launched nodes.
          id: cluster_security_group_id
          label: Cluster security group ID
          type: string
        - add_button_label: Add subnet ID
          collapsible: true
          default: <<ref.stack.output.node_subnet_ids>>
          description: Subnets the default Karpenter NodePool launches nodes into. Also used by internal shared load balancers.
          id: node_subnet_ids
          label: Node subnet IDs
          type: string_array
        - add_button_label: Add subnet ID
          collapsible: true
          default: <<ref.stack.output.public_subnet_ids>>
          description: Public subnets for internet-facing shared load balancers.
          id: public_subnet_ids
          label: Public subnet IDs
          type: string_array
      required: true
      type: $ref:rvn-eks
    - description: Just-in-time node autoscaling. Provisions Karpenter end to end - controller and node IAM roles, Pod Identity association, instance profile, interruption queue, EventBridge rules, the controller Helm charts, and a default NodePool. Requires Kubernetes API connectivity from the Terraform runner.
      id: section_karpenter
      label: Karpenter
      type: section
    - default: true
      id: karpenter_enabled
      label: Karpenter
      type: boolean
    - collapsible: true
      description: Version of the Karpenter Helm chart (and karpenter-crd chart) to install.
      id: karpenter_chart_version
      label: Chart version
      placeholder: 1.14.0
      show_when:
        karpenter_enabled: true
      type: string
    - collapsible: true
      description: Namespace where the Karpenter controller is installed.
      id: karpenter_controller_namespace
      label: Controller namespace
      placeholder: kube-system
      show_when:
        karpenter_enabled: true
      type: string
    - collapsible: true
      description: Service account name used by the Karpenter controller.
      id: karpenter_controller_service_account
      label: Controller service account
      placeholder: karpenter
      show_when:
        karpenter_enabled: true
      type: string
    - default: true
      description: Create a general-purpose default NodePool and EC2NodeClass so Karpenter can provision nodes out of the box. Disable to manage NodePools yourself.
      id: karpenter_default_node_pool_enabled
      label: Default NodePool
      show_when:
        karpenter_enabled: true
      type: boolean
    - description: EBS-backed persistent volumes via the aws-ebs-csi-driver EKS add-on and its Pod Identity role.
      id: section_ebs_csi
      label: EBS CSI driver
      type: section
    - default: false
      id: ebs_csi_driver_enabled
      label: EBS CSI driver
      type: boolean
    - collapsible: true
      description: Pinned add-on version. Leave blank to let AWS resolve the most recent compatible version.
      id: ebs_csi_addon_version
      label: Add-on version
      placeholder: Latest compatible
      show_when:
        ebs_csi_driver_enabled: true
      type: string
    - description: CloudWatch Container Insights via the amazon-cloudwatch-observability EKS add-on - node, pod, and container metrics plus application and data plane logs, shown on the cluster module's Metrics and Logs tabs.
      id: section_container_insights
      label: Container Insights
      type: section
    - default: true
      id: cloudwatch_observability_enabled
      label: Container Insights
      type: boolean
    - collapsible: true
      description: Pinned add-on version. Leave blank to let AWS resolve the most recent compatible version.
      id: cloudwatch_observability_addon_version
      label: Add-on version
      placeholder: Latest compatible
      show_when:
        cloudwatch_observability_enabled: true
      type: string
    - description: Reference-only secrets for workloads. The External Secrets Operator reads the Secrets Manager secrets and SSM parameters that services reference by ARN and materializes them into Kubernetes secrets, so secret values never pass through Ravion, Helm values, or release history. Requires Kubernetes API connectivity from the Terraform runner.
      id: section_external_secrets
      label: External secrets
      type: section
    - default: true
      id: eso_enabled
      label: External Secrets Operator
      type: boolean
    - add_button_label: Add ARN
      collapsible: true
      description: Secrets Manager secret and SSM parameter ARNs (wildcards allowed) the operator may read. Leave empty to allow reading every secret and parameter in this account and region. Add entries to scope the operator down, or to reach other regions and accounts.
      id: eso_secret_arns
      label: Readable secret ARNs
      placeholder: arn:aws:secretsmanager:us-east-2:111122223333:secret:prod/*
      show_when:
        eso_enabled: true
      type: string_array
    - collapsible: true
      description: Version of the external-secrets Helm chart to install.
      id: eso_chart_version
      label: Chart version
      placeholder: 2.8.0
      show_when:
        eso_enabled: true
      type: string
    - collapsible: true
      description: Namespace the operator is installed into. Created if it does not exist.
      id: eso_namespace
      label: Operator namespace
      placeholder: external-secrets
      show_when:
        eso_enabled: true
      type: string
    - description: Application Load Balancers that web workloads attach to via the load balancer controller's TargetGroupBinding. Use these for HTTP/HTTPS traffic - websites, APIs, and webhook endpoints.
      id: section_alb
      label: Application load balancers
      type: section
    - default: false
      description: Create an internet-facing Application Load Balancer for traffic from the public internet.
      id: public_alb_enabled
      label: Public ALB
      type: boolean
    - default: true
      description: Enable HTTPS listener on the public ALB.
      id: public_alb_https_enabled
      label: HTTPS
      show_when:
        public_alb_enabled: true
      type: boolean
    - $template: ../../../partials/templates/alb-certificate-input.yml
      with:
        additional_certificate_arns_description: Additional ACM certificate ARNs attached to the public ALB HTTPS listener for SNI.
        additional_certificate_arns_input_id: public_alb_additional_certificate_arns
        certificate_arns_description: ACM certificate ARNs resolved from the selected module. The first ARN is the default certificate.
        certificate_arns_input_id: public_alb_certificate_arns
        certificate_description: Primary ACM certificate module for public ALB HTTPS.
        certificate_input_id: public_alb_certificate
        show_when:
          public_alb_enabled: true
          public_alb_https_enabled: true
    - collapsible: true
      description: SSL policy for public ALB HTTPS.
      id: public_alb_ssl_policy
      label: SSL policy
      placeholder: ELBSecurityPolicy-TLS13-1-2-2021-06
      show_when:
        public_alb_enabled: true
        public_alb_https_enabled: true
      type: string
    - collapsible: true
      description: Idle timeout for the public ALB.
      id: public_alb_idle_timeout
      label: Idle timeout (seconds)
      max: 4000
      min: 1
      placeholder: "60"
      show_when:
        public_alb_enabled: true
      type: number
    - collapsible: true
      description: WAFv2 Web ACL ARN for the public ALB.
      id: public_alb_web_acl_arn
      label: WAF web ACL ARN
      placeholder: arn:aws:wafv2:...
      show_when:
        public_alb_enabled: true
      type: string
    - collapsible: true
      default: false
      description: Enable public ALB access logging.
      id: public_alb_access_logs_enabled
      label: Access logs
      show_when:
        public_alb_enabled: true
      type: boolean
    - collapsible: true
      description: Existing S3 bucket ARN for public ALB access logs.
      id: public_alb_access_logs_bucket_arn
      label: Access logs bucket ARN
      placeholder: arn:aws:s3:::my-bucket
      show_when:
        public_alb_enabled: true
        public_alb_access_logs_enabled: true
      type: string
    - default: false
      description: Create an internal Application Load Balancer reachable only inside the VPC, for internal APIs, admin tools, and service-to-service traffic.
      id: private_alb_enabled
      label: Private ALB
      type: boolean
    - default: false
      description: Enable HTTPS listener on the private ALB.
      id: private_alb_https_enabled
      label: HTTPS
      show_when:
        private_alb_enabled: true
      type: boolean
    - $template: ../../../partials/templates/alb-certificate-input.yml
      with:
        additional_certificate_arns_description: Additional ACM certificate ARNs attached to the private ALB HTTPS listener for SNI.
        additional_certificate_arns_input_id: private_alb_additional_certificate_arns
        certificate_arns_description: ACM certificate ARNs resolved from the selected module. The first ARN is the default certificate.
        certificate_arns_input_id: private_alb_certificate_arns
        certificate_description: Primary ACM certificate module for private ALB HTTPS.
        certificate_input_id: private_alb_certificate
        show_when:
          private_alb_enabled: true
          private_alb_https_enabled: true
    - collapsible: true
      description: SSL policy for private ALB HTTPS.
      id: private_alb_ssl_policy
      label: SSL policy
      placeholder: ELBSecurityPolicy-TLS13-1-2-2021-06
      show_when:
        private_alb_enabled: true
        private_alb_https_enabled: true
      type: string
    - add_button_label: Add CIDR block
      collapsible: true
      description: Allowed IPv4 CIDRs for private ALB access. Terraform defaults to RFC1918 private ranges.
      id: private_alb_ingress_cidr_blocks
      label: Ingress CIDRs
      placeholder: 10.0.0.0/8
      show_when:
        private_alb_enabled: true
      type: string_array
    - add_button_label: Add IPv6 CIDR block
      collapsible: true
      description: Allowed IPv6 CIDRs for private ALB access. Defaults to no IPv6 ingress.
      id: private_alb_ingress_ipv6_cidr_blocks
      label: Ingress IPv6 CIDRs
      placeholder: fd00::/8
      show_when:
        private_alb_enabled: true
      type: string_array
    - add_button_label: Add security group
      collapsible: true
      description: Security groups whose members can access the private ALB. Useful for sources without static CIDRs, such as CloudFront VPC origins.
      id: private_alb_ingress_security_group_ids
      label: Ingress security groups
      placeholder: sg-...
      show_when:
        private_alb_enabled: true
      type: string_array
    - collapsible: true
      description: Idle timeout for the private ALB.
      id: private_alb_idle_timeout
      label: Idle timeout (seconds)
      max: 4000
      min: 1
      placeholder: "60"
      show_when:
        private_alb_enabled: true
      type: number
    - collapsible: true
      default: false
      description: Enable private ALB access logging.
      id: private_alb_access_logs_enabled
      label: Access logs
      show_when:
        private_alb_enabled: true
      type: boolean
    - collapsible: true
      description: Existing S3 bucket ARN for private ALB access logs.
      id: private_alb_access_logs_bucket_arn
      label: Access logs bucket ARN
      placeholder: arn:aws:s3:::my-bucket
      show_when:
        private_alb_enabled: true
        private_alb_access_logs_enabled: true
      type: string
    - description: Use Network Load Balancers for TCP/UDP workloads, static IP requirements, very high-throughput connections, or protocols that do not need HTTP routing. For normal web apps and HTTP APIs, prefer the Application Load Balancers section above.
      id: section_nlb
      label: Network load balancers
      type: section
    - default: false
      description: Create an internet-facing Network Load Balancer.
      id: public_nlb_enabled
      label: Public NLB
      type: boolean
    - add_button_label: Add security group ID
      collapsible: true
      description: Additional security groups for the public NLB.
      id: public_nlb_security_group_ids
      label: Security groups
      placeholder: sg-...
      show_when:
        public_nlb_enabled: true
      type: string_array
    - collapsible: true
      default: false
      description: Enable cross-zone load balancing for the public NLB.
      id: public_nlb_cross_zone_load_balancing_enabled
      label: Cross-zone load balancing
      show_when:
        public_nlb_enabled: true
      type: boolean
    - collapsible: true
      default: false
      description: Assign static Elastic IPs to the public NLB.
      id: public_nlb_elastic_ips_enabled
      label: Use elastic IPs
      show_when:
        public_nlb_enabled: true
      type: boolean
    - add_button_label: Add allocation ID
      collapsible: true
      description: Elastic IP allocation IDs for the public NLB, one per subnet.
      id: public_nlb_elastic_ip_allocation_ids
      label: Elastic IP allocation IDs
      placeholder: eipalloc-...
      show_when:
        public_nlb_enabled: true
        public_nlb_elastic_ips_enabled: true
      type: string_array
    - collapsible: true
      default: false
      description: Enable public NLB access logging.
      id: public_nlb_access_logs_enabled
      label: Access logs
      show_when:
        public_nlb_enabled: true
      type: boolean
    - collapsible: true
      description: Existing S3 bucket ARN for public NLB access logs.
      id: public_nlb_access_logs_bucket_arn
      label: Access logs bucket ARN
      placeholder: arn:aws:s3:::my-bucket
      show_when:
        public_nlb_enabled: true
        public_nlb_access_logs_enabled: true
      type: string
    - default: false
      description: Create an internal Network Load Balancer.
      id: private_nlb_enabled
      label: Private NLB
      type: boolean
    - add_button_label: Add security group ID
      collapsible: true
      description: Additional security groups for the private NLB.
      id: private_nlb_security_group_ids
      label: Security groups
      placeholder: sg-...
      show_when:
        private_nlb_enabled: true
      type: string_array
    - collapsible: true
      default: false
      description: Enable cross-zone load balancing for the private NLB.
      id: private_nlb_cross_zone_load_balancing_enabled
      label: Cross-zone load balancing
      show_when:
        private_nlb_enabled: true
      type: boolean
    - collapsible: true
      default: false
      description: Assign static Elastic IPs to the private NLB.
      id: private_nlb_elastic_ips_enabled
      label: Use elastic IPs
      show_when:
        private_nlb_enabled: true
      type: boolean
    - add_button_label: Add allocation ID
      collapsible: true
      description: Elastic IP allocation IDs for the private NLB, one per subnet.
      id: private_nlb_elastic_ip_allocation_ids
      label: Elastic IP allocation IDs
      placeholder: eipalloc-...
      show_when:
        private_nlb_enabled: true
        private_nlb_elastic_ips_enabled: true
      type: string_array
    - collapsible: true
      default: false
      description: Enable private NLB access logging.
      id: private_nlb_access_logs_enabled
      label: Access logs
      show_when:
        private_nlb_enabled: true
      type: boolean
    - collapsible: true
      description: Existing S3 bucket ARN for private NLB access logs.
      id: private_nlb_access_logs_bucket_arn
      label: Access logs bucket ARN
      placeholder: arn:aws:s3:::my-bucket
      show_when:
        private_nlb_enabled: true
        private_nlb_access_logs_enabled: true
      type: string
    - collapsible: true
      default: true
      description: Prevent accidental deletion of load balancers created by this module.
      id: load_balancer_deletion_protection_enabled
      label: Load balancer deletion protection
      type: boolean
    - collapsible: true
      description: Version of the aws-load-balancer-controller Helm chart to install. The controller is installed automatically when any load balancer is enabled, to register workload pods into the load balancer target groups.
      id: lb_controller_chart_version
      label: Load balancer controller chart version
      placeholder: 1.14.0
      type: string
    - $include: ../../../partials/inputs/misc-section.yml
    - $include: ../../../partials/inputs/tags.yml
    - $include: ../../../partials/inputs/terraform-settings.yml
  stack:
    $template: ../../../partials/templates/opentofu-stack.yml
    with:
      base_path: compute/eks/addons
      terraform_variables:
        ...overrides: << module.input.advanced_terraform_variables >>
        cluster_name: << module.input.cluster_name >>
        region: << module.input.aws_region >>
        karpenter_enabled: << module.input.karpenter_enabled >>
        karpenter_controller_namespace: << module.input.karpenter_controller_namespace || "kube-system" >>
        karpenter_controller_service_account: << module.input.karpenter_controller_service_account || "karpenter" >>
        karpenter_chart_version: << module.input.karpenter_chart_version || "1.14.0" >>
        karpenter_helm_values: []
        karpenter_default_node_pool_enabled: '<< module.input.karpenter_default_node_pool_enabled != nil ? module.input.karpenter_default_node_pool_enabled : true >>'
        node_subnet_ids: << module.input.node_subnet_ids >>
        cluster_security_group_id: << module.input.cluster_security_group_id >>
        ravion_runner_role_arn: << module.input.ravion_runner_role_arn >>
        lb_controller_chart_version: << module.input.lb_controller_chart_version || "1.14.0" >>
        ebs_csi_driver_enabled: << module.input.ebs_csi_driver_enabled >>
        ebs_csi_addon_version: << module.input.ebs_csi_addon_version >>
        cloudwatch_observability_enabled: << module.input.cloudwatch_observability_enabled >>
        cloudwatch_observability_addon_version: << module.input.cloudwatch_observability_addon_version >>
        eso_enabled: '<< module.input.eso_enabled != nil ? module.input.eso_enabled : true >>'
        eso_chart_version: << module.input.eso_chart_version || "2.8.0" >>
        eso_namespace: << module.input.eso_namespace || "external-secrets" >>
        eso_secret_arns: '<< module.input.eso_secret_arns != nil ? module.input.eso_secret_arns : [] >>'
        public_subnet_ids: << module.input.public_subnet_ids >>
        load_balancer_deletion_protection_enabled: << module.input.load_balancer_deletion_protection_enabled >>
        public_alb_enabled: << module.input.public_alb_enabled >>
        public_alb_https_enabled: << module.input.public_alb_https_enabled >>
        public_alb_certificate_arns: >-
          << (module.input.public_alb_certificate_arns != nil ? module.input.public_alb_certificate_arns : []) |
          concat(module.input.public_alb_additional_certificate_arns != nil ? module.input.public_alb_additional_certificate_arns : []) >>
        public_alb_ssl_policy: << module.input.public_alb_ssl_policy >>
        public_alb_idle_timeout: << module.input.public_alb_idle_timeout >>
        public_alb_web_acl_arn: << module.input.public_alb_web_acl_arn >>
        public_alb_access_logs_enabled: << module.input.public_alb_access_logs_enabled >>
        public_alb_access_logs_bucket_arn: << module.input.public_alb_access_logs_bucket_arn >>
        private_alb_enabled: << module.input.private_alb_enabled >>
        private_alb_https_enabled: << module.input.private_alb_https_enabled >>
        private_alb_certificate_arns: >-
          << (module.input.private_alb_certificate_arns != nil ? module.input.private_alb_certificate_arns : []) |
          concat(module.input.private_alb_additional_certificate_arns != nil ? module.input.private_alb_additional_certificate_arns : []) >>
        private_alb_ssl_policy: << module.input.private_alb_ssl_policy >>
        private_alb_ingress_cidr_blocks: << module.input.private_alb_ingress_cidr_blocks >>
        private_alb_ingress_ipv6_cidr_blocks: << module.input.private_alb_ingress_ipv6_cidr_blocks >>
        private_alb_ingress_security_group_ids: << module.input.private_alb_ingress_security_group_ids >>
        private_alb_idle_timeout: << module.input.private_alb_idle_timeout >>
        private_alb_access_logs_enabled: << module.input.private_alb_access_logs_enabled >>
        private_alb_access_logs_bucket_arn: << module.input.private_alb_access_logs_bucket_arn >>
        public_nlb_enabled: << module.input.public_nlb_enabled >>
        public_nlb_security_group_ids: << module.input.public_nlb_security_group_ids >>
        public_nlb_cross_zone_load_balancing_enabled: << module.input.public_nlb_cross_zone_load_balancing_enabled >>
        public_nlb_elastic_ips_enabled: << module.input.public_nlb_elastic_ips_enabled >>
        public_nlb_elastic_ip_allocation_ids: << module.input.public_nlb_elastic_ip_allocation_ids >>
        public_nlb_access_logs_enabled: << module.input.public_nlb_access_logs_enabled >>
        public_nlb_access_logs_bucket_arn: << module.input.public_nlb_access_logs_bucket_arn >>
        private_nlb_enabled: << module.input.private_nlb_enabled >>
        private_nlb_security_group_ids: << module.input.private_nlb_security_group_ids >>
        private_nlb_cross_zone_load_balancing_enabled: << module.input.private_nlb_cross_zone_load_balancing_enabled >>
        private_nlb_elastic_ips_enabled: << module.input.private_nlb_elastic_ips_enabled >>
        private_nlb_elastic_ip_allocation_ids: << module.input.private_nlb_elastic_ip_allocation_ids >>
        private_nlb_access_logs_enabled: << module.input.private_nlb_access_logs_enabled >>
        private_nlb_access_logs_bucket_arn: << module.input.private_nlb_access_logs_bucket_arn >>
        tags:
          $include: ../stack/ravion-tags.yml
  ui:
    links: |-
      <<
      (module.input.public_alb_enabled && stack.output.public_alb_dns_name ? [{"name":"Public ALB","href":(module.input.public_alb_https_enabled ? "https://" : "http://") + stack.output.public_alb_dns_name}] : []) +
      (module.input.private_alb_enabled && stack.output.private_alb_dns_name ? [{"name":"Private ALB","href":(module.input.private_alb_https_enabled ? "https://" : "http://") + stack.output.private_alb_dns_name}] : []) +
      (module.input.public_nlb_enabled && stack.output.public_nlb_dns_name ? [{"name":"Public NLB","href":"http://" + stack.output.public_nlb_dns_name}] : []) +
      (module.input.private_nlb_enabled && stack.output.private_nlb_dns_name ? [{"name":"Private NLB","href":"http://" + stack.output.private_nlb_dns_name}] : [])
      >>
  readme: |-
    Selectable add-ons for an existing EKS cluster. Each add-on is toggled independently and brings its own IAM wiring, so the cluster module stays lean and clusters only carry what they use.

    ## Add-ons

    | Add-on | Default | What it provides |
    | ------ | ------- | ---------------- |
    | **Karpenter** | On | Just-in-time node autoscaling: controller and node IAM roles, Pod Identity association, instance profile, SQS interruption queue, EventBridge rules, the controller Helm charts, and an optional default NodePool |
    | **Load balancer controller** | With load balancers | Installed automatically when any shared load balancer is enabled; registers workload pods into their target groups (TargetGroupBinding) via the AWS Load Balancer Controller Helm chart wired to the cluster module's Pod Identity role. Opt in without shared load balancers via advanced Terraform variables to provision ALBs/NLBs directly from Ingress and LoadBalancer resources |
    | **External Secrets Operator** | On | Reference-only secrets: workloads name a Secrets Manager secret or SSM parameter by ARN, and the operator materializes it into a Kubernetes secret using its own scoped Pod Identity role |
    | **EBS CSI driver** | Off | EBS-backed persistent volumes via the aws-ebs-csi-driver EKS add-on and its Pod Identity role |
    | **Container Insights** | On | Node, pod, and container metrics plus application/data plane logs via the amazon-cloudwatch-observability EKS add-on; populates the cluster module's Metrics and Logs tabs |
    | **Shared load balancers** | Off | Terraform-managed public/private ALBs and NLBs that web workloads attach to via the load balancer controller's TargetGroupBinding — the same shared-LB pattern the ECS Cluster module uses |

    EBS CSI and Container Insights are native EKS add-ons installed purely through the AWS API. Karpenter, the load balancer controller, and the External Secrets Operator additionally install Helm charts into the cluster, which are the only parts that need Kubernetes API connectivity.

    ## External secrets

    Kubernetes has no equivalent of the ECS task definition's `valueFrom` injection, so this add-on installs the External Secrets Operator as the bridge. A service references a secret **by ARN**; the operator reads it with its own IAM role and materializes it into a Kubernetes secret in the service's namespace. Values live only in AWS — they never pass through Ravion, Helm values, or Helm release history.

    Two cluster-scoped stores are created for services to reference, one per AWS backend (the operator's AWS provider takes a single service per store):

    | Backend | Store name | Kind |
    | ------- | ---------- | ---- |
    | AWS Secrets Manager | `ravion-aws` | `ClusterSecretStore` |
    | AWS SSM Parameter Store | `ravion-aws-parameter-store` | `ClusterSecretStore` |

    By default the operator may read every secret and parameter in the cluster's account and region. Add **readable secret ARNs** to scope it to specific secrets or prefixes, or to grant access in another region or account.

    At rest, the Kubernetes secrets the operator writes are KMS envelope-encrypted in etcd — the EKS Cluster module enables that by default with a dedicated key per cluster.

    ## Shared load balancers

    Instead of letting each Ingress provision its own ALB, this module can create up to four shared load balancers (public/private ALB, public/private NLB) with Terraform. Workload modules then create a target group and listener rule, and bind pods to the target group in-cluster with the load balancer controller's `TargetGroupBinding` CRD — so one load balancer is shared across many services, exactly like the ECS Cluster module's shared load balancers.

    - Public load balancers require **public subnet IDs**, inherited from the cluster reference (set them on the EKS Cluster module, where they flow in from its network reference).
    - Private load balancers are placed in the cluster's node subnets.
    - Each load balancer's security group is automatically allowed to reach pods through the EKS cluster security group (all TCP ports).
    - Because `TargetGroupBinding` depends on the controller, enabling any load balancer automatically installs the **load balancer controller** - there is nothing extra to configure.

    Terraform source: [ravionhq/modules/compute/eks/addons](https://github.com/ravionhq/modules/tree/$local.module_tag/compute/eks/addons)

    ## Prerequisites

    - An **EKS Cluster** module.
    - When a Helm-installed add-on runs (**Karpenter**, the **External Secrets Operator**, or any **shared load balancer** - which installs the **load balancer controller**): a **Terraform execution environment** that can reach the cluster's Kubernetes API endpoint. For private clusters, the execution environment must run inside the cluster VPC with the cluster's **Ravion Runner security group** attached. The other add-ons need no cluster connectivity.

    The Helm installs authenticate by assuming the cluster's **Ravion Runner role** (inherited automatically from the cluster reference) — a stable IAM role the EKS Cluster module registers as an access entry with cluster-admin. Per-run pipeline roles never appear in the cluster's access configuration.

    For the load balancer controller to place load balancers automatically, VPC subnets must carry the standard discovery tags: `kubernetes.io/role/elb = 1` on public subnets and `kubernetes.io/role/internal-elb = 1` on private subnets (alternatively, specify subnets per Ingress via annotation).

    ## Configuration

    | Field                  | Required | Default              | Description                                            |
    | ---------------------- | -------- | -------------------- | ------------------------------------------------------ |
    | EKS cluster            | Yes      | -                    | Existing EKS Cluster module                            |
    | Karpenter              | No       | `true`               | Autoscaling end to end (IAM, queue, controller, NodePool) |
    | Chart version          | No       | `1.14.0`             | Karpenter and karpenter-crd Helm chart version         |
    | Default NodePool       | No       | `true`               | General-purpose NodePool and EC2NodeClass              |
    | Load balancer controller chart version | No | `1.14.0`    | aws-load-balancer-controller Helm chart version (controller installed automatically with any load balancer) |
    | External Secrets Operator | No    | `true`               | Reference-only secrets, ClusterSecretStores, and a scoped Pod Identity role |
    | Readable secret ARNs   | No       | Account + region     | Scopes which Secrets Manager secrets and SSM parameters the operator may read |
    | EBS CSI driver         | No       | `false`              | EBS persistent volumes add-on and Pod Identity role    |
    | Container Insights     | No       | `true`               | CloudWatch Observability add-on and Pod Identity role  |
    | Public ALB             | No       | `false`              | Shared internet-facing ALB (HTTPS with ACM certificate) |
    | Private ALB            | No       | `false`              | Shared internal ALB                                    |
    | Public / private NLB   | No       | `false`              | Shared Network Load Balancers for TCP/UDP workloads    |
    | Load balancer deletion protection | No | `true`         | Prevent accidental deletion of the shared load balancers |
    | Tags                   | No       | Ravion defaults      | Tags on created resources and Karpenter-launched instances |

    ## Default NodePool

    The default NodePool provisions Linux nodes from current-generation `c`, `m`, and `r` instance families, using On-demand and Spot capacity, up to a total limit of 100 vCPUs. Nodes expire after 30 days so they are regularly replaced with patched AMIs. Disable it and bring your own NodePool manifests for full control.

