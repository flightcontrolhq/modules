    - collapsible: true
      default: false
      description: Enable public NLB access logging.
      id: public_nlb_access_logs_enabled
      label: Access logs
      show_when:
        public_nlb_enabled: true
      type: boolean
    - collapsible: true
      description: Existing S3 bucket ARN for public NLB access logs.
      id: public_nlb_access_logs_bucket_arn
      label: Access logs bucket ARN
      placeholder: arn:aws:s3:::my-bucket
      show_when:
        public_nlb_enabled: true
        public_nlb_access_logs_enabled: true
      type: string
    - default: false
      description: Create an internal Network Load Balancer.
      id: private_nlb_enabled
      label: Private NLB
      type: boolean
    - add_button_label: Add security group ID
      collapsible: true
      description: Additional security groups for the private NLB.
      id: private_nlb_security_group_ids
      label: Security groups
      placeholder: sg-...
      show_when:
        private_nlb_enabled: true
      type: string_array
    - collapsible: true
      default: false
      description: Enable cross-zone load balancing for the private NLB.
      id: private_nlb_cross_zone_load_balancing_enabled
      label: Cross-zone load balancing
      show_when:
        private_nlb_enabled: true
      type: boolean
    - collapsible: true
      default: false
      description: Assign static Elastic IPs to the private NLB.
      id: private_nlb_elastic_ips_enabled
      label: Use elastic IPs
      show_when:
        private_nlb_enabled: true
      type: boolean
    - add_button_label: Add allocation ID
      collapsible: true
      description: Elastic IP allocation IDs for the private NLB, one per subnet.
      id: private_nlb_elastic_ip_allocation_ids
      label: Elastic IP allocation IDs
      placeholder: eipalloc-...
      show_when:
        private_nlb_enabled: true
        private_nlb_elastic_ips_enabled: true
      type: string_array
    - collapsible: true
      default: false
      description: Enable private NLB access logging.
      id: private_nlb_access_logs_enabled
      label: Access logs
      show_when:
        private_nlb_enabled: true
      type: boolean
    - collapsible: true
      description: Existing S3 bucket ARN for private NLB access logs.
      id: private_nlb_access_logs_bucket_arn
      label: Access logs bucket ARN
      placeholder: arn:aws:s3:::my-bucket
      show_when:
        private_nlb_enabled: true
        private_nlb_access_logs_enabled: true
