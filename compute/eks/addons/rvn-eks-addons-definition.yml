      type: string
    - $include: ../../../partials/inputs/misc-section.yml
    - $include: ../../../partials/inputs/tags.yml
    - $include: ../../../partials/inputs/terraform-settings.yml
  stack:
    $template: ../../../partials/templates/opentofu-stack.yml
    with:
      base_path: compute/eks/addons
      terraform_variables:
        ...overrides: << module.input.advanced_terraform_variables >>
        cluster_name: << module.input.cluster_name >>
        region: << module.input.aws_region >>
        karpenter_enabled: << module.input.karpenter_enabled >>
        karpenter_controller_namespace: << module.input.karpenter_controller_namespace || "kube-system" >>
        karpenter_controller_service_account: << module.input.karpenter_controller_service_account || "karpenter" >>
        karpenter_chart_version: << module.input.karpenter_chart_version || "1.14.0" >>
        karpenter_helm_values: []
        karpenter_default_node_pool_enabled: '<< module.input.karpenter_default_node_pool_enabled != nil ? module.input.karpenter_default_node_pool_enabled : true >>'
        node_subnet_ids: << module.input.node_subnet_ids >>
        cluster_security_group_id: << module.input.cluster_security_group_id >>
        ravion_runner_role_arn: << module.input.ravion_runner_role_arn >>
        lb_controller_chart_version: << module.input.lb_controller_chart_version || "1.14.0" >>
        ebs_csi_driver_enabled: << module.input.ebs_csi_driver_enabled >>
        ebs_csi_addon_version: << module.input.ebs_csi_addon_version >>
        # The signal toggle folds into the provider list: off is an empty list, on
        # with nothing chosen is the default the form shows. The module reads the
        # lists and never the toggles.
        logs_providers: '<< module.input.logs_enabled == false ? [] : (module.input.logs_providers != nil ? module.input.logs_providers : ["loki"]) >>'
        metrics_providers: '<< module.input.metrics_enabled == false ? [] : (module.input.metrics_providers != nil ? module.input.metrics_providers : ["amp"]) >>'
        logs_namespace_exclude: '<< module.input.logs_namespace_exclude != nil ? module.input.logs_namespace_exclude : ["kube-system", "kube-node-lease", "amazon-cloudwatch", "ravion-beacon"] >>'
        logs_loki:
          retention_days: '<< module.input.log_retention_days != nil ? module.input.log_retention_days : 30 >>'
          s3_bucket: << module.input.loki_s3_bucket >>
        logs_cloudwatch:
          retention_days: '<< module.input.cloudwatch_logs_retention_days != nil ? module.input.cloudwatch_logs_retention_days : 30 >>'
        logs_grafana_cloud:
          url: << module.input.grafana_cloud_logs_url >>
          user: << module.input.grafana_cloud_logs_user >>
          token_secret_arn: << module.input.grafana_cloud_token_secret_arn >>
          stack_url: << module.input.grafana_cloud_stack_url >>
        logs_datadog:
          site: << module.input.datadog_site >>
          api_key_secret_arn: << module.input.datadog_api_key_secret_arn >>
        logs_new_relic:
          region: << module.input.new_relic_region >>
          license_key_secret_arn: << module.input.new_relic_license_key_secret_arn >>
        logs_opensearch:
          endpoint: << module.input.opensearch_endpoint >>
          index_prefix: << module.input.opensearch_index_prefix >>
        logs_splunk:
          hec_url: << module.input.splunk_hec_url >>
          hec_token_secret_arn: << module.input.splunk_hec_token_secret_arn >>
          index: << module.input.splunk_index >>
        logs_otlp:
          endpoint: << module.input.otlp_logs_endpoint >>
          headers_secret_arn: << module.input.otlp_headers_secret_arn >>
        # Vendor settings are shared between the signals: the field is asked for
        # once on whichever side selected the vendor first, and the metrics-side
        # id only exists for a metrics-only selection.
        metrics_amp:
          workspace_id: << module.input.amp_workspace_id >>
          region: << module.input.amp_region >>
        metrics_prometheus:
          retention_days: << module.input.prometheus_retention_days >>
          storage_size: << module.input.prometheus_storage_size >>
          endpoint: << module.input.prometheus_endpoint >>
        metrics_cloudwatch:
          enhanced_observability: '<< module.input.cloudwatch_enhanced_observability != nil ? module.input.cloudwatch_enhanced_observability : true >>'
          application_signals_enabled: '<< module.input.cloudwatch_application_signals_enabled != nil ? module.input.cloudwatch_application_signals_enabled : false >>'
          application_signals_namespaces: '<< module.input.cloudwatch_application_signals_namespaces != nil ? module.input.cloudwatch_application_signals_namespaces : [] >>'
          addon_version: << module.input.cloudwatch_observability_addon_version >>
        metrics_grafana_cloud:
          url: << module.input.grafana_cloud_metrics_url >>
          user: << module.input.grafana_cloud_metrics_user >>
          token_secret_arn: << module.input.grafana_cloud_token_secret_arn || module.input.metrics_grafana_cloud_token_secret_arn >>
          stack_url: << module.input.grafana_cloud_stack_url >>
        metrics_datadog:
          site: << module.input.datadog_site || module.input.metrics_datadog_site >>
          api_key_secret_arn: << module.input.datadog_api_key_secret_arn || module.input.metrics_datadog_api_key_secret_arn >>
        metrics_new_relic:
          region: << module.input.new_relic_region || module.input.metrics_new_relic_region >>
          license_key_secret_arn: << module.input.new_relic_license_key_secret_arn || module.input.metrics_new_relic_license_key_secret_arn >>
        metrics_otlp:
          endpoint: << module.input.otlp_metrics_endpoint >>
          headers_secret_arn: << module.input.otlp_headers_secret_arn || module.input.metrics_otlp_headers_secret_arn >>
        grafana_role_enabled: << module.input.grafana_role_enabled >>
        grafana_enabled: << module.input.grafana_enabled >>
        eso_enabled: '<< module.input.eso_enabled != nil ? module.input.eso_enabled : true >>'
        eso_chart_version: << module.input.eso_chart_version || "2.8.0" >>
        eso_namespace: << module.input.eso_namespace || "external-secrets" >>
        eso_secret_arns: '<< module.input.eso_secret_arns != nil ? module.input.eso_secret_arns : [] >>'
        beacon_enabled: << module.input.beacon_enabled >>
        beacon_deploy_enabled: << module.input.beacon_deploy_enabled >>
        beacon_deploy_namespaces: '<< module.input.beacon_deploy_namespaces != nil ? module.input.beacon_deploy_namespaces : [] >>'
        beacon_project_id: << project.id >>
        beacon_environment_id: << environment.id >>
        beacon_aws_account_id: << module.input.aws_account_id >>
        public_subnet_ids: << module.input.public_subnet_ids >>
        load_balancer_deletion_protection_enabled: << module.input.load_balancer_deletion_protection_enabled >>
        public_alb_enabled: << module.input.public_alb_enabled >>
        public_alb_https_enabled: << module.input.public_alb_https_enabled >>
        public_alb_certificate_arns: >-
          << (module.input.public_alb_certificate_arns != nil ? module.input.public_alb_certificate_arns : []) |
          concat(module.input.public_alb_additional_certificate_arns != nil ? module.input.public_alb_additional_certificate_arns : []) >>
        public_alb_ssl_policy: << module.input.public_alb_ssl_policy >>
        public_alb_idle_timeout: << module.input.public_alb_idle_timeout >>
        public_alb_web_acl_arn: << module.input.public_alb_web_acl_arn >>
        public_alb_access_logs_enabled: << module.input.public_alb_access_logs_enabled >>
        public_alb_access_logs_bucket_arn: << module.input.public_alb_access_logs_bucket_arn >>
        private_alb_enabled: << module.input.private_alb_enabled >>
        private_alb_https_enabled: << module.input.private_alb_https_enabled >>
        private_alb_certificate_arns: >-
          << (module.input.private_alb_certificate_arns != nil ? module.input.private_alb_certificate_arns : []) |
          concat(module.input.private_alb_additional_certificate_arns != nil ? module.input.private_alb_additional_certificate_arns : []) >>
        private_alb_ssl_policy: << module.input.private_alb_ssl_policy >>
        private_alb_ingress_cidr_blocks: << module.input.private_alb_ingress_cidr_blocks >>
        private_alb_ingress_ipv6_cidr_blocks: << module.input.private_alb_ingress_ipv6_cidr_blocks >>
        private_alb_ingress_security_group_ids: << module.input.private_alb_ingress_security_group_ids >>
        private_alb_idle_timeout: << module.input.private_alb_idle_timeout >>
        private_alb_access_logs_enabled: << module.input.private_alb_access_logs_enabled >>
        private_alb_access_logs_bucket_arn: << module.input.private_alb_access_logs_bucket_arn >>
        public_nlb_enabled: << module.input.public_nlb_enabled >>
        public_nlb_security_group_ids: << module.input.public_nlb_security_group_ids >>
        public_nlb_cross_zone_load_balancing_enabled: << module.input.public_nlb_cross_zone_load_balancing_enabled >>
        public_nlb_elastic_ips_enabled: << module.input.public_nlb_elastic_ips_enabled >>
        public_nlb_elastic_ip_allocation_ids: << module.input.public_nlb_elastic_ip_allocation_ids >>
        public_nlb_access_logs_enabled: << module.input.public_nlb_access_logs_enabled >>
        public_nlb_access_logs_bucket_arn: << module.input.public_nlb_access_logs_bucket_arn >>
        private_nlb_enabled: << module.input.private_nlb_enabled >>
        private_nlb_security_group_ids: << module.input.private_nlb_security_group_ids >>
        private_nlb_cross_zone_load_balancing_enabled: << module.input.private_nlb_cross_zone_load_balancing_enabled >>
        private_nlb_elastic_ips_enabled: << module.input.private_nlb_elastic_ips_enabled >>
        private_nlb_elastic_ip_allocation_ids: << module.input.private_nlb_elastic_ip_allocation_ids >>
        private_nlb_access_logs_enabled: << module.input.private_nlb_access_logs_enabled >>
        private_nlb_access_logs_bucket_arn: << module.input.private_nlb_access_logs_bucket_arn >>
        tags:
          $include: ../stack/ravion-tags.yml
  ui:
    links: |-
      <<
      (module.input.public_alb_enabled && stack.output.public_alb_dns_name ? [{"name":"Public ALB","href":(module.input.public_alb_https_enabled ? "https://" : "http://") + stack.output.public_alb_dns_name}] : []) +
      (module.input.private_alb_enabled && stack.output.private_alb_dns_name ? [{"name":"Private ALB","href":(module.input.private_alb_https_enabled ? "https://" : "http://") + stack.output.private_alb_dns_name}] : []) +
      (module.input.public_nlb_enabled && stack.output.public_nlb_dns_name ? [{"name":"Public NLB","href":"http://" + stack.output.public_nlb_dns_name}] : []) +
      (module.input.private_nlb_enabled && stack.output.private_nlb_dns_name ? [{"name":"Private NLB","href":"http://" + stack.output.private_nlb_dns_name}] : [])
      >>
    # Cluster-health charts from this module's own Amazon Managed Prometheus
    # workspace. Every workspace identifier is a stack output that is null
    # while Metrics is disabled, so the charts sit in their pending state
    # rather than erroring - and light up on the first apply that enables
    # Metrics. Metric names must stay within the curated allow-list in
    # locals.tf.
    metrics:
      - id: node_cpu
        name: Node CPU usage
        type: line
        source:
          type: prometheus
          aws_account_id: << module.input.aws_account_id >>
          region: << stack.output.amp_region >>
          workspace_id: << stack.output.amp_workspace_id >>
          query: 'sum(rate(node_cpu_usage_seconds_total[$__interval]))'
          unit: cores
      - id: node_cpu_allocatable
        name: Node CPU allocatable
        type: line
        source:
          type: prometheus
          aws_account_id: << module.input.aws_account_id >>
          region: << stack.output.amp_region >>
          workspace_id: << stack.output.amp_workspace_id >>
          query: 'sum(kube_node_status_allocatable{resource="cpu"})'
          unit: cores
      - id: node_memory
        name: Node memory working set
        type: line
        source:
          type: prometheus
          aws_account_id: << module.input.aws_account_id >>
          region: << stack.output.amp_region >>
          workspace_id: << stack.output.amp_workspace_id >>
          query: 'sum(node_memory_working_set_bytes)'
          unit: B
      - id: nodes_ready
        name: Nodes ready
        type: line
        source:
          type: prometheus
          aws_account_id: << module.input.aws_account_id >>
          region: << stack.output.amp_region >>
          workspace_id: << stack.output.amp_workspace_id >>
          query: 'sum(kube_node_status_condition{condition="Ready",status="true"})'
      - id: pods_running
        name: Pods running
        type: line
        source:
          type: prometheus
          aws_account_id: << module.input.aws_account_id >>
          region: << stack.output.amp_region >>
          workspace_id: << stack.output.amp_workspace_id >>
          query: 'sum(kube_pod_status_phase{phase="Running"})'
      - id: pods_pending
        name: Pods pending
        type: line
        source:
          type: prometheus
          aws_account_id: << module.input.aws_account_id >>
          region: << stack.output.amp_region >>
          workspace_id: << stack.output.amp_workspace_id >>
          query: 'sum(kube_pod_status_phase{phase="Pending"})'
  readme: |-
    Selectable add-ons for an existing EKS cluster. Each add-on is toggled independently and brings its own IAM wiring, so the cluster module stays lean and clusters only carry what they use.

    ## Add-ons

    | Add-on | Default | What it provides |
    | ------ | ------- | ---------------- |
    | **Karpenter** | On | Just-in-time node autoscaling: controller and node IAM roles, Pod Identity association, instance profile, SQS interruption queue, EventBridge rules, the controller Helm charts, and an optional default NodePool |
    | **Load balancer controller** | With load balancers | Installed automatically when any shared load balancer is enabled; registers workload pods into their target groups (TargetGroupBinding) via the AWS Load Balancer Controller Helm chart wired to the cluster module's Pod Identity role. Opt in without shared load balancers via advanced Terraform variables to provision ALBs/NLBs directly from Ingress and LoadBalancer resources |
    | **External Secrets Operator** | On | Reference-only secrets: workloads name a Secrets Manager secret or SSM parameter by ARN, and the operator materializes it into a Kubernetes secret using its own scoped Pod Identity role |
    | **EBS CSI driver** | Off | EBS-backed persistent volumes via the aws-ebs-csi-driver EKS add-on and its Pod Identity role |
    | **Logs** | On (in-cluster store) | Container output collected on every node and delivered to the destinations you choose - an in-cluster store on S3 by default, plus CloudWatch Logs or a vendor on request |
    | **Metrics** | On (Amazon Managed Prometheus) | Per-container CPU, memory, network, restart and scaling metrics, delivered to the destinations you choose - Amazon Managed Prometheus by default, plus CloudWatch Container Insights or a vendor on request |
    | **Ravion EKS Management** | Off | Registers the cluster with the Ravion control plane and installs the Beacon agent, which reports workload and node state outbound over a single WebSocket and can optionally run Ravion's deploys from inside the cluster |
    | **Shared load balancers** | Off | Terraform-managed public/private ALBs and NLBs that web workloads attach to via the load balancer controller's TargetGroupBinding — the same shared-LB pattern the ECS Cluster module uses |

    EBS CSI and the CloudWatch Observability add-on are native EKS add-ons installed purely through the AWS API. Karpenter, the load balancer controller, the External Secrets Operator, Ravion EKS Management, and both observability pipelines additionally install Helm charts into the cluster, which are the only parts that need Kubernetes API connectivity.

    ## Logs and metrics destinations

    Each signal is one multi-select. **The in-cluster log store and Amazon Managed Prometheus are the defaults**, so a new cluster's Logs and Metrics tabs work with nothing filled in. Nothing CloudWatch is installed by default, or as a side effect of anything else.

    | Logs destination | What runs | In Ravion |
    | ---------------- | --------- | --------- |
    | **In-cluster log store (Loki)** - default | Alloy on every node, Loki in the cluster, chunks in an S3 bucket in your account | Renders in the Logs tab |
    | **Amazon CloudWatch Logs** | An OpenTelemetry collector on every node, writing to `/ravion/eks/<cluster>` | Renders, and is read when the in-cluster agent is offline |
    | **Grafana Cloud Logs** | The same Alloy agent, writing to your Grafana Cloud endpoint as well | Ships, plus an "Open in Grafana Cloud" link |
    | **Datadog / New Relic / custom OTLP** | The OpenTelemetry collector, one exporter each | Ships, plus an "Open in ..." link |

    | Metrics destination | What runs | In Ravion |
    | ------------------- | --------- | --------- |
    | **Amazon Managed Prometheus** - default | One collector scraping a curated metric set, remote-writing over SigV4 | Renders in the Metrics tabs |
    | **Amazon CloudWatch (Container Insights)** | The amazon-cloudwatch-observability add-on's metrics half | Renders, as the fallback behind Amazon Managed Prometheus |
    | **Grafana Cloud / Datadog / New Relic / custom OTLP** | The same collector, one more exporter each | Ships, plus an "Open in ..." link |

    **Several destinations that render are a fallback chain, not a merge.** Ravion reads the first one that can answer right now - the in-cluster store, then CloudWatch Logs; Amazon Managed Prometheus, then Container Insights - and says which store it is showing. It never merges two of them for the same service, which would show every line twice.

    **What each costs.** The in-cluster store costs S3 storage and requests plus the collector pods, with no per-gigabyte ingestion charge. Amazon Managed Prometheus bills per metric sample - roughly $25-50 a month for a 20-service cluster. CloudWatch bills per gigabyte of logs ingested and per metric. Every vendor bills for what it receives, so choosing two of them ships - and pays for - the same lines twice. That is a choice the form makes visible rather than one it prevents.

    **Vendor keys are references, never values.** Every API key, token and license key is a Secrets Manager ARN. The External Secrets Operator this module installs reads it in-cluster with its own IAM role and hands it to the collector; the value passes through neither Ravion nor Helm, and appears in no release history. Selecting a vendor with External secrets turned off fails the deployment rather than installing a collector that cannot authenticate.

    **CloudWatch Container Insights** is one of these destinations now, not a section of its own. Choosing it installs the add-on with **Auto-Monitor off**: left at its default, that webhook injects the AWS OpenTelemetry agent into every workload in the cluster and restarts the pods to do it. Application Signals auto-instrumentation is a separate toggle, off unless asked for, with a namespace list.

    **Upgrading from 0.7.x** changes nothing you did not ask for: a cluster with Logs on keeps the in-cluster store, a cluster with Logs off stays off, and a cluster that had Container Insights on keeps it as the fallback behind Amazon Managed Prometheus. The one behavioural change is that the CloudWatch add-on is re-applied with Auto-Monitor off, so agents it had injected leave workloads on their next rollout.

    ## Ravion EKS Management

    Beacon is Ravion's in-cluster agent. It dials the control plane outbound over a single WebSocket and reports workload, rollout, and node state back — the control plane can never dial in, which is what makes a cluster with a private API endpoint observable from Ravion at all. Outbound 443 to the agent endpoint is the only egress a cluster has to allow.

    Enabling the toggle does three things in one deployment: Ravion issues the agent's credential — server-side, authorized by the pipeline's own credentials, so there is no API key to paste — writes it into the agent's Kubernetes secret and mirrors it into a Secrets Manager secret **in your own AWS account**, and installs the agent's Helm chart. The plaintext is issued exactly once; rotating or revoking it is a redeploy, not an API call.

    By default the agent is read-only. One grant widens it, declined by default:

    - **Beacon-run deployments** — lets Ravion's Helm upgrades run from inside the cluster instead of reaching in from outside. Within the named **deploy namespaces** the agent can create, update, and delete workload objects; it can never create RBAC objects, namespaces, or anything cluster-scoped. There is no cluster-wide deploy posture: with no namespace named, the install fails rather than granting one. Leaving this off still gives a fully working agent — deploys continue to run from outside the cluster.

    The project, environment, and AWS account this module belongs to are recorded on the agent automatically when its credential is issued; there is nothing to fill in.

    Everything else about the install is tuning, so it is not on the form. Set these through **Advanced Terraform variables** when a cluster needs them:

    | Terraform variable | Default | What it changes |
    | ------------------ | ------- | --------------- |
    | `beacon_endpoint` | `wss://websockets.ravion.com/beacon/v1/connect` | WebSocket endpoint the agent dials — the single destination an egress policy must allow. Override only for a staging or self-hosted control plane |
    | `beacon_chart_version` | `0.4.0` | Beacon **chart** version, pinned per module release; never the agent version — the chart keeps whatever the release is running and Ravion rolls it forward. Set to `null` to track the registry's latest |
    | `beacon_namespace` | `ravion-beacon` | Namespace the agent and its credential secret are installed into, created if missing |
    | `beacon_namespace_scope` | `[]` (cluster-wide read) | Namespaces the agent may observe. Naming namespaces renders no cluster-scoped read role at all, only one namespaced role per entry, so the restriction is enforced by Kubernetes rather than by the agent. A scoped agent cannot read nodes, so cluster node counts show as unknown |

    **Deploy namespaces** falls back to `beacon_namespace_scope` when left empty, so a cluster scoped through the advanced variable also bounds Beacon's deploys by default.

    ## External secrets

    Kubernetes has no equivalent of the ECS task definition's `valueFrom` injection, so this add-on installs the External Secrets Operator as the bridge. A service references a secret **by ARN**; the operator reads it with its own IAM role and materializes it into a Kubernetes secret in the service's namespace. Values live only in AWS — they never pass through Ravion, Helm values, or Helm release history.

    Two cluster-scoped stores are created for services to reference, one per AWS backend (the operator's AWS provider takes a single service per store):

    | Backend | Store name | Kind |
    | ------- | ---------- | ---- |
    | AWS Secrets Manager | `ravion-aws` | `ClusterSecretStore` |
    | AWS SSM Parameter Store | `ravion-aws-parameter-store` | `ClusterSecretStore` |

    By default the operator may read every secret and parameter in the cluster's account and region. Add **readable secret ARNs** to scope it to specific secrets or prefixes, or to grant access in another region or account.

    At rest, the Kubernetes secrets the operator writes are KMS envelope-encrypted in etcd — the EKS Cluster module enables that by default with a dedicated key per cluster.

    ## Shared load balancers

    Instead of letting each Ingress provision its own ALB, this module can create up to four shared load balancers (public/private ALB, public/private NLB) with Terraform. Workload modules then create a target group and listener rule, and bind pods to the target group in-cluster with the load balancer controller's `TargetGroupBinding` CRD — so one load balancer is shared across many services, exactly like the ECS Cluster module's shared load balancers.

    - Public load balancers require **public subnet IDs**, inherited from the cluster reference (set them on the EKS Cluster module, where they flow in from its network reference).
    - Private load balancers are placed in the cluster's node subnets.
    - Each load balancer's security group is automatically allowed to reach pods through the EKS cluster security group (all TCP ports).
    - Because `TargetGroupBinding` depends on the controller, enabling any load balancer automatically installs the **load balancer controller** - there is nothing extra to configure.

    Terraform source: [ravionhq/modules/compute/eks/addons](https://github.com/ravionhq/modules/tree/$local.module_tag/compute/eks/addons)

    ## Prerequisites

    - An **EKS Cluster** module.
    - When a Helm-installed add-on runs (**Karpenter**, the **External Secrets Operator**, **Ravion EKS Management**, or any **shared load balancer** - which installs the **load balancer controller**): a **Terraform execution environment** that can reach the cluster's Kubernetes API endpoint. For private clusters, the execution environment must run inside the cluster VPC with the cluster's **Ravion Runner security group** attached. The other add-ons need no cluster connectivity.

    The Helm installs authenticate by assuming the cluster's **Ravion Runner role** (inherited automatically from the cluster reference) — a stable IAM role the EKS Cluster module registers as an access entry with cluster-admin. Per-run pipeline roles never appear in the cluster's access configuration.

    For the load balancer controller to place load balancers automatically, VPC subnets must carry the standard discovery tags: `kubernetes.io/role/elb = 1` on public subnets and `kubernetes.io/role/internal-elb = 1` on private subnets (alternatively, specify subnets per Ingress via annotation).

    ## Configuration

    | Field                  | Required | Default              | Description                                            |
    | ---------------------- | -------- | -------------------- | ------------------------------------------------------ |
    | EKS cluster            | Yes      | -                    | Existing EKS Cluster module                            |
    | Karpenter              | No       | `true`               | Autoscaling end to end (IAM, queue, controller, NodePool) |
    | Chart version          | No       | `1.14.0`             | Karpenter and karpenter-crd Helm chart version         |
    | Default NodePool       | No       | `true`               | General-purpose NodePool and EC2NodeClass              |
    | Load balancer controller chart version | No | `1.14.0`    | aws-load-balancer-controller Helm chart version (controller installed automatically with any load balancer) |
    | External Secrets Operator | No    | `true`               | Reference-only secrets, ClusterSecretStores, and a scoped Pod Identity role |
    | Readable secret ARNs   | No       | Account + region     | Scopes which Secrets Manager secrets and SSM parameters the operator may read |
    | EBS CSI driver         | No       | `false`              | EBS persistent volumes add-on and Pod Identity role    |
    | Logs                   | No       | `true`               | Collect container logs at all                          |
    | Logs providers         | No       | In-cluster store     | Any combination of the log destinations above           |
    | Metrics                | No       | `true`               | Collect workload metrics at all                        |
    | Metrics providers      | No       | Amazon Managed Prometheus | Any combination of the metric destinations above   |
    | Existing workspace ID  | No       | Creates one          | Write into an existing AMP workspace instead of creating `ravion-<cluster>` |
    | Retention (days)       | No       | `30`                 | How long logs stay searchable before they are deleted from the bucket |
    | Application Signals    | No       | `false`              | CloudWatch auto-instrumentation: injects the AWS agent into the named namespaces and restarts their pods |
    | Existing log bucket    | No       | Creates one          | Store logs in an existing bucket instead of `ravion-loki-<cluster>-<account>` |
    | In-cluster Grafana     | No       | `false`              | Grafana in the cluster, wired to both metrics and logs |
    | Grafana read access    | No       | `false`              | Read-only IAM role for Amazon Managed Grafana over the AMP workspace |
    | Ravion EKS Management  | No       | `false`              | Registers the cluster and installs the Beacon agent    |
    | Beacon-run deployments | No       | `false`             | Lets Beacon run Ravion's deploys from inside the cluster, scoped to named namespaces |
    | Public ALB             | No       | `false`              | Shared internet-facing ALB (HTTPS with ACM certificate) |
    | Private ALB            | No       | `false`              | Shared internal ALB                                    |
    | Public / private NLB   | No       | `false`              | Shared Network Load Balancers for TCP/UDP workloads    |
    | Load balancer deletion protection | No | `true`         | Prevent accidental deletion of the shared load balancers |
    | Tags                   | No       | Ravion defaults      | Tags on created resources and Karpenter-launched instances |

    ## Default NodePool

    The default NodePool provisions Linux nodes from current-generation `c`, `m`, and `r` instance families, using On-demand and Spot capacity, up to a total limit of 100 vCPUs. Nodes expire after 30 days so they are regularly replaced with patched AMIs. Disable it and bring your own NodePool manifests for full control.

    ## Learn more

    - [Karpenter](https://karpenter.sh/docs/) - Just-in-time node autoscaling
    - [Karpenter NodePools](https://karpenter.sh/docs/concepts/nodepools/) - Customizing provisioning behavior
    - [AWS Load Balancer Controller](https://kubernetes-sigs.github.io/aws-load-balancer-controller/) - Ingress and Service load balancing
    - [External Secrets Operator](https://external-secrets.io/) - Referencing AWS secrets from Kubernetes workloads
    - [Amazon EBS CSI driver](https://docs.aws.amazon.com/eks/latest/userguide/ebs-csi.html) - Persistent volumes on EKS
    - [Container Insights](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/ContainerInsights.html) - Cluster observability in CloudWatch
    - [CloudWatch Application Signals](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Application-Signals-Enable-EKS.html) - What auto-instrumentation does to a workload
    - [OpenTelemetry Collector](https://opentelemetry.io/docs/collector/) - The collector carrying every non-Loki destination
    - [External Secrets Operator](https://external-secrets.io/) - How vendor credentials reach the collectors
    - [Amazon Managed Prometheus](https://docs.aws.amazon.com/prometheus/latest/userguide/what-is-Amazon-Managed-Service-Prometheus.html) - Managed Prometheus workspaces and pricing
    - [Querying an AMP workspace from Grafana](https://docs.aws.amazon.com/grafana/latest/userguide/prometheus-data-source.html) - Configuring the data source
    - [Grafana Loki](https://grafana.com/docs/loki/latest/) - The in-cluster log store
    - [Grafana Alloy](https://grafana.com/docs/alloy/latest/) - The log collection agent
