definition:
  type: rvn-ec2-service
  name: EC2 Service
  description: Runs supervised workloads on a stable EC2 Auto Scaling Group, with optional shared ALB routing and switchable container or manual in-place deploys.
release:
  version: 0.0.1
  description: Add an EC2 service with standalone or ECS-cluster ALB routing, switchable deploy modes, authenticated Git checkout, shared image builds, and deployment-scoped logs.
module:
  inputs:
    - id: network
      immutable: true
      label: VPC network
      type: $ref:rvn-aws-network
      description: Existing Ravion network that supplies the AWS account, region, VPC, and public and private subnets for the instances.
      mapped_inputs:
        - $template: ../../partials/templates/network-ref-mapped-inputs.yml
          with:
            aws_account_id_default: << ref.input.aws_account_id >>
            aws_region_default: << ref.input.aws_region >>
            execution_environment_default: << ref.input.execution_environment_id >>
            private_subnet_ids_default: <<ref.stack.output.private_subnet_ids>>
            public_subnet_ids_default: <<ref.stack.output.public_subnet_ids>>
            vpc_id_default: <<ref.stack.output.vpc_id>>
      required: true
    - id: section_service
      label: EC2 service
      type: section
    - id: name
      immutable: true
      label: Service name
      type: string
      description: Name for the instance group and related resources.
      required: true
      default: <<project.given_id>>-<<environment.given_id>>-<<module.given_id>>
      patterns:
        - message: 1-28 lowercase letters, numbers, and hyphens. Start and end with a letter or number.
          pattern: ^[a-z0-9]([a-z0-9-]{0,26}[a-z0-9])?$
    - id: deploy_type
      label: Deploy type
      type: string
      description: Choose in-place container image deploys or host-level shell commands. Instances support both modes, so this can change after creation.
      required: true
      default: container
      values:
        - label: Container
          description: Pull an image and replace the supervised Docker container on each existing instance.
          value: container
        - label: Manual
          description: Run release preparation commands on each instance, then start a supervised foreground command on the host.
          value: manual
    - id: deploy_source_repo
      label: Git repository
      type: gitrepo
      description: Optional repository to check out before manual deploy commands run. Leave blank to run the commands without a managed source checkout.
      required: false
      show_when:
        deploy_type: manual
    - id: deploy_source_base_path
      label: Source base path
      type: string
      description: Repository-relative working directory for manual deploy and start commands when a Git repository is selected.
      required: false
      default: .
      show_when:
        deploy_type: manual
    - id: deploy_commands
      label: Deploy commands
      type: string_array
      description: Release preparation commands run as root, in order, on every instance during each manual deploy. Keep them idempotent; any command that exits non-zero fails that instance's deploy.
      add_button_label: Add command
      placeholder: cd /srv/app && git pull
      required: true
      show_when:
        deploy_type: manual
    - id: start_command
      label: Start command
      type: string
      description: Long-running foreground app command that supervisord runs as root after preparation and restarts if it exits. Use a wrapper to drop privileges when needed; the command must not daemonize.
      placeholder: cd /srv/app && ./bin/server
      required: true
      show_when:
        deploy_type: manual
    - id: private_subnet_placement_enabled
      label: Run in private subnets
      type: boolean
      description: Recommended for production. Private instances need NAT or equivalent outbound access for bootstrap, SSM, logs, and image pulls. Turn off to use public subnets and public IPs.
      default: true
    - id: section_instances
      label: Instances
      type: section
      description: Instances are stable. Deploys update them in place and never replace them, so instance storage survives releases.
    - id: instance_type
      label: Instance type
      type: string
      description: EC2 instance type for every host in the group. The default Amazon Linux 2023 AMI follows the selected CPU architecture; supplied or built container images must support the same architecture.
      required: true
      no_options_message: Select a VPC Network, or enter an AWS account and region, to load available EC2 instance types.
      values: $values:aws/ec2/instances?awsAccountId=<<module.input.aws_account_id>>&region=<<module.input.aws_region>>
    - id: min_size
      label: Min instances
      type: number
      description: Minimum instances in the group.
      min: 0
      required: true
      default: 1
    - id: max_size
      label: Max instances
      type: number
      description: Maximum instances in the group.
      min: 1
      required: true
      default: 3
    - id: cpu_target_tracking_enabled
      label: CPU autoscaling
      type: boolean
      description: Scale the group between min and max instances to maintain the target average CPU utilization. New instances receive the current release automatically.
      default: false
    - id: cpu_target_value
      label: CPU target (%)
      type: number
      description: Average EC2 CPU utilization that target-tracking autoscaling tries to maintain.
      max: 100
      min: 1
      show_when:
        cpu_target_tracking_enabled: true
      default: 70
    - id: desired_capacity
      label: Desired instances
      type: number
      description: Instances the group keeps running when CPU autoscaling is off. Must be between Min and Max instances. Leave blank to keep the current group size.
      min: 0
      required: false
      show_when:
        cpu_target_tracking_enabled: false
    - id: key_name
      label: SSH key pair name
      type: string
      description: Optional EC2 key pair for SSH access. Session Manager works without a key when the instance can reach SSM.
      collapsible: true
      placeholder: my-key-pair
      required: false
    - id: ami_id
      label: Custom AMI ID
      type: string
      description: Custom AMI for new instances. Leave blank for the latest architecture-matched Amazon Linux 2023 AMI. Custom images must be AL2023-compatible and include cloud-init, systemd, dnf, AWS CLI, curl, and the SSM agent.
      collapsible: true
      placeholder: ami-...
      required: false
    - id: additional_security_group_ids
      label: Additional security groups
      type: string_array
      description: Additional security groups attached to the instances.
      add_button_label: Add security group ID
      collapsible: true
      placeholder: sg-...
      required: false
    - id: additional_user_data
      label: Additional user data
      type: text
      description: Shell script run as root after Ravion's bootstrap on every newly launched instance. Changes apply only to future instances unless you recycle the existing ones.
      collapsible: true
      placeholder: "#!/bin/bash"
      required: false
    - $include: ../../partials/inputs/ec2-build-inputs.yml
    - id: section_web
      label: Web service
      type: section
    - id: web_service_enabled
      label: Web service
      type: boolean
      description: Serve HTTP traffic through a shared Application Load Balancer. Turn off to run a worker group with no load balancer.
      default: true
    - id: load_balancer_source
      immutable: true
      label: Load balancer source
      type: string
      description: Select a standalone Application Load Balancer or reuse a public or private ALB from an ECS cluster. The selected load balancer must use the same AWS account, region, and VPC as the VPC network.
      required: true
      default: standalone_alb
      show_when:
        web_service_enabled: true
      values:
        - label: Standalone ALB module
          description: Attach to a standalone Ravion Application Load Balancer.
          value: standalone_alb
        - label: ALB from ECS Cluster module
          description: Attach to the public or private ALB created by a Ravion ECS cluster.
          value: ecs_cluster
    - id: alb
      immutable: true
      label: Standalone ALB module
      type: $ref:rvn-aws-alb
      description: Standalone shared load balancer this service attaches its listener rules to. It must use the same AWS account, region, and VPC as the selected VPC network.
      mapped_inputs:
        - default: <<ref.stack.output.http_listener_arn>>
          id: alb_http_listener_arn
          immutable: true
          label: ALB HTTP listener ARN
          required: false
          type: string
        - default: <<ref.stack.output.https_listener_arn>>
          id: alb_https_listener_arn
          immutable: true
          label: ALB HTTPS listener ARN
          required: false
          type: string
        - default: <<ref.stack.output.security_group_id>>
          id: alb_security_group_id
          immutable: true
          label: ALB security group ID
          required: true
          type: string
      required: true
      show_when:
        web_service_enabled: true
        load_balancer_source: standalone_alb
    - id: ecs_cluster
      immutable: true
      label: ALB from ECS Cluster module
      type: $ref:rvn-ecs-cluster
      description: ECS cluster whose public or private Application Load Balancer receives this service's listener rule. The cluster must use the same AWS account, region, and VPC as the selected VPC network.
      mapped_inputs:
        - $include: ../../partials/inputs/ecs-service-cluster-alb-mapped-inputs.yml
      required: true
      show_when:
        web_service_enabled: true
        load_balancer_source: ecs_cluster
    - id: ecs_cluster_alb_visibility
      label: ALB to use from ECS Cluster module
      type: string
      description: Choose the public or private Application Load Balancer from the selected ECS cluster. The selected load balancer and at least one HTTP or HTTPS listener must be enabled on the cluster.
      required: true
      default: public
      show_when:
        web_service_enabled: true
        load_balancer_source: ecs_cluster
      values:
        - label: Public
          description: Route through the cluster's internet-facing Application Load Balancer.
          value: public
        - label: Private
          description: Route through the cluster's internal Application Load Balancer.
          value: private
    - id: app_port
      immutable: true
      label: App port
      type: number
      description: Port the host application listens on. Container mode publishes the same container port, and PORT is set automatically.
      max: 65535
      min: 1
      required: true
      show_when:
        web_service_enabled: true
      default: 80
    - $template: ../../partials/templates/alb-listener-rule-inputs.yml
      with:
        field_overrides:
          show_when:
            web_service_enabled: true
    - id: section_health
      label: Health check
      show_when:
        web_service_enabled: true
      type: section
    - id: health_check_path
      label: Health check path
      type: string
      description: HTTP path used by the load balancer health check and by the Container-mode deploy gate on each instance. Use a lightweight endpoint that does not require authentication.
      required: true
      show_when:
        web_service_enabled: true
      default: /
    - id: health_check_matcher
      label: Success codes
      type: string
      description: HTTP status codes the ALB treats as healthy, such as 200-399. The local deploy gate separately requires a response below 400.
      collapsible: true
      placeholder: 200-399
      required: true
      show_when:
        web_service_enabled: true
      default: 200-399
    - id: health_check_interval
      label: Interval (secs)
      type: number
      description: Seconds between Application Load Balancer health checks.
      collapsible: true
      max: 300
      min: 5
      show_when:
        web_service_enabled: true
      default: 10
    - id: health_check_timeout
      label: Timeout (secs)
      type: number
      description: Seconds the Application Load Balancer waits for a health-check response. Must be lower than the interval.
      collapsible: true
      max: 120
      min: 2
      show_when:
        web_service_enabled: true
      default: 5
    - id: healthy_threshold
      label: Healthy threshold
      type: number
      description: Consecutive successful ALB checks required before an instance is healthy.
      collapsible: true
      max: 10
      min: 2
      show_when:
        web_service_enabled: true
      default: 2
    - id: unhealthy_threshold
      label: Unhealthy threshold
      type: number
      description: Consecutive failed ALB checks required before an instance is unhealthy.
      collapsible: true
      max: 10
      min: 2
      show_when:
        web_service_enabled: true
      default: 2
    - id: deregistration_delay
      label: Deregistration delay (secs)
      type: number
      description: Seconds allowed for in-flight requests to drain before a Container-mode in-place swap. Draining is skipped when the instance is the target group's only registered target.
      collapsible: true
      max: 3600
      min: 0
      show_when:
        web_service_enabled: true
      default: 30
    - id: target_group_stickiness_enabled
      label: Sticky sessions
      type: boolean
      description: Keep repeat requests on the same instance using a load balancer cookie.
      collapsible: true
      show_when:
        web_service_enabled: true
      default: false
    - id: target_group_stickiness_cookie_duration
      label: Stickiness cookie duration (secs)
      type: number
      description: How long the load balancer cookie keeps a client routed to the same instance.
      collapsible: true
      max: 604800
      min: 1
      show_when:
        web_service_enabled: true
        target_group_stickiness_enabled: true
      default: 86400
    - id: section_app_config
      label: Environment variables
      type: section
    - $merge:
        - ../../partials/inputs/build-environment-variables.yml
      show_when:
        deploy_type: container
        build_source:
          - dockerfile
          - railpack
    - $merge:
        - ../../partials/inputs/dockerfile-env-injection.yml
      show_when:
        deploy_type: container
        build_source: dockerfile
    - id: environment_variables
      label: Runtime environment variables
      type: array
      description: Plain, single-line environment variables written to each instance at boot and refreshed on every deploy. PORT is added automatically for web services.
      placeholder: |-
        - name: NODE_ENV
          value: production
    - id: secrets
      label: Runtime secrets
      type: array
      description: Secret environment variables as {name, value_from} objects. Use a same-account Secrets Manager ARN, SSM parameter ARN, or SSM parameter name. Values are fetched on each instance and stay out of Terraform state; multi-line values are unsupported.
      placeholder: |-
        - name: DATABASE_URL
          value_from: arn:aws:ssm:us-east-1:123456789012:parameter/my-secret
    - id: section_storage
      label: Storage
      type: section
      description: Instance volumes survive in-place deploys but not instance termination. Use an EFS file system for storage that must outlive instances.
    - id: root_volume_size
      label: Root volume size (GB)
      type: number
      description: Encrypted gp3 root volume size for each instance. It survives in-place deploys but is deleted with the instance.
      collapsible: true
      max: 16384
      min: 8
      default: 30
    - id: data_volume_enabled
      label: Data volume
      type: boolean
      description: Attach an independent encrypted gp3 EBS volume to each instance and mount it on the host. Container mode bind-mounts the same path. The volume is deleted with the instance and is not shared.
      default: false
    - id: data_volume_size
      label: Data volume size (GB)
      type: number
      description: Size of the dedicated EBS data volume attached to each instance.
      max: 16384
      min: 1
      show_when:
        data_volume_enabled: true
      default: 20
    - id: data_volume_mount_path
      label: Data volume mount path
      type: string
      description: Absolute host path for the data volume. Container deploys bind-mount the same path into the app container.
      required: true
      show_when:
        data_volume_enabled: true
      default: /data
      patterns:
        - message: Use an absolute path.
          pattern: ^/
    - id: efs_enabled
      label: EFS file system
      type: boolean
      description: Mount an EFS file system on every instance. The service attaches the file system's client security group automatically.
      default: false
    - id: efs
      label: EFS file system
      type: $ref:rvn-efs
      description: Existing Ravion EFS module to mount on every instance for shared storage that survives instance replacement.
      mapped_inputs:
        - default: <<ref.stack.output.file_system_id>>
          id: efs_file_system_id
          label: EFS file system ID
          type: string
        - default: <<ref.stack.output.access_point_id>>
          id: efs_access_point_id
          label: EFS access point ID
          required: false
          type: string
        - default: <<ref.stack.output.client_security_group_id>>
          id: efs_client_security_group_id
          label: EFS client security group ID
          type: string
      required: true
      show_when:
        efs_enabled: true
    - id: efs_mount_path
      label: EFS mount path
      type: string
      description: Host path where the file system is mounted. Container apps see it at the same path.
      required: true
      show_when:
        efs_enabled: true
      default: /mnt/efs
      patterns:
        - message: Use an absolute path.
          pattern: ^/
    - $template: ../../partials/templates/builder-infrastructure-inputs.yml
      with:
        no_options_message: Select a VPC Network, or enter an AWS account and region, to load available EC2 instance types.
        show_when:
          deploy_type: container
          build_source:
            - dockerfile
            - railpack
            - nixpacks
    - $include: ../../partials/inputs/misc-section.yml
    - id: log_retention_in_days
      label: Log retention (days)
      type: number
      description: CloudWatch retention for app logs.
      collapsible: true
      min: 1
      default: 30
    - id: deploy_timeout_seconds
      label: Per-instance deploy timeout (secs)
      type: number
      description: Maximum time allowed for the SSM deploy script on each instance, for both container and manual deploys.
      collapsible: true
      max: 14400
      min: 60
      default: 1200
    - id: ecr_force_deletion_enabled
      label: Force delete image repository
      type: boolean
      description: Allow the Ravion-created ECR repository for Dockerfile or Railpack builds to be deleted while it still contains images. Use with care.
      collapsible: true
      show_when:
        deploy_type: container
        build_source:
          - dockerfile
          - railpack
      default: false
    - $include: ../../partials/inputs/tags.yml
    - $include: ../../partials/inputs/terraform-settings.yml
  stack:
    $template: ../../partials/templates/opentofu-stack.yml
    with:
      base_path: compute/ec2_service
      terraform_variables:
        ...overrides: << module.input.advanced_terraform_variables >>
        additional_security_group_ids: << module.input.additional_security_group_ids || [] >>
        additional_user_data: << module.input.additional_user_data || "" >>
        ami_id: << module.input.ami_id || nil >>
        app_port: '<< module.input.web_service_enabled ? module.input.app_port : nil >>'
        cpu_target_tracking_enabled: << module.input.cpu_target_tracking_enabled >>
        cpu_target_value: << module.input.cpu_target_value >>
        data_volume_enabled: << module.input.data_volume_enabled >>
        data_volume_mount_path: << module.input.data_volume_mount_path >>
        data_volume_size: << module.input.data_volume_size >>
        deploy_timeout_seconds: << module.input.deploy_timeout_seconds >>
        desired_capacity: '<< module.input.cpu_target_tracking_enabled ? nil : (module.input.desired_capacity || nil) >>'
        ecr_force_deletion_enabled: << module.input.ecr_force_deletion_enabled >>
        ecr_repository_creation_enabled: '<< module.input.build_source == "dockerfile" || module.input.build_source == "railpack" >>'
        efs_access_point_id: '<< module.input.efs_enabled ? (module.input.efs_access_point_id || nil) : nil >>'
        efs_client_security_group_id: '<< module.input.efs_enabled ? module.input.efs_client_security_group_id : nil >>'
        efs_enabled: << module.input.efs_enabled >>
        efs_file_system_id: '<< module.input.efs_enabled ? module.input.efs_file_system_id : nil >>'
        efs_mount_path: << module.input.efs_mount_path >>
        environment_variables: << module.input.environment_variables || [] >>
        health_check_path: '<< module.input.web_service_enabled ? module.input.health_check_path : nil >>'
        instance_type: << module.input.instance_type >>
        key_name: << module.input.key_name || nil >>
        load_balancer_attachment:
          $template: ../../partials/templates/alb-load-balancer-attachment.yml
          with:
            additional_fields: {}
            enabled: << module.input.web_service_enabled >>
            listener_arn: >-
              << !module.input.web_service_enabled ? "" :
              module.input.load_balancer_source == "standalone_alb" ?
              (module.input.alb_https_listener_arn || module.input.alb_http_listener_arn) :
              module.input.ecs_cluster_alb_visibility == "public" ?
              (module.input.public_alb_https_listener_arn || module.input.public_alb_http_listener_arn) :
              (module.input.private_alb_https_listener_arn || module.input.private_alb_http_listener_arn) >>
            target_group:
              port: << module.input.app_port >>
              deregistration_delay: << module.input.deregistration_delay >>
              health_check:
                enabled: true
                path: << module.input.health_check_path >>
                matcher: << module.input.health_check_matcher >>
                interval: << module.input.health_check_interval >>
                timeout: << module.input.health_check_timeout >>
                healthy_threshold: << module.input.healthy_threshold >>
                unhealthy_threshold: << module.input.unhealthy_threshold >>
              stickiness: >-
                << module.input.target_group_stickiness_enabled ? {
                  "enabled": true,
                  "type": "lb_cookie",
                  "cookie_duration": module.input.target_group_stickiness_cookie_duration
                } : nil >>
        load_balancer_security_group_id: >-
          << !module.input.web_service_enabled ? nil :
          module.input.load_balancer_source == "standalone_alb" ? module.input.alb_security_group_id :
          module.input.ecs_cluster_alb_visibility == "public" ? module.input.public_alb_security_group_id :
          module.input.private_alb_security_group_id >>
        log_retention_in_days: << module.input.log_retention_in_days >>
        manual_start_command: '<< module.input.deploy_type == "manual" ? module.input.start_command : nil >>'
        max_size: << module.input.max_size >>
        min_size: << module.input.min_size >>
        name: << module.input.name >>
        region: << module.input.aws_region >>
        root_volume_size: << module.input.root_volume_size >>
        runtime: << module.input.deploy_type >>
        secrets: << module.input.secrets || [] >>
        start_command: '<< module.input.deploy_type == "container" ? (module.input.container_start_command || nil) : nil >>'
        subnet_ids: '<< module.input.private_subnet_placement_enabled ? module.input.private_subnet_ids : module.input.public_subnet_ids >>'
        associate_public_ip_address: '<< module.input.private_subnet_placement_enabled ? false : true >>'
        tags:
          $include: ../../partials/stack/ravion-tags.yml
        vpc_id: << module.input.vpc_id >>
  build:
    $merge: ../../partials/build/ecs-service-image-build.yml
    type: '<< module.input.deploy_type == "manual" || module.input.build_source == "image_registry" ? "disabled" : "image" >>'
  deploy:
    type: aws:ec2
    concurrency:
      queue_overflow: oldest
      queue_size: 1
    timeout: 1800
    inputs:
      - id: image_ref
        label: Image tag or digest
        type: string
        description: Image tag or digest to deploy. For Dockerfile or Railpack builds, this is resolved in the Ravion-created ECR repository. For Pull from image registry mode, this is resolved in the repository configured on the module.
        placeholder: sha256:... or latest or <run-id>-railpack
        patterns:
          - message: Image tags and digests must not contain whitespace.
            pattern: ^\S+$
        required: true
        show_when:
          deploy_type: container
      - id: branch
        label: Git branch
        type: string
        description: Branch to deploy. Defaults to the repository's default branch.
        required: false
        show_when:
          deploy_type: manual
      - id: ref
        label: Git ref (commit or tag)
        type: string
        description: Optional commit SHA, tag, or ref to deploy. Defaults to the selected branch head.
        required: false
        show_when:
          deploy_type: manual
    source: >-
      << module.input.deploy_type == "manual" && module.input.deploy_source_repo ? {
        "type": "git",
        "repo": module.input.deploy_source_repo,
        "branch": deploy.input.branch,
        "ref": deploy.input.ref,
        "base_path": module.input.deploy_source_base_path || "."
      } : nil >>
    definition: >-
      << module.input.deploy_type == "container" ? {"runtime": "container", "image_uri":
      (module.input.build_source == "image_registry" ? (deploy.input.image_ref contains "sha256:" ?
      module.input.image_repository + "@" + deploy.input.image_ref : module.input.image_repository +
      ":" + deploy.input.image_ref) : (deploy.input.image_ref contains "sha256:" ?
      stack.output.ecr_repository_url + "@" + deploy.input.image_ref : stack.output.ecr_repository_url
      + ":" + deploy.input.image_ref))} : {"runtime": "manual", "commands":
      module.input.deploy_commands} >>
    infrastructure:
      autoscaling_group_name: << stack.output.autoscaling_group_name >>
      aws_account_id: << module.input.aws_account_id >>
      log_group_name: << stack.output.log_group_name >>
      region: << stack.output.region >>
      target_group_arn: << stack.output.target_group_arn >>
  ui:
    logs:
      - id: app_logs
        name: App logs
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << stack.output.region >>
          log_group: << stack.output.log_group_name >>
          log_stream_prefix: << stack.output.log_stream_prefix >>
    metrics:
      - id: cpu_utilization
        name: CPU utilization
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            AutoScalingGroupName: << stack.output.autoscaling_group_name >>
          name: CPUUtilization
          namespace: AWS/EC2
          region: << stack.output.region >>
          statistic: Average
      - id: in_service_instances
        name: In-service instances
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
