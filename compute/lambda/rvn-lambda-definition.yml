definition:
  type: rvn-lambda
  name: Lambda Function
  description: AWS Lambda function with zip or container image deployments, alias-based releases, IAM, logs, and optional function URLs.
release:
  version: 0.1.0
  description: Add Lambda functions with hardened bootstrap images and managed ECR for built images.
module:
  inputs:
    - $include: ../../partials/inputs/aws-account.yml
    - $include: ../../partials/inputs/aws-region.yml
    - id: section_function
      label: Lambda function
      type: section
    - id: name
      immutable: true
      label: Function name
      type: string
      description: Name for the Lambda function and related resources.
      required: true
      default: <<project.given_id>>-<<environment.given_id>>-<<module.given_id>>
      patterns:
        - message: 1-64 letters, numbers, underscores, or hyphens.
          pattern: ^[A-Za-z0-9_-]{1,64}$
    - id: description
      label: Function description
      type: string
      description: Description shown for the Lambda function in AWS.
      collapsible: true
      required: false
    - id: package_type
      immutable: true
      label: Package type
      type: string
      description: AWS Lambda deployment package type. AWS does not support changing this after the function is created.
      required: true
      default: Zip
      values:
        - label: Zip package
          description: Build or deploy a .zip package from S3.
          value: Zip
        - label: Container image
          description: Deploy an existing container image from Amazon ECR.
          value: Image
    - id: handler
      label: Handler
      type: string
      description: Function entrypoint for the zip package, such as index.handler.
      required: true
      default: index.handler
      show_when:
        package_type: Zip
    - id: runtime
      label: Runtime
      type: string
      description: Lambda runtime for the zip package, such as nodejs20.x, python3.12, or provided.al2023.
      required: true
      default: nodejs20.x
      show_when:
        package_type: Zip
    - id: architecture
      label: Architecture
      type: string
      description: CPU architecture used by the function.
      required: true
      default: x86_64
      values:
        - label: x86_64
          value: x86_64
        - label: arm64
          value: arm64
    - id: memory_size
      label: Memory (MB)
      type: number
      description: Memory allocated to the function. Lambda CPU scales with memory.
      min: 128
      max: 10240
      required: true
      default: 128
    - id: timeout
      label: Timeout (secs)
      type: number
      description: Maximum runtime for a single invocation.
      min: 1
      max: 900
      required: true
      default: 3
    - id: ephemeral_storage_size
      label: Ephemeral storage (MB)
      type: number
      description: Size of the function's /tmp directory.
      collapsible: true
      min: 512
      max: 10240
      default: 512
    - id: reserved_concurrent_executions
      label: Reserved concurrency
      type: number
      description: Reserved concurrent executions for this function. Use -1 to remove limits.
      collapsible: true
      min: -1
      required: false
    - id: tracing_mode
      label: X-Ray tracing
      type: string
      description: Choose whether Lambda actively traces invocations with AWS X-Ray.
      collapsible: true
      default: PassThrough
      values:
        - label: Pass through
          value: PassThrough
        - label: Active
          value: Active
    - id: environment_variables
      label: Runtime environment variables
      type: keyvalue
      description: Environment variables passed to the Lambda function.
      collapsible: true
      default: {}
      required: false
    - id: layers
      label: Lambda layers
      type: string_array
      description: Versioned Lambda layer ARNs to attach to the function.
      collapsible: true
      add_button_label: Add layer
      default: []
      placeholder: arn:aws:lambda:us-east-1:123456789012:layer:example:1
      show_when:
        package_type: Zip
    - id: kms_key_arn
      label: Environment KMS key ARN
      type: string
      description: Optional customer-managed KMS key ARN used to encrypt environment variables.
      collapsible: true
      required: false
      placeholder: arn:aws:kms:us-east-1:123456789012:key/abc-123
    - id: code_signing_config_arn
      label: Code signing config ARN
      type: string
      description: Optional Lambda code signing configuration ARN.
      collapsible: true
      required: false
      show_when:
        package_type: Zip
    - id: section_build
      label: Build config
      type: section
    - id: build_type
      label: Build type
      type: string
      description: Choose how Ravion builds or resolves the Lambda deployment artifact.
      required: true
      default: nixpacks
      values:
        - label: Nixpacks
          description: Automatically build a zip package or Lambda container image based on your code and config.
          value: nixpacks
        - label: Dockerfile
          description: Use a Dockerfile to build a zip package or Lambda container image.
          value: dockerfile
        - label: Prebuilt image from ECR
          description: Container images only. Deploy tags or digests from an existing Amazon ECR repository.
          value: prebuilt_image
        - label: Disabled
          description: Skip the build step. Zip deploys use an S3 object key; image deploys use a full ECR image URI.
          value: none
    - $template: ../../partials/inputs/build-git-source.yml
      with:
        show_when:
          package_type:
            - Zip
            - Image
          build_type:
            - nixpacks
            - dockerfile
    - id: image_repository
      label: ECR image repository
      type: string
      description: Amazon ECR repository URI without a tag or digest, such as 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-function.
      placeholder: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-function
      required: true
      show_when:
        package_type: Image
        build_type: prebuilt_image
    - id: initial_image_ref
      label: Initial image tag or digest
      type: string
      description: Tag or digest from the configured ECR image repository used to create the Lambda function before the first deployment.
      placeholder: sha256:... or latest
      required: true
      show_when:
        package_type: Image
        build_type: prebuilt_image
    - id: initial_image_uri
      label: Initial image URI
      type: string
      description: Full Amazon ECR image URI used to create the Lambda function before the first deployment.
      placeholder: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-function:latest
      required: true
      show_when:
        package_type: Image
        build_type: none
    - id: output_directory
      label: Package output directory
      type: string
      description: Directory inside the built image that contains the Lambda package files.
      required: true
      default: /app
      show_when:
        package_type: Zip
        build_type:
          - nixpacks
          - dockerfile
    - $template: ../../partials/inputs/dockerfile-build.yml
      with:
        show_when:
          package_type:
            - Zip
            - Image
          build_type: dockerfile
    - $template: ../../partials/inputs/nixpacks-build.yml
      with:
        show_when:
          package_type:
            - Zip
            - Image
          build_type: nixpacks
    - id: nixpacks_start_cmd
      label: Start command
      type: string
      placeholder: Intelligent default based on your language & framework
      show_when:
        package_type: Image
        build_type: nixpacks
    - $merge:
        - ../../partials/inputs/build-environment-variables.yml
      show_when:
        package_type:
          - Zip
          - Image
        build_type:
          - nixpacks
          - dockerfile
    - $merge:
        - ../../partials/inputs/dockerfile-env-injection.yml
      show_when:
        package_type:
          - Zip
          - Image
        build_type: dockerfile
    - id: section_builder_config
      label: Builder config
      show_when:
        package_type:
          - Zip
          - Image
        build_type:
          - nixpacks
          - dockerfile
      type: section
    - default: ec2
      description: Use EC2 for quick start or EC2 spot for cheaper, but potentially delayed builds.
      id: build_infrastructure_type
      label: Builder instance type
      required: true
      show_when:
        package_type:
          - Zip
          - Image
        build_type:
          - nixpacks
          - dockerfile
      type: string
      values:
        - label: EC2
          value: ec2
        - label: EC2 spot
          value: ec2-spot
    - default: c7a.4xlarge
      description: EC2 instance type for builds. Start with the default value, then increase or decrease it based on the resource usage report at the end of builds.
      id: build_instance_size
      label: Builder instance size
      no_options_message: Select an AWS account and region to load available EC2 instance types.
      required: true
      show_when:
        package_type:
          - Zip
          - Image
        build_type:
          - nixpacks
          - dockerfile
      type: string
      values: $values:aws/ec2/instances?awsAccountId=<<module.input.aws_account_id>>&region=<<module.input.aws_region>>&costUnit=minute
    - collapsible: true
      description: Optional execution environment ID or given ID for builds. Defaults to the module Terraform execution environment.
      id: build_execution_environment_id
      label: Builder execution environment
      required: false
      show_when:
        package_type:
          - Zip
          - Image
        build_type:
          - nixpacks
          - dockerfile
      type: string
      values: $values:ravion/execution_environments
    - collapsible: true
      description: Optional AMI ID for build runners. Leave empty to use the default runner image.
      id: build_ami
      label: Builder AMI
      required: false
      show_when:
        package_type:
          - Zip
          - Image
        build_type:
          - nixpacks
          - dockerfile
      type: string
    - id: section_advanced_build_options
      label: Advanced build options
      type: section
      show_when:
        package_type: Image
    - id: ecr_scan_on_push_enabled
      label: Scan images on push
      type: boolean
      description: Ask ECR to run its basic vulnerability scan whenever a new image is pushed.
      collapsible: true
      default: true
      show_when:
        package_type: Image
        build_type:
          - nixpacks
          - dockerfile
    - id: ecr_force_deletion_enabled
      label: Force delete image repository
      type: boolean
      description: Allow the generated ECR repository to be deleted even when it contains images. Use with care.
      collapsible: true
      default: false
      show_when:
        package_type: Image
        build_type:
          - nixpacks
          - dockerfile
    - id: ecr_default_lifecycle_policy_enabled
      label: Default lifecycle policy
      type: boolean
      description: Apply the built-in ECR lifecycle policy for untagged and older tagged images.
      collapsible: true
      default: false
      show_when:
        package_type: Image
        build_type:
          - nixpacks
          - dockerfile
    - id: image_command
      label: Image command
      type: string_array
      description: Optional Lambda image command override.
      collapsible: true
      add_button_label: Add command segment
      default: []
      show_when:
        package_type: Image
    - id: image_entry_point
      label: Image entry point
      type: string_array
      description: Optional Lambda image entry point override.
      collapsible: true
      add_button_label: Add entry point segment
      default: []
      show_when:
        package_type: Image
    - id: image_working_directory
      label: Image working directory
      type: string
      description: Optional Lambda image working directory override.
      collapsible: true
      required: false
      show_when:
        package_type: Image
    - id: section_networking
      label: Private networking
      type: section
    - id: vpc_config_enabled
      label: Connect to private VPC
      type: boolean
      description: Attach the function to private subnets from a VPC network and selected security groups.
      default: false
    - id: network
      immutable: true
      label: Private VPC network
      description: VPC network whose private subnets are used by the Lambda function.
      required: true
      show_when:
        vpc_config_enabled: true
      type: $ref:rvn-aws-network
    - add_button_label: Add private subnet ID
      description: Private subnets where Lambda creates network interfaces.
      id: subnet_ids
      immutable: true
      label: Private subnet IDs
      required: true
      show_when:
        vpc_config_enabled: true
      type: string_array
    - id: security_group_ids
      label: Security group IDs
      type: string_array
      description: Security groups attached to the Lambda network interfaces.
      add_button_label: Add security group
      required: true
      show_when:
        vpc_config_enabled: true
    - id: ipv6_allowed_for_dual_stack
      label: Allow outbound IPv6
      type: boolean
      description: Allow outbound IPv6 traffic when the selected subnets are dual stack.
      collapsible: true
      default: false
      show_when:
        vpc_config_enabled: true
    - id: section_iam
      label: IAM role
      type: section
    - id: role_creation_enabled
      label: Create IAM role
      type: boolean
      description: Create and manage the Lambda execution role in this module.
      default: true
    - id: role_arn
      label: Existing role ARN
      type: string
      description: IAM role ARN to use when this module should not create the role.
      required: true
      placeholder: arn:aws:iam::123456789012:role/my-lambda-role
      show_when:
        role_creation_enabled: false
    - id: role_permissions_boundary
      label: Permissions boundary ARN
      type: string
      description: Optional IAM permissions boundary for the created role.
      collapsible: true
      required: false
      show_when:
        role_creation_enabled: true
    - id: role_managed_policy_arns
      label: Managed policy ARNs
      type: string_array
      description: Additional managed policies to attach to the created role.
      collapsible: true
      add_button_label: Add policy ARN
      default: []
      show_when:
        role_creation_enabled: true
    - id: role_inline_policies
      label: Inline role policies
      type: object
      description: Map of inline policy name to JSON policy document for the created role.
      collapsible: true
      default: {}
      required: false
      show_when:
        role_creation_enabled: true
    - id: section_logs
      label: Logs
      type: section
    - id: log_group_creation_enabled
      label: Create log group
      type: boolean
      description: Create and manage the CloudWatch log group for this function.
      default: true
    - id: log_group_name
      label: Log group name
      type: string
      description: Custom CloudWatch log group name. Defaults to /aws/lambda/{function name}.
      collapsible: true
      required: false
      show_when:
        log_group_creation_enabled: true
    - id: log_retention_days
      label: Log retention days
      type: number
      description: Days to retain CloudWatch logs. Use 0 to retain indefinitely.
      collapsible: true
      default: 30
      min: 0
      show_when:
        log_group_creation_enabled: true
    - id: log_kms_key_id
      label: Log KMS key ID
      type: string
      description: Optional KMS key ID or ARN for log group encryption.
      collapsible: true
      required: false
      show_when:
        log_group_creation_enabled: true
    - id: section_function_url
      label: Function URL
      type: section
    - id: function_url_enabled
      label: Enable function URL
      type: boolean
      description: Create an HTTPS endpoint for the function.
      default: false
    - id: function_url_auth_type
      label: Authorization type
      type: string
      description: Choose whether the function URL requires AWS IAM authorization.
      required: true
      default: AWS_IAM
      show_when:
        function_url_enabled: true
      values:
        - label: AWS IAM
          value: AWS_IAM
        - label: None
          value: NONE
    - id: function_url_invoke_mode
      label: Invoke mode
      type: string
      description: Choose buffered responses or response streaming.
      collapsible: true
      default: BUFFERED
      show_when:
        function_url_enabled: true
      values:
        - label: Buffered
          value: BUFFERED
        - label: Response stream
          value: RESPONSE_STREAM
    - id: function_url_cors
      label: CORS config
      type: object
      description: Optional Lambda function URL CORS configuration.
      collapsible: true
      required: false
      show_when:
        function_url_enabled: true
    - id: section_integrations
      label: Integrations
      type: section
    - id: dead_letter_target_arn
      label: Dead-letter target ARN
      type: string
      description: Optional SQS queue or SNS topic ARN for asynchronous invocation failures.
      collapsible: true
      required: false
    - id: permissions
      label: Invoke permissions
      type: object_array
      description: Permission statements for services or accounts that invoke this function.
      collapsible: true
      item_label: Permission
      item_title:
        template: "{principal}"
      item_inputs:
        - id: principal
          label: Principal
          type: string
          description: Service principal or AWS account allowed to invoke the function.
          required: true
          placeholder: apigateway.amazonaws.com
        - id: source_arn
          label: Source ARN
          type: string
          description: Optional source ARN that scopes the invoke permission.
          required: false
        - id: source_account
          label: Source account
          type: string
          description: Optional source AWS account ID.
          required: false
        - id: qualifier
          label: Qualifier
          type: string
          description: Optional function version or alias qualifier.
          required: false
      default: []
    - id: event_source_mappings
      label: Event source mappings
      type: object_array
      description: Event sources such as SQS, DynamoDB streams, or Kinesis streams that invoke this function.
      collapsible: true
      item_label: Event source
      item_title:
        template: "{event_source_arn}"
      item_inputs:
        - id: event_source_arn
          label: Event source ARN
          type: string
          description: ARN of the stream or queue that invokes this function.
          required: true
        - id: enabled
          label: Enabled
          type: boolean
          default: true
        - id: batch_size
          label: Batch size
          type: number
          required: false
          min: 1
        - id: maximum_batching_window_in_seconds
          label: Maximum batching window (secs)
          type: number
          required: false
          min: 0
        - id: starting_position
          label: Starting position
          type: string
          required: false
          values:
            - label: Latest
              value: LATEST
            - label: Trim horizon
              value: TRIM_HORIZON
            - label: At timestamp
              value: AT_TIMESTAMP
      default: []
    - id: file_system_configs
      label: File systems
      type: object_array
      description: EFS access points mounted into the function.
      collapsible: true
      item_label: File system
      item_title:
        template: "{local_mount_path}"
      item_inputs:
        - id: arn
          label: EFS access point ARN
          type: string
          required: true
        - id: local_mount_path
          label: Local mount path
          type: string
          description: Mount path inside the function. AWS requires paths under /mnt/.
          required: true
          placeholder: /mnt/shared
      default: []
    - id: section_advanced_lambda
      label: Advanced Lambda settings
      type: section
      show_when:
        package_type: Zip
    - id: snap_start_apply_on
      label: SnapStart
      type: string
      description: Enable Lambda SnapStart for published versions. AWS currently supports this for Java runtimes.
      collapsible: true
      required: false
      show_when:
        package_type: Zip
      values:
        - label: Published versions
          value: PublishedVersions
    - id: lambda_at_edge_enabled
      label: Lambda@Edge constraints
      type: boolean
      description: Validate settings against Lambda@Edge constraints.
      collapsible: true
      default: false
      show_when:
        package_type: Zip
    - id: code_bucket_name
      immutable: true
      label: Code bucket name
      type: string
      description: S3 bucket used for Lambda zip artifacts. Must be globally unique.
      collapsible: true
      required: false
      show_when:
        package_type: Zip
      patterns:
        - message: "Use a valid S3 bucket name: lowercase letters, numbers, hyphens, and periods; start and end with a letter or number."
          pattern: ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
    - id: code_bucket_force_destroy_enabled
      label: Force destroy code bucket
      type: boolean
      description: Delete the code bucket even when it contains package objects during stack destroy.
      collapsible: true
      default: false
      show_when:
        package_type: Zip
    - $include: ../../partials/inputs/terraform-settings.yml
    - $include: ../../partials/inputs/execution-environment.yml
    - $merge:
        - ../../partials/inputs/tags.yml
      collapsible: true
  stack:
    type: opentofu
    ravion_state_backend_workspace: >-
      << module.input.ravion_state_backend_workspace || project.given_id + "-" + environment.given_id + "-"
      + module.given_id + "-" + stack.id>>
    pipelines:
      defaults:
        input:
          aws_account_id: "<< module.input.execution_environment_id ? null : module.input.aws_account_id >>"
          aws_region: "<< module.input.execution_environment_id ? null : module.input.aws_region >>"
          base_path: compute/lambda
          branch: main
          execution_environment_id: << module.input.execution_environment_id >>
          ref: $local.module_tag
          repo: https://github.com/flightcontrolhq/modules
          stack_id: <<stack.id>>
          terraform_variables:
            ...overrides: << module.input.advanced_terraform_variables >>
            aliases:
              live:
                description: Active Ravion deployment alias.
            architectures:
              - << module.input.architecture >>
            code_bucket_force_destroy_enabled: >-
              << module.input.package_type == "Zip" ? module.input.code_bucket_force_destroy_enabled : false >>
            code_bucket_name: >-
              << module.input.package_type == "Zip" ? (module.input.code_bucket_name || nil) : nil >>
            code_signing_config_arn: >-
              << module.input.package_type == "Zip" ? (module.input.code_signing_config_arn || nil) : nil >>
            dead_letter_target_arn: << module.input.dead_letter_target_arn || nil >>
            description: << module.input.description || nil >>
            ecr_default_lifecycle_policy_enabled: >-
              << module.input.package_type == "Image" && (module.input.build_type == "nixpacks" ||
              module.input.build_type == "dockerfile") ? module.input.ecr_default_lifecycle_policy_enabled : false >>
            ecr_force_deletion_enabled: >-
              << module.input.package_type == "Image" && (module.input.build_type == "nixpacks" ||
              module.input.build_type == "dockerfile") ? module.input.ecr_force_deletion_enabled : false >>
            ecr_repository_creation_enabled: >-
              << module.input.package_type == "Image" && (module.input.build_type == "nixpacks" ||
              module.input.build_type == "dockerfile") >>
            ecr_scan_on_push_enabled: >-
              << module.input.package_type == "Image" && (module.input.build_type == "nixpacks" ||
              module.input.build_type == "dockerfile") ? module.input.ecr_scan_on_push_enabled : true >>
            environment_variables: << module.input.environment_variables >>
            ephemeral_storage_size: << module.input.ephemeral_storage_size >>
            event_source_mappings: << module.input.event_source_mappings >>
            file_system_configs: << module.input.file_system_configs >>
            function_url_auth_type: << module.input.function_url_auth_type >>
            function_url_cors: << module.input.function_url_cors || nil >>
            function_url_enabled: << module.input.function_url_enabled >>
            function_url_invoke_mode: << module.input.function_url_invoke_mode >>
            handler: >-
              << module.input.package_type == "Zip" ? module.input.handler : nil >>
            image_config: >-
              << module.input.package_type == "Image" && (len(module.input.image_command) > 0 ||
              len(module.input.image_entry_point) > 0 || module.input.image_working_directory) ? {command:
              (len(module.input.image_command) > 0 ? module.input.image_command : nil), entry_point:
              (len(module.input.image_entry_point) > 0 ? module.input.image_entry_point : nil),
              working_directory: (module.input.image_working_directory || nil)} : nil >>
            image_uri: >-
              << module.input.package_type == "Image" ? (module.input.build_type == "prebuilt_image" ?
              (module.input.initial_image_ref contains "sha256:" ? module.input.image_repository + "@" +
              module.input.initial_image_ref : module.input.image_repository + ":" +
              module.input.initial_image_ref) : module.input.build_type == "none" ?
              module.input.initial_image_uri : nil) : nil >>
            kms_key_arn: << module.input.kms_key_arn || nil >>
            lambda_at_edge_enabled: >-
              << module.input.package_type == "Zip" ? module.input.lambda_at_edge_enabled : false >>
            layers: >-
              << module.input.package_type == "Zip" ? module.input.layers : [] >>
            log_group_creation_enabled: << module.input.log_group_creation_enabled >>
            log_group_name: << module.input.log_group_name || nil >>
            log_kms_key_id: << module.input.log_kms_key_id || nil >>
            log_retention_days: << module.input.log_retention_days >>
            memory_size: << module.input.memory_size >>
            name: << module.input.name >>
            package_type: << module.input.package_type >>
            permissions: << module.input.permissions >>
            region: << module.input.aws_region >>
            reserved_concurrent_executions: << module.input.reserved_concurrent_executions >>
            role_arn: << module.input.role_arn || nil >>
            role_creation_enabled: << module.input.role_creation_enabled >>
            role_inline_policies: << module.input.role_inline_policies >>
            role_managed_policy_arns: << module.input.role_managed_policy_arns >>
            role_permissions_boundary: << module.input.role_permissions_boundary || nil >>
            runtime: >-
              << module.input.package_type == "Zip" ? module.input.runtime : nil >>
            snap_start_apply_on: >-
              << module.input.package_type == "Zip" ? (module.input.snap_start_apply_on || nil) : nil >>
            tags:
              $include: ../../partials/stack/ravion-tags.yml
            timeout: << module.input.timeout >>
            tracing_mode: << module.input.tracing_mode >>
            version_publishing_enabled: true
            vpc_config: >-
              << module.input.vpc_config_enabled ? {subnet_ids: module.input.subnet_ids, security_group_ids:
              module.input.security_group_ids, ipv6_allowed_for_dual_stack:
              module.input.ipv6_allowed_for_dual_stack} : nil >>
            vpc_execution_policy_enabled: << module.input.vpc_config_enabled >>
          tool: opentofu
          tool_version: << module.input.opentofu_version || defaults.opentofu_version >>
        variant: standard
      change:
        pipeline_id: << defaults.change_pipeline_id >>
      destroy:
        pipeline_id: << defaults.destroy_pipeline_id >>
  build:
    type: >-
      << module.input.package_type == "Image" ? ((module.input.build_type == "nixpacks" ||
      module.input.build_type == "dockerfile") ? "image" : "disabled") : (module.input.build_type
      == "none" || module.input.build_type == "prebuilt_image" ? "disabled" : "lambda") >>
    timeout: 1800
    inputs:
      - $include: ../../partials/inputs/build-inputs.yml
    source:
      $include: ../../partials/build/git-source.yml
    builder: >-
      << module.input.package_type == "Image" && module.input.build_type == "dockerfile" ? {type:
      "dockerfile", dockerfile: module.input.dockerfile || "Dockerfile", context:
      module.input.dockerfile_context || ".", inject_env_variables_in_dockerfile:
      module.input.dockerfile_inject_env_variables, cache_from: {tag: "dockerfile"}} :
      module.input.package_type == "Image" && module.input.build_type == "nixpacks" ? {type:
      "nixpacks", install_cmd: module.input.nixpacks_install_cmd, build_cmd:
      module.input.nixpacks_build_cmd, start_cmd: module.input.nixpacks_start_cmd, config_file_path:
      module.input.nixpacks_config_file_path, build_path: module.input.nixpacks_build_path,
      nixpacks_version: module.input.nixpacks_version, nix_pkgs: module.input.nixpacks_nix_pkgs,
      apt_pkgs: module.input.nixpacks_apt_pkgs, nix_libs: module.input.nixpacks_nix_libs,
      cache_from: {tag: "nixpacks"}} : module.input.build_type == "dockerfile" ? {type:
      "dockerfile", dockerfile: module.input.dockerfile || "Dockerfile", context:
      module.input.dockerfile_context || ".", inject_env_variables_in_dockerfile:
      module.input.dockerfile_inject_env_variables, output_directory: module.input.output_directory} :
      module.input.build_type == "nixpacks" ? {type: "nixpacks", install_cmd:
      module.input.nixpacks_install_cmd, build_cmd: module.input.nixpacks_build_cmd,
      config_file_path: module.input.nixpacks_config_file_path, build_path:
      module.input.nixpacks_build_path, nixpacks_version: module.input.nixpacks_version, nix_pkgs:
      module.input.nixpacks_nix_pkgs, apt_pkgs: module.input.nixpacks_apt_pkgs, nix_libs:
      module.input.nixpacks_nix_libs, output_directory: module.input.output_directory} : {type:
      "disabled"} >>
    environment_variables: << module.input.build_environment_variables >>
    destinations: >-
      << module.input.package_type == "Image" ? [{id: "ecr", type: "ecr", repository_arn:
      stack.output.ecr_repository_arn, tags: [pipeline.run.id + "-" + module.input.build_type,
      module.input.build_type]}] : [{id: "lambda-package", type: "s3", bucket:
      stack.output.code_bucket_id, key: module.given_id, region: stack.output.region}] >>
    infrastructure:
      ami: << module.input.build_ami || nil >>
      aws_account_id: "<< module.input.build_execution_environment_id || module.input.execution_environment_id ? nil : module.input.aws_account_id >>"
      execution_environment_id: << module.input.build_execution_environment_id || module.input.execution_environment_id >>
      instance_size: << module.input.build_instance_size >>
      region: "<< module.input.build_execution_environment_id || module.input.execution_environment_id ? nil : module.input.aws_region >>"
      type: << module.input.build_infrastructure_type >>
  deploy:
    type: aws:lambda
    timeout: 1800
    inputs:
      - id: s3_key
        label: S3 object key
        type: string
        description: S3 key for the Lambda zip package to deploy.
        required: true
        show_when:
          package_type: Zip
      - id: s3_object_version
        label: S3 object version
        type: string
        description: Optional S3 object version for versioned artifact buckets.
        required: false
        show_when:
          package_type: Zip
      - id: image_uri
        label: Container image URI
        type: string
        description: Full Amazon ECR image URI to deploy when the build step is disabled.
        required: true
        placeholder: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-function:latest
        show_when:
          package_type: Image
          build_type: none
      - id: image_ref
        label: Image tag or digest
        type: string
        description: Pass the image tag or digest to deploy. For Nixpacks or Dockerfile builds, this is resolved in the Ravion-created ECR repository. For Prebuilt image from ECR mode, this is resolved in the repository configured on the module. Do not pass a full image URI.
        placeholder: sha256:... or latest or <run-id>-nixpacks
        required: true
        show_when:
          package_type: Image
          build_type:
            - nixpacks
            - dockerfile
            - prebuilt_image
    infrastructure:
      function_arn: << stack.output.function_arn >>
      region: << stack.output.region >>
      alias_name: live
      s3_artifact_bucket: >-
        << module.input.package_type == "Zip" ? stack.output.code_bucket_id : nil >>
    definition: >-
      << module.input.package_type == "Image" ? {package_type: "image", image_uri:
      (module.input.build_type == "prebuilt_image" ? (deploy.input.image_ref contains "sha256:" ?
      module.input.image_repository + "@" + deploy.input.image_ref : module.input.image_repository +
      ":" + deploy.input.image_ref) : module.input.build_type == "none" ? deploy.input.image_uri :
      (deploy.input.image_ref contains "sha256:" ? stack.output.ecr_repository_url + "@" +
      deploy.input.image_ref : stack.output.ecr_repository_url + ":" + deploy.input.image_ref))} :
      {package_type: "zip", s3_key: deploy.input.s3_key, s3_object_version:
      (deploy.input.s3_object_version || nil)} >>
  ui:
    metrics:
      - id: invocations
        name: Invocations
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            FunctionName: << stack.output.function_name >>
          name: Invocations
          namespace: AWS/Lambda
          region: << stack.output.region >>
          statistic: Sum
      - id: errors
        name: Errors
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            FunctionName: << stack.output.function_name >>
          name: Errors
          namespace: AWS/Lambda
          region: << stack.output.region >>
          statistic: Sum
      - id: duration
        name: Duration
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            FunctionName: << stack.output.function_name >>
          name: Duration
          namespace: AWS/Lambda
          region: << stack.output.region >>
          statistic: Average
      - id: throttles
        name: Throttles
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            FunctionName: << stack.output.function_name >>
          name: Throttles
          namespace: AWS/Lambda
          region: << stack.output.region >>
          statistic: Sum
      - id: concurrent_executions
        name: Concurrent executions
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            FunctionName: << stack.output.function_name >>
          name: ConcurrentExecutions
          namespace: AWS/Lambda
          region: << stack.output.region >>
          statistic: Average
  readme: |
    AWS Lambda function with zip or container image deployments, alias-based releases, IAM, logs, and optional function URLs.

    ## Overview

    The Lambda Function module creates an AWS Lambda function, execution role, CloudWatch log group, optional artifact bucket, and a live alias that Ravion updates during deployments. Terraform provisions the long-lived function infrastructure with either a bootstrap zip package or a sample container image. Deployments publish a new function version and move the live alias.

    Terraform source: [flightcontrolhq/modules/compute/lambda](https://github.com/flightcontrolhq/modules/tree/$local.module_tag/compute/lambda)

    ## Use cases

    | Scenario | Lambda Function helps by... |
    | -------- | --------------------------- |
    | Event handlers | Running code from queues, streams, schedules, or custom invoke permissions |
    | Lightweight APIs | Exposing a function URL when API Gateway is not required |
    | Background tasks | Running short-lived compute without managing servers or containers |
    | Zip deployments | Building a package from Git and promoting it through a stable alias |
    | Container image deployments | Building or deploying Lambda-compatible images from Amazon ECR |

    ## Build and deployment

    Package type is immutable after creation because AWS Lambda does not support changing an existing function between zip packages and container images.

    For zip package functions, builds use Nixpacks or a Dockerfile to produce Lambda package contents from the selected Git repository. The build uploads a zip file to the module-managed code bucket. Deployments take an S3 object key, update the Lambda function code, publish a new version, and move the live alias to that version.

    If Build type is Disabled for zip packages, Ravion skips the build step and you provide an existing S3 object key at deploy time.

    For container image functions, Nixpacks and Dockerfile builds produce a Lambda-compatible container image, push it to a module-managed ECR repository, and deployments promote a tag or digest from that repository. Prebuilt image mode uses an existing ECR repository, asks for an initial tag or digest when the function is created, and asks for the tag or digest to promote at deploy time. Disabled mode skips the build step, asks for an initial full ECR image URI when the function is created, and asks for a full ECR image URI at deploy time.

    Terraform creates built-image functions by pushing a small Lambda-compatible bootstrap image into the module-managed ECR repository during the same apply. External-image modes create the function from the initial image you provide, so no module-managed ECR repository is created.

    ## Function configuration

    Runtime, handler, memory, timeout, architecture, environment variables, layers, tracing, image config, and ephemeral storage are managed by the stack. Handler, runtime, layers, code signing, SnapStart, Lambda@Edge constraints, and the code bucket apply only to zip package functions. Change these settings through a stack change so Terraform remains the source of truth for function configuration. The deploy step focuses on code promotion.

    ## Networking and integrations

    Connect to a VPC when the function needs private subnet access to databases, caches, or internal services. Invoke permissions let AWS services or accounts call the function. Event source mappings connect queues and streams directly to the function. File systems mount EFS access points under /mnt paths.

    ## Configuration

    | Section | Field | Required | Default | Notes |
    | ------- | ----- | -------- | ------- | ----- |
    | AWS account & region | AWS account | Yes | none | Account where Lambda resources are created |
    | AWS account & region | Region | Yes | none | Region for the Lambda function and code bucket |
    | Lambda function | Function name | Yes | Generated from project, environment, and module IDs | Immutable AWS function name |
    | Lambda function | Package type | Yes | Zip package | Immutable AWS package type |
    | Lambda function | Handler | Zip only | index.handler | Zip package entrypoint |
    | Lambda function | Runtime | Zip only | nodejs20.x | Lambda runtime string |
    | Lambda function | Memory | Yes | 128 MB | Also affects CPU allocation |
    | Lambda function | Timeout | Yes | 3 seconds | Maximum invocation runtime |
    | Build config | Build type | Yes | Nixpacks | Zip packages support Nixpacks, Dockerfile, or Disabled. Container images support Nixpacks, Dockerfile, Prebuilt image from ECR, or Disabled |
    | Build config | Git repository | Required for builds | none | Source repository for Nixpacks and Dockerfile builds |
    | Build config | ECR image repository | Prebuilt image only | none | Existing ECR repository URI without a tag or digest |
    | Build config | Initial image tag or digest | Prebuilt image only | none | Existing image used when the Lambda function is created |
    | Build config | Initial image URI | Disabled image builds only | none | Full image URI used when the Lambda function is created |
    | Build config | Package output directory | Required for zip builds | /app | Directory zipped and uploaded |
    | Networking | Connect to a VPC | No | false | Shows subnet and security group fields |
    | IAM role | Create IAM role | No | true | Use an existing role by turning this off |
    | Logs | Create log group | No | true | Creates /aws/lambda/{function name} by default |
    | Function URL | Enable function URL | No | false | Creates an HTTPS endpoint for direct invokes |
    | Integrations | Invoke permissions | No | [] | Allows services or accounts to invoke the function |
    | Integrations | Event source mappings | No | [] | Connects queues or streams to the function |
    | Terraform settings | Advanced Terraform variables | No | {} | Escape hatch for uncommon Terraform inputs |

    ## Design decisions

    - Package type is immutable. Create a new Lambda module/function to migrate between zip packages and container images.
    - Zip package functions use the Lambda build pipeline to upload zip packages to S3 and the Lambda deploy manager to promote those packages.
    - Container image functions use the image build pipeline to push Dockerfile or Nixpacks builds to ECR. Prebuilt image mode promotes tags or digests from an existing ECR repository.
    - Terraform creates a bootstrap zip package for zip functions and creates built-image functions with a bootstrap image in the module-managed ECR repository. External-image modes use the initial image you provide and do not create a module-managed ECR repository.
    - Runtime configuration stays in Terraform to avoid deploy-time configuration drift.
    - The zip code bucket is versioned, but the build output currently passes the S3 key as the primary deploy input.

    ## Learn more

    - [AWS Lambda developer guide](https://docs.aws.amazon.com/lambda/latest/dg/welcome.html)
    - [Configuring Lambda functions](https://docs.aws.amazon.com/lambda/latest/dg/configuration-function-common.html)
    - [Lambda function URLs](https://docs.aws.amazon.com/lambda/latest/dg/urls-configuration.html)
    - [Lambda event source mappings](https://docs.aws.amazon.com/lambda/latest/dg/invocation-eventsourcemapping.html)
