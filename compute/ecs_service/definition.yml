  readme: |
    Web server ECS service for running an HTTP application behind an ECS cluster load balancer.

    ## Overview

    The ECS Web Server module creates an ECS service for HTTP traffic in an existing Ravion ECS cluster. Select an ECS cluster, choose how the container image is built or supplied, configure routing and health checks, and Ravion provisions the service, target group, listener rule, IAM roles, security group, ECR repository when needed, and autoscaling settings.

    The module is intentionally focused on web services behind an Application Load Balancer. It uses the selected ECS cluster to inherit AWS account, region, VPC, subnets, capacity providers, load balancer listeners, and load balancer security groups.

    Terraform source: [flightcontrolhq/modules/compute/ecs_service](https://github.com/flightcontrolhq/modules/tree/84eb256921edf88126c5451608ce6f010d94842f/compute/ecs_service)

    ## Use cases

    | Scenario                         | ECS Web Server helps by...                                      |
    | -------------------------------- | --------------------------------------------------------------- |
    | Deploying a public web app       | Routing host or path traffic through the public cluster ALB      |
    | Hosting an internal HTTP service | Routing private traffic through the private cluster ALB          |
    | Building from source             | Creating images with Nixpacks or a Dockerfile and pushing to ECR |
    | Bringing an existing image       | Deploying a public or private registry image by tag or digest    |
    | Tuning production capacity       | Combining Fargate, Fargate Spot, or EC2 with autoscaling         |
    | Debugging running tasks          | Enabling ECS Exec when shell access is needed                    |

    ## Cluster and networking

    An ECS cluster is required. The cluster reference supplies the cluster ARN, VPC ID, public and private subnet IDs, load balancer listeners, load balancer security groups, capacity provider names, AWS account, region, and execution environment.

    Use Public web service when the service should be reachable through the public Application Load Balancer. Turn it off for internal services that should use the private Application Load Balancer.

    Use Run in private subnets for most production services. Private subnets keep tasks off the public internet and route outbound traffic through NAT or equivalent egress. Turning it off runs tasks in public subnets and assigns public IPs.

    ## Build and image options

    | Build type      | When to use it                                                    |
    | --------------- | ----------------------------------------------------------------- |
    | Nixpacks        | Let Ravion detect the app stack and build an image from source    |
    | Dockerfile      | Build from a Dockerfile in the selected repository                |
    | Container image | Deploy an existing image from Docker Hub, GHCR, ECR, or registry |
    | Disabled        | Build outside Ravion and provide a full image URI at deploy time  |

    For Nixpacks and Dockerfile builds, provide Git repository, Git branch, and optionally Source base path. Ravion pushes built images to the service ECR repository and deploys by image digest.

    For Container image, provide Image repository without the tag. At deploy time, provide the tag to use. Use AWS public Docker Hub mirror is only for Docker Official Images such as nginx or node; leave it off for full repository paths, GHCR, ECR, or Docker Hub organization images. Use Registry credentials secret ARN for private registries that require ECS repository credentials.

    ## Routing and health checks

    The service always attaches to an Application Load Balancer target group. Route traffic with Domain host rules, Path rules, or both.

    If both host and path rules are empty, Ravion creates a default /* path rule so the listener rule has a valid condition. Use Listener rule priority only when you need a specific ALB rule order; otherwise AWS assigns the next available priority.

    Health check settings control when the load balancer considers tasks healthy:

    | Field                            | Default | Description                                                    |
    | -------------------------------- | ------- | -------------------------------------------------------------- |
    | Container port                   | 80      | Port the container listens on; PORT is added automatically     |
    | Health check path                | /       | Lightweight HTTP endpoint the load balancer checks             |
    | Success codes                    | 200-399 | Status codes treated as healthy                                |
    | Interval (secs)                  | 5       | Seconds between checks                                         |
    | Timeout (secs)                   | 4       | Seconds to wait for a response                                 |
    | Healthy threshold                | 2       | Successful checks needed to mark a target healthy              |
    | Unhealthy threshold              | 2       | Failed checks needed to mark a target unhealthy                |
    | Health check grace period (secs) | 0       | Startup window where ECS ignores load balancer health failures |

    Increase the grace period for apps with slow boot times. Keep health check endpoints lightweight and unauthenticated.

    ## Capacity and runtime

    Choose one primary Capacity provider:

    | Capacity provider | Best for                                                       |
    | ----------------- | -------------------------------------------------------------- |
    | Fargate           | Simple serverless containers and predictable web services      |
    | Fargate spot      | Lower-cost services that can tolerate task interruption        |
    | EC2               | Workloads that need cluster EC2 capacity or host-level control |

    You can add secondary providers with Also use Fargate, Also use Fargate spot, and Also use EC2. Mixed strategies can reduce cost or increase placement flexibility, but each enabled provider must exist on the selected cluster.

    For Fargate and Fargate Spot, App size defaults to 2 vCPU and 4 GB memory. For EC2 capacity, App vCPU defaults to 1.5 and App memory in GB defaults to 3.5; leave spare CPU and memory on each EC2 instance for the ECS agent and system processes.

    CPU architecture defaults to x86_64 for broad compatibility. Choose ARM64 only when the image and native dependencies support it.

    ## Autoscaling

    Autoscaling is enabled by default with one minimum task and three maximum tasks. For production, start with at least two minimum tasks when availability matters.

    | Field                    | Default | Description                                    |
    | ------------------------ | ------- | ---------------------------------------------- |
    | Autoscaling              | true    | Enables ECS service target tracking            |
    | Minimum tasks            | 1       | Lower bound for running tasks                  |
    | Maximum tasks            | 3       | Upper bound for running tasks                  |
    | CPU target (%)           | 70      | Average CPU utilization target                 |
    | Memory target (%)        | 80      | Average memory utilization target              |
    | Scale-in cooldown (secs) | 300     | Delay before another scale-in action           |
    | Scale-out cooldown (secs)| 300     | Delay before another scale-out action          |
    | Scale-in disabled        | false   | Prevents autoscaling from reducing task count  |

    ## Application configuration

    Use Runtime environment variables for plain container environment values. Ravion also sets PORT from Container port.

    Use Runtime secrets for sensitive values. Secrets are injected into the ECS task from SSM Parameter Store or Secrets Manager using name and value_from objects.

    Use Build environment variables for values needed during image builds. Values can be plain strings or references loaded from Parameter Store or Secrets Manager. For Dockerfile builds, enable Inject environment variables in Dockerfile to pass those values as Docker build arguments.

    ## Deployment

    Deployment type defaults to Rolling. Blue/green is available when you need separate target groups for CodeDeploy-style traffic shifting.

    Deployments update the ECS service task definition with the selected image, generated container definition, awslogs configuration, runtime platform, environment variables, secrets, and capacity-provider-compatible task settings.

    The deploy-time Image value depends on the build mode:

    | Build mode             | Deploy image value                                  |
    | ---------------------- | --------------------------------------------------- |
    | Nixpacks or Dockerfile | Image digest such as sha256:...                     |
    | Container image        | Tag for the configured repository, such as latest   |
    | Disabled               | Full image URI, ideally pinned by digest            |

    ## Builder settings

    Builder settings apply to Nixpacks and Dockerfile builds.

    | Field                         | Default       | Description                                          |
    | ----------------------------- | ------------- | ---------------------------------------------------- |
    | Builder instance type         | ec2           | Use EC2 for normal builds or EC2 spot for lower cost |
    | Builder instance size         | c7a.4xlarge   | EC2 instance size used for builds                    |
    | Builder execution environment | Cluster value | Optional override for where image builds run         |
    | Builder AMI                   | Default image | Optional AMI override for build runners              |

    Start with the default builder size, then adjust based on build duration and resource usage.

    ## Configuration

    | Field                           | Required | Default                    | Description                                        |
    | ------------------------------- | -------- | -------------------------- | -------------------------------------------------- |
    | Public web service              | No       | true                       | Use the public ALB; turn off for the private ALB   |
    | Run in private subnets          | No       | true                       | Run tasks in private subnets without public IPs    |
    | Service name                    | Yes      | {project}-{env}-{module}   | Name for the ECS service and related resources     |
    | ECS cluster                     | Yes      | -                          | Existing rvn-ecs-cluster module instance           |
    | Build type                      | Yes      | nixpacks                   | Nixpacks, Dockerfile, Container image, or Disabled |
    | Git repository                  | Yes*     | -                          | Required for Nixpacks and Dockerfile builds        |
    | Git branch                      | Yes*     | -                          | Required for Nixpacks and Dockerfile builds        |
    | Source base path                | No       | .                          | Path from repository root to source code           |
    | Image repository                | Yes*     | nginx                      | Required for Container image builds                |
    | Container port                  | Yes      | 80                         | Port exposed by the app container                  |
    | Health check path               | Yes      | /                          | HTTP path used by the target group health check    |
    | Domain host rules               | No       | -                          | Hostnames such as app.example.com or *.example.com |
    | Path rules                      | No       | -                          | Path patterns such as /*, /api/*, or /app/*        |
    | Capacity provider               | Yes      | fargate                    | Primary service capacity provider                  |
    | App size                        | No       | 2 vCPU, 4 GB               | Fargate task CPU and memory                        |
    | App vCPU                        | Yes*     | 1.5                        | Required for EC2 capacity                          |
    | App memory in GB                | Yes*     | 3.5                        | Required for EC2 capacity                          |
    | CPU architecture                | No       | X86_64                     | x86_64 compatibility or ARM64 cost optimization    |
    | ECS exec                        | No       | false                      | Enable ECS Exec for debugging containers           |
    | Autoscaling                     | No       | true                       | Enable CPU and optional memory target tracking     |
    | Deployment type                 | No       | rolling                    | Rolling or blue/green deployment infrastructure    |
    | Tags                            | No       | Standard Ravion tags       | Additional tags applied to resources               |
    | Advanced Terraform variables    | No       | {}                         | Raw lower-level overrides for exceptional cases    |
    | OpenTofu version override       | No       | Ravion default             | Override the OpenTofu version for the stack        |
    | Ravion Terraform workspace name | No       | {project}-{env}-{module}   | Override the state backend workspace name          |

    *Conditionally required based on the selected build type or capacity provider.

    ## Design decisions

    - The module always models an HTTP web service behind an Application Load Balancer. NLB, worker, and service discovery patterns are intentionally outside this module definition.
    - Tasks default to private subnets even for public web services. The ALB is public; the tasks remain private when the VPC has NAT or equivalent egress.
    - Built images are pushed to an ECR repository created with the service stack. Container image and disabled build modes let teams bring their own image pipeline.
    - Desired count is managed through deployment and autoscaling behavior rather than by exposing a separate desired count input.
    - Advanced Terraform variables exist for exceptional lower-level overrides. Prefer the typed Ravion fields whenever possible.

    ## Learn more

    - [Amazon ECS services](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs_services.html)
    - [Application Load Balancer listener rules](https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-update-rules.html)
    - [Amazon ECS capacity providers](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/cluster-capacity-providers.html)
    - [Amazon ECS service auto scaling](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service-auto-scaling.html)
    - [Nixpacks documentation](https://nixpacks.com/docs)
  stack:
    pipelines:
      change:
        pipeline_id: << defaults.change_pipeline_id >>
      defaults:
        input:
          aws_account_id: "<< module.input.execution_environment_id ? null : module.input.aws_account_id >>"
          aws_region: "<< module.input.execution_environment_id ? null : module.input.aws_region >>"
          base_path: compute/ecs_service
          branch: main
          execution_environment_id: << module.input.execution_environment_id >>
          ref: 84eb256921edf88126c5451608ce6f010d94842f
          repo: https://github.com/flightcontrolhq/modules
          stack_id: <<stack.id>>
          terraform_variables:
            ...overrides: << module.input.advanced_terraform_variables >>
            allowed_cidr_blocks: << module.input.allowed_cidr_blocks >>
            assign_public_ip: "<< module.input.use_private_subnets ? false : true >>"
            auto_scaling:
              enabled: << module.input.enable_auto_scaling >>
              max_capacity: << module.input.max_capacity >>
              min_capacity: << module.input.min_capacity >>
              scheduled: "<< module.input.scheduled_scaling != nil ? module.input.scheduled_scaling : [] >>"
              target_tracking:
                - disable_scale_in: << module.input.disable_scale_in >>
                  policy_name: cpu
                  predefined_metric: ECSServiceAverageCPUUtilization
                  scale_in_cooldown: << module.input.scale_in_cooldown >>
                  scale_out_cooldown: << module.input.scale_out_cooldown >>
                  target_value: << module.input.cpu_target_value >>
                - '...<< module.input.memory_target_value ? [{policy_name: "memory", predefined_metric: "ECSServiceAverageMemoryUtilization", target_value: module.input.memory_target_value, scale_in_cooldown: module.input.scale_in_cooldown, scale_out_cooldown: module.input.scale_out_cooldown, disable_scale_in: module.input.disable_scale_in}] : [] >>'
                - "...<< module.input.custom_metric_scaling_policies != nil && module.input.custom_metric_scaling_policies != [] ? module.input.custom_metric_scaling_policies : [] >>"
            capacity_provider_strategies:
              - '...<< module.input.capacity_provider == "fargate" || module.input.add_fargate_capacity ? [{capacity_provider: module.input.fargate_capacity_provider_name, weight: 1, base: 0}] : [] >>'
              - '...<< module.input.capacity_provider == "fargate_spot" || module.input.add_fargate_spot_capacity ? [{capacity_provider: module.input.fargate_spot_capacity_provider_name, weight: 1, base: 0}] : [] >>'
              - '...<< module.input.capacity_provider == "ec2" || module.input.add_ec2_capacity ? [{capacity_provider: module.input.ec2_capacity_provider_name, weight: 1, base: 0}] : [] >>'
            cluster_arn: << module.input.cluster_arn >>
            container_port: << module.input.container_port >>
            deployment_maximum_percent: << module.input.deployment_maximum_percent >>
            deployment_minimum_healthy_percent: << module.input.deployment_minimum_healthy_percent >>
            deployment_type: rolling
            desired_count: 0
            ecr_enable_default_lifecycle_policy: true
            ecr_force_delete: << module.input.ecr_force_delete >>
            ecr_repository_name: << module.input.name >>
            ecr_scan_on_push: << module.input.ecr_scan_on_push >>
            enable_ecr: << module.input.build_type == "nixpacks" || module.input.build_type == "dockerfile" >>
            enable_execute_command: << module.input.enable_execute_command >>
            execution_role_arn: << module.input.execution_role_arn || nil >>
            execution_role_policies: << module.input.execution_role_policies >>
            force_new_deployment: << module.input.force_new_deployment >>
            health_check_grace_period_seconds: << module.input.health_check_grace_period_seconds >>
            launch_type: '<< module.input.capacity_provider == "ec2" ? "EC2" : "FARGATE" >>'
            load_balancer_attachment:
              container_port: << module.input.container_port >>
              enabled: true
              listener_rules:
                - conditions:
                    - '...<< module.input.host_header_values != nil && module.input.host_header_values != [] ? [{type: "host-header", values: module.input.host_header_values}] : [] >>'
                    - '...<< module.input.path_pattern_values != nil && module.input.path_pattern_values != [] ? [{type: "path-pattern", values: module.input.path_pattern_values}] : module.input.host_header_values != nil && module.input.host_header_values != [] ? [] : [{type: "path-pattern", values: ["/*"]}] >>'
                  listener_arn: "<< module.input.is_public ? (module.input.public_alb_https_listener_arn || module.input.public_alb_http_listener_arn) : (module.input.private_alb_https_listener_arn || module.input.private_alb_http_listener_arn) >>"
                  priority: << module.input.listener_rule_priority >>
              target_group:
                health_check:
                  enabled: true
                  healthy_threshold: << module.input.healthy_threshold >>
                  interval: << module.input.health_check_interval >>
                  matcher: << module.input.health_check_matcher >>
                  path: << module.input.health_check_path >>
                  timeout: << module.input.health_check_timeout >>
                  unhealthy_threshold: << module.input.unhealthy_threshold >>
                port: << module.input.container_port >>
                protocol: HTTP
                slow_start: << module.input.target_group_slow_start >>
                stickiness:
                  cookie_duration: << module.input.target_group_stickiness_cookie_duration >>
                  cookie_name: '<< module.input.target_group_stickiness_type == "app_cookie" ? module.input.target_group_stickiness_cookie_name : nil >>'
                  enabled: << module.input.target_group_stickiness_enabled >>
                  type: << module.input.target_group_stickiness_type >>
                target_type: ip
            load_balancer_security_group_id: "<< module.input.is_public ? module.input.public_alb_security_group_id : module.input.private_alb_security_group_id >>"
            name: << module.input.name >>
            network_mode: awsvpc
            region: << module.input.aws_region >>
            requires_compatibilities: '<< module.input.capacity_provider == "ec2" ? ["EC2"] : ["FARGATE"] >>'
            runtime_platform:
              cpu_architecture: << module.input.cpu_architecture >>
              operating_system_family: LINUX
            security_group_ids: << module.input.security_group_ids >>
            subnet_ids: "<< module.input.use_private_subnets ? module.input.private_subnet_ids : module.input.public_subnet_ids >>"
            tags:
              ...overrides: << module.input.tags >>
              EnvironmentGivenId: <<environment.given_id>>
              ModuleGivenId: <<module.given_id>>
              ModuleId: <<module.id>>
              Owner: Ravion
              ProjectGivenId: <<project.given_id>>
            task_cpu: '<< module.input.capacity_provider == "ec2" ? int(float(module.input.task_cpu) * 1024) : int(float(module.input.fargate_size.vcpu) * 1024) >>'
            task_memory: '<< module.input.capacity_provider == "ec2" ? int(float(module.input.task_memory) * 1024) : int(float(module.input.fargate_size.memory_gb) * 1024) >>'
            task_role_arn: << module.input.task_role_arn || nil >>
            task_role_inline_policies: << module.input.task_role_inline_policies >>
            task_role_policies: << module.input.task_role_policies >>
            volumes: << module.input.volumes >>
            vpc_id: << module.input.vpc_id >>
            wait_for_steady_state: false
          tool: opentofu
          tool_version: << module.input.opentofu_version >>
        variant: standard
      destroy:
        pipeline_id: << defaults.destroy_pipeline_id >>
    ravion_state_backend_workspace: << module.input.ravion_state_backend_workspace || project.given_id + "-" + environment.given_id + "-" + module.given_id + "-" + stack.id>>
    type: opentofu
  ui:
    metrics:
      - id: cpu_utilization
        name: CPU utilization
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            ClusterName: << stack.output.cluster_name >>
            ServiceName: << stack.output.service_name >>
          name: CPUUtilization
          namespace: AWS/ECS
          region: << stack.output.region >>
          statistic: Average
          type: cloudwatch
        type: line
      - id: memory_utilization
        name: Memory utilization
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            ClusterName: << stack.output.cluster_name >>
            ServiceName: << stack.output.service_name >>
          name: MemoryUtilization
          namespace: AWS/ECS
          region: << stack.output.region >>
          statistic: Average
          type: cloudwatch
        type: line
      - id: running_tasks
        name: Running tasks
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            ClusterName: << stack.output.cluster_name >>
            ServiceName: << stack.output.service_name >>
          name: RunningTaskCount
          namespace: ECS/ContainerInsights
          region: << stack.output.region >>
          statistic: Average
          type: cloudwatch
        type: line
      - id: request_count
        name: Request count
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            TargetGroup: << stack.output.target_group_arn_suffix >>
          name: RequestCount
          namespace: AWS/ApplicationELB
          region: << stack.output.region >>
          statistic: Sum
          type: cloudwatch
        type: line
      - id: target_5xx_errors
        name: 5xx errors
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            TargetGroup: << stack.output.target_group_arn_suffix >>
          name: HTTPCode_Target_5XX_Count
          namespace: AWS/ApplicationELB
          region: << stack.output.region >>
          statistic: Sum
          type: cloudwatch
        type: line
      - id: target_4xx_errors
        name: 4xx errors
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            TargetGroup: << stack.output.target_group_arn_suffix >>
          name: HTTPCode_Target_4XX_Count
          namespace: AWS/ApplicationELB
          region: << stack.output.region >>
          statistic: Sum
          type: cloudwatch
        type: line
      - id: target_response_time
        name: Target response time
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            TargetGroup: << stack.output.target_group_arn_suffix >>
          name: TargetResponseTime
          namespace: AWS/ApplicationELB
          region: << stack.output.region >>
          statistic: Average
          type: cloudwatch
        type: line
      - id: healthy_hosts
        name: Healthy hosts
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            TargetGroup: << stack.output.target_group_arn_suffix >>
          name: HealthyHostCount
          namespace: AWS/ApplicationELB
          region: << stack.output.region >>
          statistic: Average
          type: cloudwatch
        type: line
      - id: unhealthy_hosts
        name: Unhealthy hosts
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            TargetGroup: << stack.output.target_group_arn_suffix >>
          name: UnHealthyHostCount
          namespace: AWS/ApplicationELB
          region: << stack.output.region >>
          statistic: Average
          type: cloudwatch
        type: line
      - id: network_in
        name: Network in
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            ClusterName: << stack.output.cluster_name >>
            ServiceName: << stack.output.service_name >>
          name: NetworkRxBytes
          namespace: ECS/ContainerInsights
          region: << stack.output.region >>
          statistic: Sum
          type: cloudwatch
        type: line
      - id: network_out
        name: Network out
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            ClusterName: << stack.output.cluster_name >>
            ServiceName: << stack.output.service_name >>
          name: NetworkTxBytes
          namespace: ECS/ContainerInsights
          region: << stack.output.region >>
          statistic: Sum
          type: cloudwatch
        type: line
