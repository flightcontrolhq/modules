definition:
  type: rvn-ecs-web
  name: ECS Web Server
  description: Web server ECS service for running an HTTP application behind an ECS cluster load balancer.
release:
  version: 0.5.1
  description: Share ECS service definition config with worker modules
module:
  inputs:
    - id: section_cluster
      label: ECS cluster
      type: section
    - id: cluster
      immutable: true
      label: ECS cluster
      type: $ref:rvn-ecs-cluster
      mapped_inputs:
        - $include: ../../partials/inputs/ecs-service-cluster-common-mapped-inputs.yml
        - $include: ../../partials/inputs/ecs-service-cluster-alb-mapped-inputs.yml
      required: true
    - id: section_service
      label: Web service
      type: section
    - id: name
      immutable: true
      label: Service name
      type: string
      description: Name for the ECS service and related resources.
      required: true
      default: <<project.given_id>>-<<environment.given_id>>-<<module.given_id>>
      patterns:
        - message: Use 1-255 letters, numbers, underscores, or hyphens, starting with a letter or number.
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,254}$
    - id: public_web_service_enabled
      label: Public web service
      type: boolean
      description: Expose this service through the public ALB. Turn off to use the private ALB.
      default: true
    - id: private_subnet_placement_enabled
      label: Run in private subnets
      type: boolean
      description: Recommended. Requires a NAT gateway or equivalent for internet access and a static IP.
      default: true
    - $include: ../../partials/inputs/ecs-service-build-inputs.yml
    - id: section_health
      label: Health check
      type: section
    - id: container_port
      immutable: true
      label: Container port
      type: number
      description: Port the web container listens on.
      max: 65535
      min: 1
      required: true
      default: 80
    - id: health_check_path
      label: Health check path
      type: string
      description: HTTP path the load balancer calls to verify the web server is healthy. Use a lightweight endpoint that does not require authentication.
      required: true
      default: /
    - id: health_check_matcher
      label: Success codes
      type: string
      description: HTTP status code matcher for successful health checks. Defaults to 200-399 so redirects and common successful responses are accepted.
      collapsible: true
      placeholder: 200-399
      required: true
      default: 200-399
    - id: health_check_interval
      label: Interval (secs)
      type: number
      description: Seconds between load balancer health checks. Lower values detect failures faster but send more health-check traffic.
      collapsible: true
      max: 300
      min: 5
      default: 5
    - id: health_check_timeout
      label: Timeout (secs)
      type: number
      description: Seconds to wait for the health-check response before marking that check as failed. Must be lower than the interval.
      collapsible: true
      max: 120
      min: 2
      default: 4
    - id: healthy_threshold
      label: Healthy threshold
      type: number
      description: Number of consecutive successful checks required before an unhealthy target is considered healthy.
      collapsible: true
      max: 10
      min: 2
      default: 2
    - id: unhealthy_threshold
      label: Unhealthy threshold
      type: number
      description: Number of consecutive failed checks required before a target is considered unhealthy.
      collapsible: true
      max: 10
      min: 2
      default: 2
    - id: health_check_grace_period_seconds
      label: Health check grace period (secs)
      type: number
      description: Seconds ECS ignores failing load balancer health checks after a task starts. Increase this for apps with slow boot times.
      collapsible: true
      min: 0
      default: 0
    - id: target_group_slow_start
      label: Slow start duration (secs)
      type: number
      description: Gradually ramps traffic to newly registered targets. Use 0 to disable.
      collapsible: true
      max: 900
      min: 0
      default: 0
    - id: target_group_stickiness_enabled
      label: Sticky sessions
      type: boolean
      description: Enable load balancer cookie stickiness so repeat requests are routed to the same task when possible.
      collapsible: true
      default: true
    - id: target_group_stickiness_type
      label: Stickiness type
      type: string
      collapsible: true
      show_when:
        target_group_stickiness_enabled: true
      default: lb_cookie
      values:
        - label: Load balancer cookie
          value: lb_cookie
        - label: Application cookie
          value: app_cookie
    - id: target_group_stickiness_cookie_duration
      label: Stickiness cookie duration (secs)
      type: number
      collapsible: true
      max: 604800
      min: 1
      show_when:
        target_group_stickiness_enabled: true
      default: 86400
    - id: target_group_stickiness_cookie_name
      label: Application cookie name
      type: string
      collapsible: true
      required: false
      show_when:
        target_group_stickiness_type: app_cookie
    - id: section_routing
      label: HTTP listener rules
      type: section
      description: Add at least one domain host rule or path rule.
    - id: host_header_values
      label: Domain host rules
      type: string_array
      description: Hostnames that should route to this service, such as app.example.com or *.example.com. Leave empty to use path-based routing.
      add_button_label: Add domain host
      placeholder: app.example.com
      required: false
      default: null
    - id: path_pattern_values
      label: Path rules
      type: string_array
      description: Path patterns that should route to this service, such as /*, /api/*, or /app/*. If both domain host rules and path rules are empty, the service routes all paths with /*.
      add_button_label: Add path pattern
      collapsible: true
      required: false
      default: null
    - id: listener_rule_priority
      label: Listener rule priority
      type: number
      description: Optional ALB listener rule priority. Leave blank to let AWS assign the next available priority.
      collapsible: true
      max: 50000
      min: 1
    - $include: ../../partials/inputs/ecs-service-capacity-inputs.yml
    - $include: ../../partials/inputs/ecs-service-autoscaling-inputs.yml
    - $template: ../../partials/templates/ecs-service-runtime-env-inputs.yml
      with:
        environment_variables_description: Runtime environment variables passed to the app container. PORT is added automatically from the container port setting.
    - $include: ../../partials/inputs/ecs-service-deploy-command-inputs.yml
    - $include: ../../partials/inputs/ecs-service-logging-iam-networking-inputs.yml
    - $include: ../../partials/inputs/ecs-service-builder-ecr-misc-inputs.yml
  stack:
    type: opentofu
    ravion_state_backend_workspace: >-
      << module.input.ravion_state_backend_workspace || project.given_id + "-" + environment.given_id + "-"
      + module.given_id + "-" + stack.id>>
    pipelines:
      defaults:
        input:
          aws_account_id: "<< module.input.execution_environment_id ? null : module.input.aws_account_id >>"
          aws_region: "<< module.input.execution_environment_id ? null : module.input.aws_region >>"
          base_path: compute/ecs_service
          branch: main
          execution_environment_id: << module.input.execution_environment_id >>
          ref: $local.module_tag
          repo: https://github.com/flightcontrolhq/modules
          stack_id: <<stack.id>>
          terraform_variables:
            $merge:
              - ../../partials/stack/ecs-service-common-terraform-variables.yml
              - container_port: << module.input.container_port >>
                health_check_grace_period_seconds: << module.input.health_check_grace_period_seconds >>
                load_balancer_attachment:
                  container_port: << module.input.container_port >>
                  enabled: true
                  listener_rules:
                    - conditions:
                        - >-
                          ...<< module.input.host_header_values != nil && module.input.host_header_values !=
                          [] ? [{type: "host-header", values: module.input.host_header_values}] : [] >>
                        - >-
                          ...<< module.input.path_pattern_values != nil && module.input.path_pattern_values !=
                          [] ? [{type: "path-pattern", values: module.input.path_pattern_values}] :
                          module.input.host_header_values != nil && module.input.host_header_values != [] ? []
                          : [{type: "path-pattern", values: ["/*"]}] >>
                      listener_arn: >-
                        << module.input.public_web_service_enabled ? (module.input.public_alb_https_listener_arn ||
                        module.input.public_alb_http_listener_arn) :
                        (module.input.private_alb_https_listener_arn ||
                        module.input.private_alb_http_listener_arn) >>
                      priority: << module.input.listener_rule_priority >>
                  target_group:
                    health_check:
                      enabled: true
                      healthy_threshold: << module.input.healthy_threshold >>
                      interval: << module.input.health_check_interval >>
                      matcher: << module.input.health_check_matcher >>
                      path: << module.input.health_check_path >>
                      timeout: << module.input.health_check_timeout >>
                      unhealthy_threshold: << module.input.unhealthy_threshold >>
                    port: << module.input.container_port >>
                    protocol: HTTP
                    slow_start: << module.input.target_group_slow_start >>
                    stickiness:
                      cookie_duration: << module.input.target_group_stickiness_cookie_duration >>
                      cookie_name: '<< module.input.target_group_stickiness_type == "app_cookie" ? module.input.target_group_stickiness_cookie_name : nil >>'
                      enabled: << module.input.target_group_stickiness_enabled >>
                      type: << module.input.target_group_stickiness_type >>
                    target_type: ip
                load_balancer_security_group_id: >-
                  << module.input.public_web_service_enabled ? module.input.public_alb_security_group_id :
                  module.input.private_alb_security_group_id >>
          tool: opentofu
          tool_version: << module.input.opentofu_version || defaults.opentofu_version >>
        variant: standard
      change:
        pipeline_id: << defaults.change_pipeline_id >>
      destroy:
        pipeline_id: << defaults.destroy_pipeline_id >>
  build:
    $include: ../../partials/build/ecs-service-image-build.yml
  deploy:
    $merge:
      - ../../partials/deploy/ecs-service-deploy-common.yml
    task_definition:
      $merge:
        - ../../partials/deploy/ecs-service-task-definition-common.yml
      container_definitions: >-
        << (module.input.firelens_enabled ? [{"cpu": (module.input.capacity_provider == "ec2" ?
        int(float(module.input.task_cpu) * 1024) : int(float(module.input.fargate_size.vcpu) * 1024)),
        "depends_on": [{"container_name": "log_router", "condition": "START"}], "environment": ([{name:
        "PORT", value: string(module.input.container_port)}] | concat(module.input.environment_variables !=
        nil ? module.input.environment_variables : [])), "essential": true, "image":
        (module.input.build_type == "prebuilt_image" ? (deploy.input.image_ref contains
        "sha256:" ? module.input.image_repository + "@" + deploy.input.image_ref :
        module.input.image_repository + ":" + deploy.input.image_ref) : (deploy.input.image_ref contains
        "sha256:" ? stack.output.ecr_repository_url + "@" + deploy.input.image_ref :
        stack.output.ecr_repository_url + ":" + deploy.input.image_ref)), "linux_parameters":
        {"init_process_enabled": true}, "log_configuration": {"log_driver": "awsfirelens"}, "memory":
        (module.input.capacity_provider == "ec2" ? int(float(module.input.task_memory) * 1024) :
        int(float(module.input.fargate_size.memory_gb) * 1024)), "name": (stack.output.container_name),
        "port_mappings": [{"app_protocol": "http", "container_port": (module.input.container_port),
        "protocol": "tcp"}], "readonly_root_filesystem": false, "repository_credentials":
        (module.input.image_registry_credentials_secret_arn ? {credentials_parameter:
        module.input.image_registry_credentials_secret_arn} : nil), "secrets": (module.input.secrets),
        "stop_timeout": 30}, {"name": "log_router", "image": module.input.firelens_image, "cpu": 0,
        "memory_reservation": 51, "essential": true, "environment": ([{name: "FIRELENS_CONFIG_CONTENT",
        value: "[SERVICE]\n    Flush 1\n    Grace 30\n\n" + (module.input.firelens_config ?
        module.input.firelens_config + "\n" : "") + (module.input.firelens_cloudwatch_output_enabled ?
        "\n[OUTPUT]\n    Name cloudwatch\n    Match *\n    region " + stack.output.region +
        "\n    log_group_name " + stack.output.log_group_name +
        "\n    auto_create_group true\n    log_stream_prefix " + stack.output.log_stream_prefix +
        "/\n    retry_limit 2\n    log_key log\n    log_format json/emf\n" : "")}] |
        concat(module.input.firelens_environment_variables != nil ?
        module.input.firelens_environment_variables : [])), "secrets": module.input.firelens_secrets != nil
        ? module.input.firelens_secrets : [], "command": ["/bin/sh", "-c",
        "printf '%s' \"$FIRELENS_CONFIG_CONTENT\" > /flightcontrol-firelens.conf && exec /entrypoint.sh"],
        "user": "0", "log_configuration": {"log_driver": "awslogs", "options": {"awslogs-group":
        stack.output.log_group_name, "awslogs-region": stack.output.region, "awslogs-stream-prefix":
        stack.output.log_stream_prefix + "/firelens"}}, "firelens_configuration": {"type": "fluentbit",
        "options": {"config-file-type": "file", "config-file-value": "/flightcontrol-firelens.conf",
        "enable-ecs-log-metadata": string(module.input.firelens_ecs_metadata_enabled)}}}] : [{"cpu":
        (module.input.capacity_provider == "ec2" ? int(float(module.input.task_cpu) * 1024) :
        int(float(module.input.fargate_size.vcpu) * 1024)), "environment": ([{name: "PORT", value:
        string(module.input.container_port)}] | concat(module.input.environment_variables != nil ?
        module.input.environment_variables : [])), "essential": true, "image": (module.input.build_type ==
        "prebuilt_image" ? (deploy.input.image_ref contains "sha256:" ?
        module.input.image_repository + "@" + deploy.input.image_ref : module.input.image_repository +
        ":" + deploy.input.image_ref) : (deploy.input.image_ref contains "sha256:" ?
        stack.output.ecr_repository_url + "@" + deploy.input.image_ref : stack.output.ecr_repository_url +
        ":" + deploy.input.image_ref)), "linux_parameters": {"init_process_enabled": true},
        "log_configuration": {"log_driver": "awslogs", "options": {"awslogs-group":
        stack.output.log_group_name, "awslogs-region": stack.output.region, "awslogs-stream-prefix":
        stack.output.log_stream_prefix}}, "memory": (module.input.capacity_provider == "ec2" ?
        int(float(module.input.task_memory) * 1024) : int(float(module.input.fargate_size.memory_gb) *
        1024)), "name": (stack.output.container_name), "port_mappings": [{"app_protocol": "http",
        "container_port": (module.input.container_port), "protocol": "tcp"}], "readonly_root_filesystem":
        false, "repository_credentials": (module.input.image_registry_credentials_secret_arn ?
        {credentials_parameter: module.input.image_registry_credentials_secret_arn} : nil), "secrets":
        (module.input.secrets), "stop_timeout": 30}]) | concat(module.input.sidecars ? module.input.sidecars
        : []) >>
  ui:
    metrics:
      - $include: ../../partials/ui/ecs-service-common-metrics.yml
      - id: request_count
        name: Request count
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            TargetGroup: << stack.output.target_group_arn_suffix >>
          name: RequestCount
          namespace: AWS/ApplicationELB
          region: << stack.output.region >>
          statistic: Sum
      - id: target_5xx_errors
        name: 5xx errors
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            TargetGroup: << stack.output.target_group_arn_suffix >>
          name: HTTPCode_Target_5XX_Count
          namespace: AWS/ApplicationELB
          region: << stack.output.region >>
          statistic: Sum
      - id: target_4xx_errors
        name: 4xx errors
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            TargetGroup: << stack.output.target_group_arn_suffix >>
          name: HTTPCode_Target_4XX_Count
          namespace: AWS/ApplicationELB
          region: << stack.output.region >>
          statistic: Sum
      - id: target_response_time
        name: Target response time
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            TargetGroup: << stack.output.target_group_arn_suffix >>
          name: TargetResponseTime
          namespace: AWS/ApplicationELB
          region: << stack.output.region >>
          statistic: Average
      - id: healthy_hosts
        name: Healthy hosts
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            TargetGroup: << stack.output.target_group_arn_suffix >>
          name: HealthyHostCount
          namespace: AWS/ApplicationELB
          region: << stack.output.region >>
          statistic: Average
      - id: unhealthy_hosts
        name: Unhealthy hosts
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            TargetGroup: << stack.output.target_group_arn_suffix >>
          name: UnHealthyHostCount
          namespace: AWS/ApplicationELB
          region: << stack.output.region >>
          statistic: Average
  readme: |
    Web server ECS service for running an HTTP application behind an ECS cluster load balancer.

    ## Overview

    The ECS Web Server module creates an ECS service for HTTP traffic in an existing Ravion ECS cluster. Select an ECS cluster, choose how the container image is built or supplied, configure routing and health checks, and Ravion provisions the service, target group, listener rule, IAM roles, security group, ECR repository when needed, and autoscaling settings.

    The module is intentionally focused on web services behind an Application Load Balancer. It uses the selected ECS cluster to inherit AWS account, region, VPC, subnets, capacity providers, load balancer listeners, and load balancer security groups.

    Terraform source: [flightcontrolhq/modules/compute/ecs_service](https://github.com/flightcontrolhq/modules/tree/$local.module_tag/compute/ecs_service)

    ## Use cases

    | Scenario                         | ECS Web Server helps by...                                      |
    | -------------------------------- | --------------------------------------------------------------- |
    | Deploying a public web app       | Routing host or path traffic through the public cluster ALB      |
    | Hosting an internal HTTP service | Routing private traffic through the private cluster ALB          |
    | Building from source             | Creating images with Nixpacks or a Dockerfile and pushing to ECR |
    | Bringing an existing image       | Deploying a public or private registry image by tag or digest    |
    | Tuning production capacity       | Combining Fargate, Fargate Spot, or EC2 with autoscaling         |
    | Running release tasks            | Running pre-deploy or post-deploy ECS tasks with the app image   |
    | Debugging running tasks          | Enabling ECS Exec when shell access is needed                    |

    ## Cluster and networking

    An ECS cluster is required. The cluster reference supplies the cluster ARN, VPC ID, public and private subnet IDs, load balancer listeners, load balancer security groups, capacity provider names, AWS account, region, and execution environment.

    Use Public web service when the service should be reachable through the public Application Load Balancer. Turn it off for internal services that should use the private Application Load Balancer.

    Use Run in private subnets for most production services. Private subnets keep tasks off the public internet and route outbound traffic through NAT or equivalent egress. Turning it off runs tasks in public subnets and assigns public IPs.

    ## Build and image options

    | Build type      | When to use it                                                    |
    | --------------- | ----------------------------------------------------------------- |
    | Nixpacks        | Let Ravion detect the app stack and build an image from source    |
    | Dockerfile      | Build from a Dockerfile in the selected repository                |
    | Prebuilt image from registry | Deploy an existing image from Docker Hub, GHCR, ECR, or registry |
    | Disabled        | Build outside Ravion and provide a full image URI at deploy time  |

    For Nixpacks and Dockerfile builds, provide Git repository, Git branch, and optionally Source base path. Ravion pushes built images to the service ECR repository and deploys by image digest.

    For Prebuilt image from registry, provide the image repository without the tag. At deploy time, provide the tag to use. Use Registry credentials secret ARN for private registries that require ECS repository credentials.

    ## Routing and health checks

    The service always attaches to an Application Load Balancer target group. Route traffic with Domain host rules, Path rules, or both.

    If both host and path rules are empty, Ravion creates a default /* path rule so the listener rule has a valid condition. Use Listener rule priority only when you need a specific ALB rule order; otherwise AWS assigns the next available priority.

    Health check settings control when the load balancer considers tasks healthy:

    | Field                            | Default | Description                                                    |
    | -------------------------------- | ------- | -------------------------------------------------------------- |
    | Container port                   | 80      | Port the container listens on; PORT is added automatically     |
    | Health check path                | /       | Lightweight HTTP endpoint the load balancer checks             |
    | Success codes                    | 200-399 | Status codes treated as healthy                                |
    | Interval (secs)                  | 5       | Seconds between checks                                         |
    | Timeout (secs)                   | 4       | Seconds to wait for a response                                 |
    | Healthy threshold                | 2       | Successful checks needed to mark a target healthy              |
    | Unhealthy threshold              | 2       | Failed checks needed to mark a target unhealthy                |
    | Health check grace period (secs) | 0       | Startup window where ECS ignores load balancer health failures |

    Increase the grace period for apps with slow boot times. Keep health check endpoints lightweight and unauthenticated.

    ## Capacity and runtime

    Choose one primary Capacity provider:

    | Capacity provider | Best for                                                       |
    | ----------------- | -------------------------------------------------------------- |
    | Fargate           | Simple serverless containers and predictable web services      |
    | Fargate spot      | Lower-cost services that can tolerate task interruption        |
    | EC2               | Workloads that need cluster EC2 capacity or host-level control |

    You can add secondary providers with Also use Fargate, Also use Fargate spot, and Also use EC2. Mixed strategies can reduce cost or increase placement flexibility, but each enabled provider must exist on the selected cluster.

    For Fargate and Fargate Spot, App size defaults to 2 vCPU and 4 GB memory. For EC2 capacity, App vCPU defaults to 1.5 and App memory in GB defaults to 3.5; leave spare CPU and memory on each EC2 instance for the ECS agent and system processes.

    CPU architecture defaults to x86_64 for broad compatibility. Choose ARM64 only when the image and native dependencies support it.

    ## Autoscaling

    Autoscaling is enabled by default with one minimum task and three maximum tasks. For production, start with at least two minimum tasks when availability matters.

    | Field                    | Default | Description                                    |
    | ------------------------ | ------- | ---------------------------------------------- |
    | Autoscaling              | true    | Enables ECS service target tracking            |
    | Minimum tasks            | 1       | Lower bound for running tasks                  |
    | Maximum tasks            | 3       | Upper bound for running tasks                  |
    | CPU target (%)           | 70      | Average CPU utilization target                 |
    | Memory target (%)        | 80      | Average memory utilization target              |
    | Scale-in cooldown (secs) | 300     | Delay before another scale-in action           |
    | Scale-out cooldown (secs)| 300     | Delay before another scale-out action          |
    | Scale-in disabled        | false   | Prevents autoscaling from reducing task count  |

    ## Application configuration

    Use Runtime environment variables for plain container environment values. Ravion also sets PORT from Container port.

    Use Runtime secrets for sensitive values. Secrets are injected into the ECS task from SSM Parameter Store or Secrets Manager using name and value_from objects.

    Use Build environment variables for values needed during image builds. Values can be plain strings or references loaded from Parameter Store or Secrets Manager. For Dockerfile builds, enable Inject environment variables in Dockerfile to pass those values as Docker build arguments.

    ## Deployment

    Deployment type defaults to Rolling. Blue/green is available when you need separate target groups for CodeDeploy-style traffic shifting.

    Deployments update the ECS service task definition with the selected image, generated container definition, awslogs configuration, runtime platform, environment variables, secrets, and capacity-provider-compatible task settings.

    The deploy-time Image value depends on the build mode:

    | Build mode             | Deploy image value                                  |
    | ---------------------- | --------------------------------------------------- |
    | Nixpacks or Dockerfile | Image digest such as sha256:...                     |
    | Prebuilt image from registry | Tag for the configured repository, such as latest   |
    | Disabled               | Full image URI, ideally pinned by digest            |

    Run pre-deploy command and Run post-deploy command start optional one-off ECS tasks before or after each deployment. These commands use the deployed app image, the app container name, the configured task role and execution role, the selected capacity provider strategy, service subnets, service security groups, runtime environment variables, and runtime secrets. Leave either toggle disabled to skip that hook and hide its settings.

    Use pre-deploy commands for work that must complete before the service updates, such as database migrations. Use post-deploy commands for work that should happen after a successful deployment, such as cache warming. Commands are ECS command argument arrays. For shell behavior, use `/bin/sh`, `-lc`, and your shell command as separate arguments.

    Hook-specific environment variables are appended to the app container override for the one-off task. Optional hook CPU, memory, ephemeral storage, and timeout settings let release tasks use different resources from the web service without changing the steady-state app task.

    ## Builder settings

    Builder settings apply to Nixpacks and Dockerfile builds.

    | Field                         | Default       | Description                                          |
    | ----------------------------- | ------------- | ---------------------------------------------------- |
    | Builder instance type         | ec2           | Use EC2 for normal builds or EC2 spot for lower cost |
    | Builder instance size         | c7a.4xlarge   | EC2 instance size used for builds                    |
    | Builder execution environment | Cluster value | Optional override for where image builds run         |
    | Builder AMI                   | Default image | Optional AMI override for build runners              |

    Start with the default builder size, then adjust based on build duration and resource usage.

    ## Configuration

    | Field                           | Required | Default                    | Description                                        |
    | ------------------------------- | -------- | -------------------------- | -------------------------------------------------- |
    | Public web service              | No       | true                       | Use the public ALB; turn off for the private ALB   |
    | Run in private subnets          | No       | true                       | Run tasks in private subnets without public IPs    |
    | Service name                    | Yes      | {project}-{env}-{module}   | Name for the ECS service and related resources     |
    | ECS cluster                     | Yes      | -                          | Existing rvn-ecs-cluster module instance           |
    | Build type                      | Yes      | dockerfile                 | Dockerfile, Nixpacks, Prebuilt image from registry, or Disabled |
    | Git repository                  | Yes*     | -                          | Required for Nixpacks and Dockerfile builds        |
    | Git branch                      | Yes*     | -                          | Required for Nixpacks and Dockerfile builds        |
    | Source base path                | No       | .                          | Path from repository root to source code           |
    | Image repository                | Yes*     | nginx                      | Required for prebuilt image deployments            |
    | Container port                  | Yes      | 80                         | Port exposed by the app container                  |
    | Health check path               | Yes      | /                          | HTTP path used by the target group health check    |
    | Domain host rules               | No       | -                          | Hostnames such as app.example.com or *.example.com |
    | Path rules                      | No       | -                          | Path patterns such as /*, /api/*, or /app/*        |
    | Capacity provider               | Yes      | fargate                    | Primary service capacity provider                  |
    | App size                        | No       | 2 vCPU, 4 GB               | Fargate task CPU and memory                        |
    | App vCPU                        | Yes*     | 1.5                        | Required for EC2 capacity                          |
    | App memory in GB                | Yes*     | 3.5                        | Required for EC2 capacity                          |
    | CPU architecture                | No       | X86_64                     | x86_64 compatibility or ARM64 cost optimization    |
    | ECS exec                        | No       | false                      | Enable ECS Exec for debugging containers           |
    | Run pre-deploy command          | No       | false                      | Enable a task before each deployment               |
    | Pre-deploy command arguments    | Yes*     | []                         | Command arguments run before each deployment       |
    | Pre-deploy environment variables| No       | []                         | Extra environment variables for the pre-deploy task |
    | Pre-deploy CPU units            | No       | App task CPU               | CPU override for the pre-deploy task               |
    | Pre-deploy memory (MiB)         | No       | App task memory            | Memory override for the pre-deploy task            |
    | Pre-deploy ephemeral storage    | No       | Task definition default    | Ephemeral storage override for the pre-deploy task |
    | Pre-deploy timeout (secs)       | No       | 1800                       | Maximum pre-deploy task wait time                  |
    | Run post-deploy command         | No       | false                      | Enable a task after each successful deployment     |
    | Post-deploy command arguments   | Yes*     | []                         | Command arguments run after each successful deployment |
    | Post-deploy environment variables| No      | []                         | Extra environment variables for the post-deploy task |
    | Post-deploy CPU units           | No       | App task CPU               | CPU override for the post-deploy task              |
    | Post-deploy memory (MiB)        | No       | App task memory            | Memory override for the post-deploy task           |
    | Post-deploy ephemeral storage   | No       | Task definition default    | Ephemeral storage override for the post-deploy task |
    | Post-deploy timeout (secs)      | No       | 1800                       | Maximum post-deploy task wait time                 |
    | Autoscaling                     | No       | true                       | Enable CPU and optional memory target tracking     |
    | Deployment type                 | No       | rolling                    | Rolling or blue/green deployment infrastructure    |
    | Tags                            | No       | Standard Ravion tags       | Additional tags applied to resources               |
    | Advanced Terraform variables    | No       | {}                         | Raw lower-level overrides for exceptional cases    |
    | OpenTofu version override       | No       | Ravion default             | Override the OpenTofu version for the stack        |
    | Ravion Terraform workspace name | No       | {project}-{env}-{module}   | Override the state backend workspace name          |

    *Conditionally required based on the selected build type or capacity provider.

    ## Design decisions

    - The module always models an HTTP web service behind an Application Load Balancer. NLB, worker, and service discovery patterns are intentionally outside this module definition.
    - Tasks default to private subnets even for public web services. The ALB is public; the tasks remain private when the VPC has NAT or equivalent egress.
    - Built images are pushed to an ECR repository created with the service stack. Prebuilt image from registry and disabled build modes let teams bring their own image pipeline.
    - Desired count is managed through deployment and autoscaling behavior rather than by exposing a separate desired count input.
    - Advanced Terraform variables exist for exceptional lower-level overrides. Prefer the typed Ravion fields whenever possible.

