- description: $with.certificate_description
  id: $with.certificate_input_id
  label: Certificate
  mapped_inputs:
    - add_button_label: Add certificate ARN
      default:
        - <<ref.stack.output.certificate_arn>>
      description: $with.certificate_arns_description
      id: $with.certificate_arns_input_id
      label: Certificate ARNs
      placeholder: arn:aws:acm:...
      required: true
      type: string_array
  required: true
  show_when: $with.show_when
  type: $ref:rvn-acm-certificate
- add_button_label: Add certificate ARN
  collapsible: true
  default: []
  description: $with.additional_certificate_arns_description
  id: $with.additional_certificate_arns_input_id
  label: Additional certificate ARNs
  placeholder: arn:aws:acm:...
  show_when: $with.show_when
  type: string_array
