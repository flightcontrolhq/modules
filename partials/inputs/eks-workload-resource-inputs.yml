- id: section_resources
  label: Resources
  type: section
  description: Kubernetes schedules pods on requests and enforces ceilings with limits.
- id: cpu_request
  label: CPU request
  type: string
  description: CPU reserved for the pod, in cores or millicores. Autoscaling CPU targets are a percentage of this value.
  placeholder: 100m
  required: true
  default: 100m
  patterns:
    - message: A CPU quantity such as 100m, 0.5, or 2.
      pattern: ^[0-9]+(\.[0-9]+)?m?$
- id: memory_request
  label: Memory request
  type: string
  description: Memory reserved for the pod. Set this close to steady-state usage.
  placeholder: 256Mi
  required: true
  default: 256Mi
  patterns:
    - message: A memory quantity such as 256Mi, 1Gi, or 512M.
      pattern: ^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|k|M|G|T)?$
- id: cpu_limit
  label: CPU limit
  type: string
  description: Optional CPU ceiling. Leave blank to let a pod burst into spare node CPU.
  placeholder: Unlimited
  collapsible: true
  required: false
  patterns:
    - message: A CPU quantity such as 100m, 0.5, or 2.
      pattern: ^[0-9]+(\.[0-9]+)?m?$
- id: memory_limit
  label: Memory limit
  type: string
  description: Memory ceiling. Exceeding it terminates the container with OOMKilled, so set it above the worst legitimate spike.
  placeholder: 512Mi
  required: true
  default: 512Mi
  patterns:
    - message: A memory quantity such as 256Mi, 1Gi, or 512M.
      pattern: ^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|k|M|G|T)?$
