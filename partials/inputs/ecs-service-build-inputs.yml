- id: section_build
  label: Build config
  type: section
- id: build_type
  label: Build type
  type: string
  required: true
  default: dockerfile
  values:
    - description: Bring your own Dockerfile
      label: Dockerfile
      value: dockerfile
    - description: Automatically build an image based on your code and config
      label: Nixpacks
      value: nixpacks
    - description: Deploy an image from a registry configured on this module. Provide only the tag or digest at deploy time.
      label: Prebuilt image from registry
      value: prebuilt_image
- $include: ./build-git-source.yml
- id: image_repository
  label: Image repository
  type: string
  description: Image repository without a tag or digest, such as `nginx`, `ghcr.io/org/app`, or `123456789012.dkr.ecr.us-east-1.amazonaws.com/app`.
  placeholder: nginx
  required: true
  show_when:
    build_type: prebuilt_image
- id: image_registry_credentials_secret_arn
  label: Registry credentials secret ARN
  type: string
  description: Secrets Manager secret ARN for private registries such as GHCR or Docker Hub. The secret must use the ECS repository credentials JSON format. Not needed for public images or normal same-account ECR.
  collapsible: true
  placeholder: arn:aws:secretsmanager:us-east-1:123456789012:secret:registry-creds
  required: false
  show_when:
    build_type: prebuilt_image
- $include: ./dockerfile-build.yml
- $include: ./nixpacks-basic.yml
- id: nixpacks_start_cmd
  label: Start command
  type: string
  placeholder: Intelligent default based on your language & framework
  show_when:
    build_type: nixpacks
- $include: ./nixpacks-advanced.yml
