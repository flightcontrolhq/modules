# AMP identifiers an EKS workload inherits from its EKS Add-ons reference.
#
# Both resolve from the add-ons stack's outputs, so they stay empty until that
# stack has applied with Metrics enabled - which is exactly when the Metrics
# tab's Prometheus charts leave their pending state. Deliberately not
# immutable: enabling Metrics on the add-ons module later must be able to
# propagate here.
- id: amp_workspace_id
  label: AMP workspace ID
  type: string
  description: Amazon Managed Prometheus workspace the cluster's metrics collector writes to. Inherited from the selected add-ons module; empty until its stack applies with Metrics enabled.
  collapsible: true
  required: false
  default: <<ref.stack.output.amp_workspace_id>>
- id: amp_region
  label: AMP region
  type: string
  description: Region of the Amazon Managed Prometheus workspace. Inherited from the selected add-ons module; empty until its stack applies with Metrics enabled.
  collapsible: true
  required: false
  default: <<ref.stack.output.amp_region>>
