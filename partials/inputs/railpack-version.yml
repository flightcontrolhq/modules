- collapsible: true
  description: Optional Railpack version to use for the build. Leave blank to use the Ravion default.
  id: railpack_version
  label: Railpack version
  patterns:
    - message: Leave blank, use latest, a semantic version like 0.29.0, or a v-prefixed version like v0.29.0.
      pattern: ^(|latest|v?[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?)$
  placeholder: 0.29.0
  show_when:
    build_type: railpack
  type: string
