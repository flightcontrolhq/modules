- $template: ../templates/builder-infrastructure-inputs.yml
  with:
    no_options_message: Select a VPC Network, or enter an AWS account and region, to load available EC2 instance types.
    show_when:
      build_source:
        - dockerfile
        - railpack
        - nixpacks
- id: soci_enabled
  label: SOCI lazy loading
  type: boolean
  description: Build a SOCI-enabled image so Fargate can lazily load it, starting tasks before the full image is downloaded. On by default, and worth the most on images larger than 250 MiB. Turn it off for small images or EC2 capacity, where the gzip layer compression SOCI requires makes builds slower without speeding up task startup. Lazy loading also changes how long tasks take to report healthy, so services behind a load balancer may need a longer health check grace period.
  collapsible: true
  show_when:
    build_source:
      - dockerfile
      - railpack
      - nixpacks
  default: true
- id: section_ecr
  label: Image registry lifecycle
  type: section
  show_when:
    build_source:
      - dockerfile
      - railpack
      - nixpacks
- id: ecr_scan_on_push_enabled
  label: Scan images on push
  type: boolean
  description: Ask ECR to run its basic vulnerability scan whenever a new image is pushed. Keep this on for early dependency and OS package findings; disable only if another scanner owns image scanning or duplicate findings are noisy.
  collapsible: true
  show_when:
    build_source:
      - dockerfile
      - railpack
      - nixpacks
  default: true
- id: ecr_force_deletion_enabled
  label: Force delete image repository
  type: boolean
  description: Allow the ECR repository to be deleted even when it contains images. Use with care.
  collapsible: true
  show_when:
    build_source:
      - dockerfile
      - railpack
      - nixpacks
  default: false
- $include: ./misc-section.yml
- id: new_deployment_forcing_enabled
  label: Force new deployment
  type: boolean
  description: Force ECS to start a new deployment when applying service configuration, even if the task definition did not change.
  default: true
- $include: ./tags.yml
- $include: ./terraform-settings.yml
