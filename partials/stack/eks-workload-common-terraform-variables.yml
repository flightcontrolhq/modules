# Terraform variables shared by every EKS workload stack.
#
# All three workloads point at the same compute/eks_service root module. Web
# adds the load balancer variables on top; worker and cron pass
# listener_arn: null and get nothing but the ECR repository, which is the same
# shape compute/ecs_service uses with a nullable load_balancer_attachment.
#
# The ECR repository exists only for the Dockerfile and Railpack build sources.
# On the image_registry path the module deploys an image someone else built and
# creates no repository of its own.
...overrides: << module.input.advanced_terraform_variables >>
name: << module.input.name >>
region: << module.input.aws_region >>
vpc_id: << module.input.vpc_id >>
ecr_repository_creation_enabled: << module.input.build_source == "dockerfile" || module.input.build_source == "railpack" >>
ecr_repository_name: << module.input.name >>
ecr_scan_on_push_enabled: << module.input.ecr_scan_on_push_enabled >>
ecr_force_deletion_enabled: << module.input.ecr_force_deletion_enabled >>
ecr_default_lifecycle_policy_enabled: true
tags:
  $include: ./ravion-tags.yml
