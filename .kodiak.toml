# .kodiak.toml
# Kodiak merges a PR labeled "0 - automerge 🚀" once its branch protection
# requirements are met. See https://kodiakhq.com/docs/config-reference
version = 1
merge.method = "merge"
merge.automerge_label = "0 - automerge 🚀"
merge.block_on_reviews_requested = true
merge.delete_branch_on_merge = true

[merge.message]
title = "pull_request_title"
body = "pull_request_body"
strip_html_comments = true
