# .kodiak.toml
# Kodiak merges a PR once its branch protection requirements are met:
# required approvals and passing checks. See https://kodiakhq.com/docs/config-reference
version = 1
merge.method = "merge"
merge.require_automerge_label = false
merge.block_on_reviews_requested = true
merge.delete_branch_on_merge = true

[merge.message]
title = "pull_request_title"
body = "pull_request_body"
strip_html_comments = true
